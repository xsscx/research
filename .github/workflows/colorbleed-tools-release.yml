###############################################################
# Copyright (c) 2026 David H Hoyt LLC
#
# Intent: Manual-trigger colorbleed_tools test suite that
#         publishes build + roundtrip results as a GitHub
#         Release with test artifacts attached.
#
# Based on: colorbleed-tools-build.yml
#
# Tools Under Test:
#   iccToXml_unsafe  - ICC binary -> XML conversion
#   iccFromXml_unsafe - XML -> ICC binary conversion
#   iccDumpAll       - enhanced ICC profile dump
#   iccDiagnosticLoad - diagnostic ICC profile loader
#
# Test Strategy:
#   1. Build with gcc and clang (matrix)
#   2. Roundtrip each test profile: ICC -> XML -> ICC
#   3. Compare file sizes and checksums
#   4. Build Windows static standalone diagnostic tools
#   5. Package results into a GitHub Release
#
###############################################################

name: "ColorBleed Tools Test Suite -> Release"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      test_profile_count:
        description: 'Number of test profiles to use (max 50)'
        required: false
        default: '25'
        type: string
      compiler:
        description: 'Compiler to use'
        required: false
        default: 'clang'
        type: choice
        options:
          - clang
          - gcc
          - both
      test_profile_name:
        description: 'Optional exact ICC profile basename to test instead of random selection'
        required: false
        default: ''
        type: string
      allow_roundtrip_failures:
        description: 'Allow release publication when roundtrip tests fail'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      windows_diagnostic_profile_url:
        description: 'ICC profile URL for Windows static diagnostic smoke test'
        required: false
        default: 'https://registry.color.org/profile-registry/profiles/Coated_Fogra39L_VIGC_300.icc'
        type: string
      release_tag_prefix:
        description: 'Release tag prefix (auto-appended with date+run)'
        required: false
        default: 'colorbleed-v6.0.1'
        type: string

concurrency:
  group: colorbleed-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_PROFILE_COUNT: ${{ github.event.inputs.test_profile_count || '25' }}
  TEST_PROFILE_NAME: ${{ github.event.inputs.test_profile_name || '' }}
  ALLOW_ROUNDTRIP_FAILURES: ${{ github.event.inputs.allow_roundtrip_failures || 'false' }}
  WINDOWS_DIAGNOSTIC_PROFILE_URL: ${{ github.event.inputs.windows_diagnostic_profile_url || 'https://registry.color.org/profile-registry/profiles/Coated_Fogra39L_VIGC_300.icc' }}

jobs:
  windows-static:
    name: "Windows static diagnostic tools"
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
      POWERSHELL_UPDATECHECK: Off
      DIAGNOSTIC_PROFILE_URL: ${{ github.event.inputs.windows_diagnostic_profile_url || 'https://registry.color.org/profile-registry/profiles/Coated_Fogra39L_VIGC_300.icc' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Build standalone Windows tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          git config --global credential.helper ""
          if (Test-Path env:GITHUB_TOKEN) { Remove-Item env:GITHUB_TOKEN }
          . .github/scripts/sanitize.ps1

          $iccDevDir = Join-Path $env:GITHUB_WORKSPACE 'colorbleed_tools\iccDEV'
          $iccSourceDir = Join-Path $iccDevDir 'Build\Cmake'
          $iccBuildDir = Join-Path $iccDevDir 'Build-windows-static'
          $toolsBuildDir = Join-Path $env:GITHUB_WORKSPACE 'colorbleed_tools\build-windows-static-tools'
          $toolsCmakeBuildDir = Join-Path $toolsBuildDir 'build'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'colorbleed-windows-static-x64'

          if (Test-Path $iccDevDir) { Remove-Item -Recurse -Force $iccDevDir }
          git clone --depth 1 https://github.com/InternationalColorConsortium/iccDEV.git $iccDevDir

          cmake -S $iccSourceDir `
            -B $iccBuildDir `
            -G 'Visual Studio 17 2022' `
            -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DENABLE_TOOLS=OFF `
            -DENABLE_TESTS=OFF `
            -DENABLE_WXWIDGETS=OFF `
            -DENABLE_IMAGE_TOOLS=OFF `
            -DENABLE_ICCXML=OFF `
            -DENABLE_ICCJSON=OFF `
            -DENABLE_CMM_TOOLS=OFF `
            -DENABLE_IIS_TOOLS=OFF `
            -DENABLE_SHARED_LIBS=OFF `
            -DENABLE_STATIC_LIBS=ON
          cmake --build $iccBuildDir --config Release --target IccProfLib2-static --parallel

          $profLib = Get-ChildItem -Path (Join-Path $iccBuildDir 'IccProfLib') `
            -Recurse -Filter 'IccProfLib2-static.lib' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $profLib) {
            throw 'IccProfLib2-static.lib was not produced'
          }

          New-Item -ItemType Directory -Force -Path $toolsBuildDir, $artifactDir | Out-Null

          $cmakeLists = @"
          cmake_minimum_required(VERSION 3.21)
          project(ColorBleedWindowsStatic LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_library(IccProfLib2Static STATIC IMPORTED GLOBAL)
          set_target_properties(IccProfLib2Static PROPERTIES
            IMPORTED_LOCATION "$($profLib.Replace('\', '/'))"
            INTERFACE_INCLUDE_DIRECTORIES "$($iccBuildDir.Replace('\', '/'))/IccProfLib;$($iccDevDir.Replace('\', '/'))/IccProfLib;$($iccDevDir.Replace('\', '/'))"
          )
          add_executable(iccDiagnosticLoad "$($env:GITHUB_WORKSPACE.Replace('\', '/'))/colorbleed_tools/IccDiagnosticLoad.cpp")
          add_executable(iccDumpAll "$($env:GITHUB_WORKSPACE.Replace('\', '/'))/colorbleed_tools/IccDumpAll.cpp")
          target_compile_definitions(iccDiagnosticLoad PRIVATE WIN32)
          target_compile_definitions(iccDumpAll PRIVATE WIN32)
          target_link_libraries(iccDiagnosticLoad PRIVATE IccProfLib2Static)
          target_link_libraries(iccDumpAll PRIVATE IccProfLib2Static)
          "@
          $cmakeLists | Out-File -FilePath (Join-Path $toolsBuildDir 'CMakeLists.txt') -Encoding ascii

          cmake -S $toolsBuildDir `
            -B $toolsCmakeBuildDir `
            -G 'Visual Studio 17 2022' `
            -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build $toolsCmakeBuildDir --config Release --parallel

          Copy-Item (Join-Path $toolsCmakeBuildDir 'Release\iccDiagnosticLoad.exe') $artifactDir
          Copy-Item (Join-Path $toolsCmakeBuildDir 'Release\iccDumpAll.exe') $artifactDir

          $profile = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'test-profiles') `
            -Filter '*.icc' -File |
            Sort-Object FullName |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $profile) {
            throw 'No test ICC profile found for Windows smoke test'
          }

          $repoDiagLog = Join-Path $artifactDir 'iccDiagnosticLoad-repo-smoke.txt'
          & (Join-Path $artifactDir 'iccDiagnosticLoad.exe') --compare $profile `
            | Tee-Object -FilePath $repoDiagLog
          & (Join-Path $artifactDir 'iccDumpAll.exe') --diag --read -v 10 $profile ALL `
            | Out-File -FilePath (Join-Path $artifactDir 'iccDumpAll-smoke.txt') -Encoding utf8

          $diagnosticProfile = Join-Path $artifactDir 'Coated_Fogra39L_VIGC_300.icc'
          Invoke-WebRequest -Uri $env:DIAGNOSTIC_PROFILE_URL -OutFile $diagnosticProfile
          $profileLength = (Get-Item $diagnosticProfile).Length
          if ($profileLength -ne 8652444) {
            throw "Downloaded diagnostic profile has unexpected size: $profileLength"
          }

          $fograDiagLog = Join-Path $artifactDir 'iccDiagnosticLoad-fogra-smoke.txt'
          & (Join-Path $artifactDir 'iccDiagnosticLoad.exe') --compare $diagnosticProfile `
            | Tee-Object -FilePath $fograDiagLog
          $fograDiagText = Get-Content $fograDiagLog -Raw
          if ($fograDiagText -notmatch 'OpenIccProfile OK' -or
              $fograDiagText -notmatch 'ReadIccProfile OK' -or
              $fograDiagText -notmatch 'ValidateIccProfile OK') {
            throw 'FOGRA diagnostic smoke test did not report all expected OK states'
          }

          & (Join-Path $artifactDir 'iccDumpAll.exe') --diag --read -v 10 $diagnosticProfile ALL `
            | Out-File -FilePath (Join-Path $artifactDir 'iccDumpAll-fogra-smoke.txt') -Encoding utf8
          Remove-Item $diagnosticProfile

          $checksumFile = Join-Path $artifactDir 'SHA256SUMS-windows-static-x64.txt'
          Get-ChildItem -Path $artifactDir -Filter '*.exe' |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
            } |
            Out-File -FilePath $checksumFile -Encoding ascii

          @(
            'ColorBleed Windows static x64 diagnostics'
            ''
            'Standalone tools:'
            '- iccDiagnosticLoad.exe'
            '- iccDumpAll.exe'
            ''
            'Built with MSVC /MT and linked to IccProfLib2-static.lib.'
            'No IccProfLib2.dll is required at runtime.'
            ''
            'Smoke coverage:'
            '- repository test profile diagnostic compare'
            '- Coated_Fogra39L_VIGC_300.icc diagnostic compare'
            '- Coated_Fogra39L_VIGC_300.icc diagnostic dump'
          ) | Out-File -FilePath (Join-Path $artifactDir 'README-windows-static-x64.txt') -Encoding ascii

          Compress-Archive -Path (Join-Path $artifactDir '*') `
            -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'colorbleed-windows-static-x64.zip') `
            -Force
          Copy-Item $checksumFile (Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS-windows-static-x64.txt')

          "### Windows Static Diagnostic Tools" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem -Path $artifactDir | ForEach-Object {
            "$(Sanitize-Line $_.Name) ($($_.Length) bytes)" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: colorbleed-windows-static-x64
          path: |
            colorbleed-windows-static-x64.zip
            SHA256SUMS-windows-static-x64.txt
          retention-days: 90

  build-test:
    name: "Build & Test (${{ matrix.compiler }})"
    needs: windows-static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASH_ENV: /dev/null
    strategy:
      fail-fast: false
      matrix:
        compiler: ${{ github.event.inputs.compiler == 'both' && fromJSON('["gcc","clang"]') || fromJSON(format('["{0}"]', github.event.inputs.compiler || 'clang')) }}
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    outputs:
      grand_total: ${{ steps.tests.outputs.grand_total }}
      grand_success: ${{ steps.tests.outputs.grand_success }}
      grand_failed: ${{ steps.tests.outputs.grand_failed }}
      clean_rate: ${{ steps.tests.outputs.clean_rate }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-env
        with:
          preset: 'colorbleed'
          extra-packages: 'liblzma-dev pkg-config libwxgtk3.2-dev wx-common'

      - name: Set compiler
        env:
          MATRIX_COMPILER: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          if [ "${MATRIX_COMPILER}" = "gcc" ]; then
            echo "CC=gcc"   >> "$GITHUB_ENV"
            echo "CXX=g++"  >> "$GITHUB_ENV"
          else
            echo "CC=clang-18"   >> "$GITHUB_ENV"
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi

      - name: Build colorbleed_tools via Makefile
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd colorbleed_tools
          make setup
          make test

      - name: Verify binaries
        working-directory: colorbleed_tools
        run: |
          set -euo pipefail
          echo "=== Binary Verification ==="
          ls -lh iccToXml_unsafe iccFromXml_unsafe iccDumpAll iccDiagnosticLoad
          file iccToXml_unsafe iccFromXml_unsafe iccDumpAll iccDiagnosticLoad
          echo "=== Static Linking Check ==="
          echo "Dynamic dependencies (only libc/libxml2 expected):"
          ldd iccToXml_unsafe 2>&1 || true
          ldd iccFromXml_unsafe 2>&1 || true
          ldd iccDumpAll 2>&1 || true
          ldd iccDiagnosticLoad 2>&1 || true
          sha256sum iccToXml_unsafe iccFromXml_unsafe iccDumpAll iccDiagnosticLoad | tee SHA256SUMS

      - name: Setup test profiles
        id: setup
        env:
          REQUESTED_PROFILE_COUNT: ${{ env.TEST_PROFILE_COUNT }}
          REQUESTED_PROFILE_NAME: ${{ env.TEST_PROFILE_NAME }}
        run: |
          set -euo pipefail
          source .github/scripts/icc-profile-quarantine.sh
          mkdir -p colorbleed-test-results/outputs/toxml
          mkdir -p colorbleed-test-results/outputs/roundtrip
          mkdir -p colorbleed-test-results/outputs/diffs

          PROFILE_COUNT="${REQUESTED_PROFILE_COUNT}"
          PROFILE_COUNT=$((PROFILE_COUNT > 50 ? 50 : PROFILE_COUNT))

          find test-profiles/ -type f -name "*.icc" | sort > /tmp/colorbleed-release-all.txt
          icc_profile_filter_quarantine /tmp/colorbleed-release-all.txt /tmp/colorbleed-release-routine.txt

          if [ -n "${REQUESTED_PROFILE_NAME}" ]; then
            awk -v wanted="${REQUESTED_PROFILE_NAME}" '
              BEGIN { found=0 }
              {
                n=split($0, parts, "/")
                if (parts[n] == wanted) {
                  print $0
                  found=1
                  exit
                }
              }
              END { if (!found) exit 1 }
            ' /tmp/colorbleed-release-routine.txt > colorbleed-test-results/selected-profiles.txt || {
              echo "::error::Requested profile not found after quarantine filtering: ${REQUESTED_PROFILE_NAME}"
              exit 1
            }
          else
            shuf -n ${PROFILE_COUNT} /tmp/colorbleed-release-routine.txt > colorbleed-test-results/selected-profiles.txt
          fi

          AVAILABLE=$(wc -l < colorbleed-test-results/selected-profiles.txt | tr -d ' \n\r')
          echo "test_count=${AVAILABLE}" >> $GITHUB_OUTPUT

          echo "Selected ${AVAILABLE} profiles for colorbleed roundtrip testing:"
          cat colorbleed-test-results/selected-profiles.txt

      - name: Run roundtrip conversion tests
        id: tests
        env:
          MATRIX_COMPILER: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh

          SUMMARY="colorbleed-test-results/test-summary.txt"
          echo "==================================================================" > $SUMMARY
          echo "ColorBleed Tools Roundtrip Test Report" >> $SUMMARY
          echo "==================================================================" >> $SUMMARY
          echo "" >> $SUMMARY
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $SUMMARY
          echo "Compiler: ${MATRIX_COMPILER} (${{ env.CXX }})" >> $SUMMARY
          echo "Tools: iccToXml_unsafe, iccFromXml_unsafe" >> $SUMMARY
          echo "Profiles: $(wc -l < colorbleed-test-results/selected-profiles.txt)" >> $SUMMARY
          echo "" >> $SUMMARY

          TOTAL=0
          SUCCESS=0
          FAILED=0

          while IFS= read -r profile; do
            TOTAL=$((TOTAL + 1))
            PROFILE_NAME=$(basename "$profile")
            XML_OUT="colorbleed-test-results/outputs/toxml/${PROFILE_NAME}.xml"
            RT_OUT="colorbleed-test-results/outputs/roundtrip/${PROFILE_NAME}"
            DIFF_OUT="colorbleed-test-results/outputs/diffs/${PROFILE_NAME}.diff.txt"
            printf '%s\n' "$profile" > colorbleed-test-results/current-profile.txt

            echo "[${TOTAL}] Testing: ${PROFILE_NAME}"
            echo "=== Profile: ${PROFILE_NAME} ===" >> $SUMMARY

            # Step 1: ICC -> XML
            TOXML_OK=false
            if timeout 30s ./colorbleed_tools/iccToXml_unsafe "${profile}" "$XML_OUT" > "colorbleed-test-results/outputs/toxml/${PROFILE_NAME}.log" 2>&1; then
              if [ -f "$XML_OUT" ] && [ -s "$XML_OUT" ]; then
                TOXML_OK=true
                XML_SIZE=$(stat -c%s "$XML_OUT" 2>/dev/null || echo 0)
                echo "  ICC->XML: OK ($XML_SIZE bytes)" >> $SUMMARY
                echo "  ICC->XML: OK ($XML_SIZE bytes)"
              else
                echo "  ICC->XML: FAIL (empty output)" >> $SUMMARY
                echo "  ICC->XML: FAIL (empty output)"
              fi
            else
              EXIT_CODE=$?
              echo "  ICC->XML: FAIL (exit $EXIT_CODE)" >> $SUMMARY
              echo "  ICC->XML: FAIL (exit $EXIT_CODE)"
              LOG_TAIL=$(tail -3 "colorbleed-test-results/outputs/toxml/${PROFILE_NAME}.log" 2>/dev/null || true)
              echo "  Log: $LOG_TAIL" >> $SUMMARY
            fi

            # Step 2: XML -> ICC (roundtrip)
            ROUNDTRIP_OK=false
            if [ "$TOXML_OK" = true ]; then
              if timeout 30s ./colorbleed_tools/iccFromXml_unsafe "$XML_OUT" "$RT_OUT" > "colorbleed-test-results/outputs/roundtrip/${PROFILE_NAME}.log" 2>&1; then
                if [ -f "$RT_OUT" ] && [ -s "$RT_OUT" ]; then
                  ROUNDTRIP_OK=true
                  RT_SIZE=$(stat -c%s "$RT_OUT" 2>/dev/null || echo 0)
                  ORIG_SIZE=$(stat -c%s "${profile}" 2>/dev/null || echo 0)
                  echo "  XML->ICC: OK ($RT_SIZE bytes, original: $ORIG_SIZE bytes)" >> $SUMMARY
                  echo "  XML->ICC: OK ($RT_SIZE bytes, original: $ORIG_SIZE bytes)"
                else
                  echo "  XML->ICC: FAIL (empty output)" >> $SUMMARY
                  echo "  XML->ICC: FAIL (empty output)"
                fi
              else
                EXIT_CODE=$?
                echo "  XML->ICC: FAIL (exit $EXIT_CODE)" >> $SUMMARY
                echo "  XML->ICC: FAIL (exit $EXIT_CODE)"
                LOG_TAIL=$(tail -3 "colorbleed-test-results/outputs/roundtrip/${PROFILE_NAME}.log" 2>/dev/null || true)
                echo "  Log: $LOG_TAIL" >> $SUMMARY
              fi
            else
              echo "  XML->ICC: SKIPPED (no XML from step 1)" >> $SUMMARY
              echo "  XML->ICC: SKIPPED"
            fi

            # Step 3: Compare sizes
            if [ "$ROUNDTRIP_OK" = true ]; then
              ORIG_SIZE=$(stat -c%s "${profile}" 2>/dev/null || echo 0)
              RT_SIZE=$(stat -c%s "$RT_OUT" 2>/dev/null || echo 0)
              if [ "$ORIG_SIZE" -eq "$RT_SIZE" ]; then
                ORIG_SHA=$(sha256sum "${profile}" | cut -d' ' -f1)
                RT_SHA=$(sha256sum "$RT_OUT" | cut -d' ' -f1)
                if [ "$ORIG_SHA" = "$RT_SHA" ]; then
                  echo "  Roundtrip: EXACT MATCH" >> $SUMMARY
                  echo "  Roundtrip: EXACT MATCH"
                else
                  echo "  Roundtrip: SIZE MATCH, CONTENT DIFFERS" >> $SUMMARY
                  echo "  Roundtrip: SIZE MATCH, CONTENT DIFFERS"
                fi
              else
                SIZE_DIFF=$((RT_SIZE - ORIG_SIZE))
                echo "  Roundtrip: SIZE DELTA ${SIZE_DIFF} bytes (orig=$ORIG_SIZE rt=$RT_SIZE)" >> $SUMMARY
                echo "  Roundtrip: SIZE DELTA ${SIZE_DIFF} bytes"
              fi

              SUCCESS=$((SUCCESS + 1))
              echo "  Status: SUCCESS" >> $SUMMARY
              else
                FAILED=$((FAILED + 1))
                echo "$PROFILE_NAME" >> colorbleed-test-results/failed-profiles.txt
                echo "  Status: FAILED" >> $SUMMARY
              fi

            echo "" >> $SUMMARY

          done < colorbleed-test-results/selected-profiles.txt

          # Final summary
          if [ "$TOTAL" -gt 0 ]; then
            RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS/$TOTAL)*100}")
          else
            RATE="0.0"
          fi

          echo "==================================================================" >> $SUMMARY
          echo "FINAL RESULTS (${MATRIX_COMPILER})" >> $SUMMARY
          echo "==================================================================" >> $SUMMARY
          echo "Total profiles:   $TOTAL" >> $SUMMARY
          echo "Roundtrip success: $SUCCESS" >> $SUMMARY
          echo "Roundtrip failed:  $FAILED" >> $SUMMARY
          echo "Success rate:      ${RATE}%" >> $SUMMARY
          echo "==================================================================" >> $SUMMARY

          cat $SUMMARY

          # Outputs for release job
          echo "grand_total=$TOTAL" >> $GITHUB_OUTPUT
          echo "grand_success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "grand_failed=$FAILED" >> $GITHUB_OUTPUT
          echo "clean_rate=$RATE" >> $GITHUB_OUTPUT

          # Env for summary step
          echo "grand_total=$TOTAL" >> $GITHUB_ENV
          echo "grand_success=$SUCCESS" >> $GITHUB_ENV
          echo "grand_failed=$FAILED" >> $GITHUB_ENV
          echo "clean_rate=$RATE" >> $GITHUB_ENV

      - name: Upload pre-release test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        if: always()
        with:
          name: colorbleed-pre-release-test-results-${{ matrix.compiler }}
          path: colorbleed-test-results/
          retention-days: 90

      - name: Enforce release quality gate
        env:
          ROUNDTRIP_FAILED: ${{ env.grand_failed }}
          ALLOW_FAILURES: ${{ env.ALLOW_ROUNDTRIP_FAILURES }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          if [ "${ROUNDTRIP_FAILED}" -gt 0 ] && [ "${ALLOW_FAILURES}" != "true" ]; then
            echo "::error::Roundtrip failures block release publication. Set allow_roundtrip_failures=true only for diagnostic-only releases."
            if [ -f colorbleed-test-results/failed-profiles.txt ]; then
              echo "::error::Failed profiles: $(tr '\n' ' ' < colorbleed-test-results/failed-profiles.txt)"
            fi
            exit 1
          fi

      - name: Generate checksums for binaries
        working-directory: colorbleed_tools
        run: |
          set -euo pipefail
          sha256sum iccToXml_unsafe iccFromXml_unsafe iccDumpAll iccDiagnosticLoad > SHA256SUMS
          cat SHA256SUMS

      - name: Download Windows static release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v7.0.0 (node24)
        with:
          name: colorbleed-windows-static-x64
          path: windows-release-assets

      - name: Package release assets
        id: package
        env:
          INPUT_TAG_PREFIX: ${{ github.event.inputs.release_tag_prefix || 'colorbleed-v6.0.1' }}
          MATRIX_COMPILER: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh

          TAG_PREFIX="$(sanitize_ref "$INPUT_TAG_PREFIX")"
          DATESTAMP="$(date -u '+%Y%m%d-%H%M%S')"
          RELEASE_TAG="${TAG_PREFIX}-${MATRIX_COMPILER}-${DATESTAMP}-run${GITHUB_RUN_NUMBER}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          # Copy binaries + checksums into results
          cp colorbleed_tools/iccToXml_unsafe  colorbleed-test-results/
          cp colorbleed_tools/iccFromXml_unsafe colorbleed-test-results/
          cp colorbleed_tools/iccDumpAll colorbleed-test-results/
          cp colorbleed_tools/iccDiagnosticLoad colorbleed-test-results/
          cp colorbleed_tools/SHA256SUMS        colorbleed-test-results/
          cp colorbleed_tools/test.xml          colorbleed-test-results/ 2>/dev/null || true
          cp colorbleed_tools/roundtrip.icc     colorbleed-test-results/ 2>/dev/null || true

          TARBALL="colorbleed-test-results-${MATRIX_COMPILER}-${DATESTAMP}.tar.gz"
          tar -czf "${TARBALL}" colorbleed-test-results/
          echo "tarball=${TARBALL}" >> $GITHUB_OUTPUT

          cp colorbleed-test-results/test-summary.txt "test-summary-${MATRIX_COMPILER}-${DATESTAMP}.txt"
          echo "summary_file=test-summary-${MATRIX_COMPILER}-${DATESTAMP}.txt" >> $GITHUB_OUTPUT

          cp colorbleed_tools/SHA256SUMS "SHA256SUMS-${MATRIX_COMPILER}.txt"
          echo "checksums_file=SHA256SUMS-${MATRIX_COMPILER}.txt" >> $GITHUB_OUTPUT

          # Copy binaries with compiler-stamped names for release upload
          cp colorbleed_tools/iccToXml_unsafe "iccToXml_unsafe-${MATRIX_COMPILER}"
          cp colorbleed_tools/iccFromXml_unsafe "iccFromXml_unsafe-${MATRIX_COMPILER}"
          cp colorbleed_tools/iccDumpAll "iccDumpAll-${MATRIX_COMPILER}"
          cp colorbleed_tools/iccDiagnosticLoad "iccDiagnosticLoad-${MATRIX_COMPILER}"
          chmod +x "iccToXml_unsafe-${MATRIX_COMPILER}" "iccFromXml_unsafe-${MATRIX_COMPILER}" \
            "iccDumpAll-${MATRIX_COMPILER}" "iccDiagnosticLoad-${MATRIX_COMPILER}"

          # Wrap binaries in tar.gz to preserve execute permissions
          tar -czf "iccToXml_unsafe-${MATRIX_COMPILER}.tar.gz" "iccToXml_unsafe-${MATRIX_COMPILER}"
          tar -czf "iccFromXml_unsafe-${MATRIX_COMPILER}.tar.gz" "iccFromXml_unsafe-${MATRIX_COMPILER}"
          tar -czf "iccDumpAll-${MATRIX_COMPILER}.tar.gz" "iccDumpAll-${MATRIX_COMPILER}"
          tar -czf "iccDiagnosticLoad-${MATRIX_COMPILER}.tar.gz" "iccDiagnosticLoad-${MATRIX_COMPILER}"

          ls -lh "${TARBALL}" "test-summary-${MATRIX_COMPILER}-${DATESTAMP}.txt" \
            "SHA256SUMS-${MATRIX_COMPILER}.txt" \
            "iccToXml_unsafe-${MATRIX_COMPILER}.tar.gz" \
            "iccFromXml_unsafe-${MATRIX_COMPILER}.tar.gz" \
            "iccDumpAll-${MATRIX_COMPILER}.tar.gz" \
            "iccDiagnosticLoad-${MATRIX_COMPILER}.tar.gz" \
            windows-release-assets/colorbleed-windows-static-x64.zip \
            windows-release-assets/SHA256SUMS-windows-static-x64.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          name: "ColorBleed v6.0.1 | Reading & Writing Unsafe Color Profiles"
          body: |
            ## ColorBleed Tools Roundtrip Test Results

            **Compiler:** `${{ matrix.compiler }}` (`${{ env.CXX }}`)

            | Metric | Value |
            |--------|-------|
            | **Total Profiles** | ${{ env.grand_total }} |
            | **Roundtrip Success** | ${{ env.grand_success }} |
            | **Roundtrip Failed** | ${{ env.grand_failed }} |
            | **Success Rate** | ${{ env.clean_rate }}% |

            ### Tools Tested
            | Tool | Description |
            |------|-------------|
            | `iccToXml_unsafe` | ICC binary -> XML conversion |
            | `iccFromXml_unsafe` | XML -> ICC binary conversion |
            | `iccDumpAll` | Enhanced ICC profile dump |
            | `iccDiagnosticLoad` | Diagnostic ICC profile loader |

            ### Windows Standalone Diagnostics
            The release includes `colorbleed-windows-static-x64.zip` containing:
            - `iccDiagnosticLoad.exe`
            - `iccDumpAll.exe`

            These Windows binaries are built with MSVC `/MT` and linked against
            `IccProfLib2-static.lib`; no `IccProfLib2.dll` is required at runtime.

            ### Test Methodology
            Each ICC profile is:
            1. Converted to XML via `iccToXml_unsafe`
            2. Converted back to ICC via `iccFromXml_unsafe`
            3. Compared for size match and content integrity

            ### Binary Checksums
            ```
            See SHA256SUMS attachment
            ```

            ### Build Info
            - **Triggered by:** @${{ github.actor }}
            - **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.summary_file }}
            ${{ steps.package.outputs.checksums_file }}
            iccToXml_unsafe-${{ matrix.compiler }}.tar.gz
            iccFromXml_unsafe-${{ matrix.compiler }}.tar.gz
            iccDumpAll-${{ matrix.compiler }}.tar.gz
            iccDiagnosticLoad-${{ matrix.compiler }}.tar.gz
            windows-release-assets/colorbleed-windows-static-x64.zip
            windows-release-assets/SHA256SUMS-windows-static-x64.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        if: always()
        with:
          name: colorbleed-test-results-${{ matrix.compiler }}
          path: colorbleed-test-results/
          retention-days: 90

      - name: Report to summary
        if: always()
        env:
          MATRIX_COMPILER: ${{ matrix.compiler }}
          CXX_NAME: ${{ env.CXX }}
          GRAND_TOTAL: ${{ env.grand_total }}
          GRAND_SUCCESS: ${{ env.grand_success }}
          GRAND_FAILED: ${{ env.grand_failed }}
          CLEAN_RATE: ${{ env.clean_rate }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true

          {
            echo "## ColorBleed Tools Roundtrip Test -> Release"
            echo ""
            echo "### Compiler: \`$(sanitize_line "${MATRIX_COMPILER}")\` (\`$(sanitize_line "${CXX_NAME}")\`)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Total Profiles | $(sanitize_line "${GRAND_TOTAL:-0}") |"
            echo "| Roundtrip Success | $(sanitize_line "${GRAND_SUCCESS:-0}") |"
            echo "| Roundtrip Failed | $(sanitize_line "${GRAND_FAILED:-0}") |"
            echo "| Success Rate | $(sanitize_line "${CLEAN_RATE:-0.0}")% |"
            echo ""
            echo "### Release"
            echo "**Tag:** \`$(sanitize_line "${RELEASE_TAG:-not-published}")\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${GRAND_FAILED:-0}" -eq 0 ]; then
            echo "### [OK] ALL ROUNDTRIPS SUCCESSFUL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### [WARN] $(sanitize_line "${GRAND_FAILED}") ROUNDTRIP FAILURE(S)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Final status
        env:
          MATRIX_COMPILER: ${{ matrix.compiler }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          GRAND_TOTAL: ${{ env.grand_total }}
          GRAND_SUCCESS: ${{ env.grand_success }}
          GRAND_FAILED: ${{ env.grand_failed }}
          CLEAN_RATE: ${{ env.clean_rate }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          echo "============================================"
          echo "  ColorBleed Tools -> Release COMPLETE"
          echo "============================================"
          echo "Compiler: ${MATRIX_COMPILER}"
          echo "Tag:      ${RELEASE_TAG:-not-published}"
          echo "Total:    ${GRAND_TOTAL:-0} profiles"
          echo "Success:  ${GRAND_SUCCESS:-0}"
          echo "Failed:   ${GRAND_FAILED:-0}"
          echo "Rate:     ${CLEAN_RATE:-0.0}%"
          echo "============================================"
          exit 0
