name: Convergence Test 1

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      profile_count:
        description: Number of random profiles to test (max 50)
        required: false
        default: "25"
        type: string

jobs:
  test:
    uses: ./.github/workflows/_test-profiles.yml
    with:
      profile-directory: extended-test-profiles
      profile-count: ${{ inputs.profile_count || '25' }}
      artifact-name: convergence-test-1-results
      report-title: Convergence Test 1 Results
