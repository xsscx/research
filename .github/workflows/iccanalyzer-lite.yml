name: iccAnalyzer-lite

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: iccanalyzer-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "iccanalyzer-lite - clang - Debug"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Configure environment
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          echo "Workflow:    ${WORKFLOW_NAME}"
          echo "Ref:         ${WORKFLOW_REF}"
          echo "Commit:      ${WORKFLOW_SHA}"
          echo "Runner OS:   ${RUNNER_OS_NAME}"

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-env

      - name: Print compiler version
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          echo "Compiler: clang++"
          clang++-18 --version | sed -n '1,1p'

          {
            echo "### Build Configuration"
            echo ""
            echo "**Compiler:**   clang++-18 ($(clang++-18 --version | sed -n '1,1p'))"
            echo "**Build Type:** Debug"
            echo "**Flags:**      ASAN + UBSAN + Coverage"
            echo "**Tool:**       iccanalyzer-lite"
          } >> $GITHUB_STEP_SUMMARY

      - name: Cache iccDEV repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.0.0 (node24)
        id: cache-iccdev
        with:
          path: iccanalyzer-lite/iccDEV
          key: ${{ runner.os }}-iccdev-lite-upstream-v1
          restore-keys: |
            ${{ runner.os }}-iccdev-lite-

      - name: Clone iccDEV dependency
        if: steps.cache-iccdev.outputs.cache-hit != 'true'
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite
          if [ ! -d "iccDEV" ]; then
            git clone https://github.com/InternationalColorConsortium/iccDEV.git
          fi
          cd iccDEV

          echo "iccDEV cloned at: $(pwd)"
          echo "iccDEV commit: $(git log --oneline -1)"

          {
            echo ""
            echo "### iccDEV Dependency"
            echo ""
            echo "**Location:** \`iccanalyzer-lite/iccDEV/\`"
            echo "**Commit:**   $(git log --oneline -1)"
          } >> $GITHUB_STEP_SUMMARY

      - name: Clean iccDEV source checkout
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          cd iccanalyzer-lite/iccDEV
          git reset --hard HEAD
          git clean -fdx
          dirty="$(git diff --name-only | grep -v '^Testing/' || true)"
          if [ -n "$dirty" ]; then
            echo "[FAIL] iccDEV dependency still has tracked modifications"
            printf '%s\n' "$dirty" | sed 's/^/  /'
            exit 1
          fi

      - name: Cache iccDEV build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.0.0 (node24)
        id: cache-iccdev-build
        with:
          path: |
            iccanalyzer-lite/iccDEV/Build/IccProfLib
            iccanalyzer-lite/iccDEV/Build/IccXML
          key: ${{ runner.os }}-iccdev-build-lite-debug-upstream-v2-${{ hashFiles('.github/workflows/iccanalyzer-lite.yml') }}

      - name: Build iccDEV libraries
        if: steps.cache-iccdev-build.outputs.cache-hit != 'true'
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite/iccDEV/Build

          # Prevent stale cmake cache from contaminating build
          rm -f CMakeCache.txt
          rm -rf CMakeFiles

          echo "Configuring CMake with instrumentation..."
          cmake Cmake \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fsanitize=integer -fsanitize-recover=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls -fprofile-instr-generate -fcoverage-mapping -O0 -g3" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fsanitize=integer -fsanitize-recover=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls -fprofile-instr-generate -fcoverage-mapping -O0 -g3 -std=c++17" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fprofile-instr-generate" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fprofile-instr-generate" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DENABLE_TOOLS=OFF \
            -DENABLE_WXWIDGETS=OFF \
            -DICC_LOG_SAFE=ON \
            -DICC_TRACE_NAN_ENABLED=ON \
            -Wno-dev

          echo "Building libraries with $(nproc) cores..."
          make -j$(nproc)

          echo "Verifying libraries..."
          ls -lh IccProfLib/libIccProfLib2-static*.a
          ls -lh IccXML/libIccXML2-static*.a

          {
            echo ""
            echo "### iccDEV Libraries Built"
            echo ""
            echo '```'
            ls -lh IccProfLib/libIccProfLib2-static*.a
            ls -lh IccXML/libIccXML2-static*.a
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Build iccanalyzer-lite
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite

          echo "Working directory: $(pwd)"
          echo "Building iccanalyzer-lite..."

          chmod +x build.sh
          ./build.sh

          echo "Build complete."
          ls -lh iccanalyzer-lite
          file iccanalyzer-lite

          {
            echo ""
            echo "### iccanalyzer-lite Binary"
            echo ""
            echo '```'
            ls -lh iccanalyzer-lite
            file iccanalyzer-lite
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Test iccanalyzer-lite
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite

          echo "=== Test 1: Help Output ==="
          ./iccanalyzer-lite --help || echo "Help test completed"

          echo ""
          echo "=== Test 2: Security Analysis ==="
          if [ -f "iccDEV/Testing/sRGB_v4_ICC_preference.icc" ]; then
            echo "Running heuristics analysis on test profile..."
            ./iccanalyzer-lite -h iccDEV/Testing/sRGB_v4_ICC_preference.icc || EXITCODE=$?
            echo "Security analysis completed with exit code ${EXITCODE:-0}"
          else
            echo "WARNING: Test profile not found, skipping analysis test"
          fi

          {
            echo ""
            echo "### Test Results"
            echo ""
            echo "- [PASS] Help output"
            echo "- [PASS] Security analysis execution"
          } >> $GITHUB_STEP_SUMMARY

      - name: Generate checksums
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite
          sha256sum iccanalyzer-lite > SHA256SUMS

          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS

          {
            echo ""
            echo "### SHA256 Checksums"
            echo ""
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: iccanalyzer-lite-instrumented
          path: |
            iccanalyzer-lite/iccanalyzer-lite
            iccanalyzer-lite/SHA256SUMS
            iccanalyzer-lite/*.gcda
            iccanalyzer-lite/*.gcno
          retention-days: 30

      - name: Generate build summary
        if: always()
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          {
            echo ""
            echo "---"
            echo ""
            echo "## Build Summary"
            echo ""
            echo "**Status:**     ${{ job.status }}"
            echo "**Tool:**       iccanalyzer-lite"
            echo "**Compiler:**   clang++"
            echo "**Build Type:** Debug"
            echo "**Features:**   AddressSanitizer, UndefinedBehaviorSanitizer, Coverage"
            echo "**Pattern:**    iccDEV libraries built with instrumentation"
            echo ""
            echo "### Artifacts"
            echo ""
            echo "- Binary: \`iccanalyzer-lite\` (instrumented)"
            echo "- Checksums: \`SHA256SUMS\`"
            echo "- Coverage: \`*.gcda\`, \`*.gcno\` files"
            echo "- Retention: 30 days"
          } >> $GITHUB_STEP_SUMMARY
