###############################################################
# Copyright (c) 2026 David H Hoyt LLC
#
# Intent: Build the imported BeyondRGB backend and frontend in
#         this research monorepo across Linux, macOS, and Windows
#         with the committed iccDEV/cpptrace/websocketpp submodules
#         and export reusable vcpkg dependency bundles.
#
# Derived from:
#   - InternationalColorConsortium/iccDEV demo-rit
#     .github/workflows/ci-beyondrgb-integration.yml
#   - InternationalColorConsortium/iccDEV
#     .github/workflows/ci-pr-action.yml
#
# Security:
#   - SHA-pinned marketplace actions
#   - persist-credentials: false
#   - bash --noprofile --norc and PowerShell strict mode
#   - credential helper reset and token neutering
#   - sanitized step summaries
###############################################################

name: CI BeyondRGB Integration

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      force_export_restore:
        description: "Bypass actions/cache and require restore from a published vcpkg export"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "beyondrgb/**"
      - ".github/workflows/ci-beyondrgb-integration.yml"
      - ".github/scripts/sanitize-sed.sh"
      - ".github/scripts/sanitize.ps1"
      - ".github/instructions/workflow-governance.instructions.md"

concurrency:
  group: beyondrgb-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_NO_UPDATE_NOTIFIER: 1
  GH_PROMPT_DISABLED: 1
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  build-unix:
    name: "BeyondRGB Unix - ${{ matrix.platform }} - ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Harden environment
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          fi

      - name: Validate sanitize-sed.sh
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          else
            echo "Missing sanitize-sed.sh" >&2
            exit 1
          fi

          result="$(sanitize_line '<script>alert(1)</script>')"
          expected='&lt;script&gt;alert(1)&lt;/script&gt;'
          if [[ "$result" != "$expected" ]]; then
            echo "Unexpected sanitizer output: [$result]" >&2
            exit 1
          fi

      - name: Compute vcpkg bundle metadata
        id: vcpkg-meta
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          schema=v2
          if command -v sha256sum >/dev/null 2>&1; then
            deps_sha=$(sha256sum beyondrgb/backend/dependencies.txt | awk '{print $1}')
          else
            deps_sha=$(shasum -a 256 beyondrgb/backend/dependencies.txt | awk '{print $1}')
          fi

          echo "cache_schema=${schema}" >> "${GITHUB_OUTPUT}"
          echo "dependencies_sha=${deps_sha}" >> "${GITHUB_OUTPUT}"
          echo "bundle_artifact_name=beyondrgb-vcpkg-${schema}-${{ matrix.platform }}-${{ matrix.arch }}-${deps_sha}" >> "${GITHUB_OUTPUT}"

      - name: Cache vcpkg
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_export_restore) }}
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        id: cache-vcpkg-unix
        with:
          path: beyondrgb/backend/vcpkg
          key: beyondrgb-vcpkg-${{ steps.vcpkg-meta.outputs.cache_schema }}-${{ runner.os }}-${{ matrix.arch }}-${{ steps.vcpkg-meta.outputs.dependencies_sha }}
          restore-keys: |
            beyondrgb-vcpkg-${{ steps.vcpkg-meta.outputs.cache_schema }}-${{ runner.os }}-${{ matrix.arch }}-
            beyondrgb-vcpkg-${{ steps.vcpkg-meta.outputs.cache_schema }}-${{ runner.os }}-

      - name: Restore prebuilt vcpkg export
        id: restore-vcpkg-unix
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_export_restore) || steps.cache-vcpkg-unix.outputs.cache-hit != 'true' }}
        env:
          BASH_ENV: /dev/null
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          artifact_name="${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}"
          artifact_root=".github/tmp/vcpkg-import/${{ matrix.platform }}-${{ matrix.arch }}"
          run_id="$(./.github/scripts/find-actions-artifact-run.sh "${GITHUB_REPOSITORY}" "ci-beyondrgb-integration.yml" "main" "${artifact_name}")"

          if [[ -n "${run_id}" ]]; then
            rm -rf "${artifact_root}"
            mkdir -p "${artifact_root}"
            if gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" -n "${artifact_name}" -D "${artifact_root}" && \
              ./.github/scripts/restore-vcpkg-export.sh "${artifact_root}" "${artifact_name}" "beyondrgb/backend/vcpkg"; then
              echo "restored=true" >> "${GITHUB_OUTPUT}"
              echo "Restored prebuilt vcpkg export from run ${run_id}."
            else
              echo "restored=false" >> "${GITHUB_OUTPUT}"
              echo "Failed to restore prebuilt vcpkg export from run ${run_id}; falling back to bootstrap."
              rm -rf "${artifact_root}" "beyondrgb/backend/vcpkg"
            fi
          else
            echo "restored=false" >> "${GITHUB_OUTPUT}"
            echo "No matching prebuilt vcpkg export found on main."
          fi

      - name: Require restored vcpkg export
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_export_restore }}
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          if [[ "${{ steps.restore-vcpkg-unix.outputs.restored }}" != 'true' ]]; then
            echo "force_export_restore=true requires a published vcpkg export for ${{ matrix.platform }}-${{ matrix.arch }}." >&2
            exit 1
          fi

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          fi
          sudo apt-get update -qq
          # shellcheck disable=SC2046
          sudo apt-get install -y --no-install-recommends $(cat beyondrgb/backend/apt-dependencies.txt)
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 14

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          BASH_ENV: /dev/null
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          fi
          brew install pkg-config autoconf automake libtool ninja

      - name: Install vcpkg dependencies
        working-directory: beyondrgb/backend
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          fi
          if [[ "${{ steps.cache-vcpkg-unix.outputs.cache-hit }}" == 'true' || "${{ steps.restore-vcpkg-unix.outputs.restored }}" == 'true' ]]; then
            echo "Using prebuilt vcpkg tree already present at $PWD/vcpkg."
            exit 0
          fi
          chmod +x ./*.sh
          export VCPKG_ROOT="$PWD/vcpkg"
          ./unix_config_environment.sh

      - name: Build BeyondRGB backend
        working-directory: beyondrgb/backend
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          fi
          ./unix_build.sh -m Release

      - name: Verify build
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          fi

          exe="beyondrgb/backend/build/Release/beyond-rgb-backend"
          if [[ ! -f "$exe" ]]; then
            echo "beyond-rgb-backend not found at $exe" >&2
            exit 1
          fi

          if [[ -f "beyondrgb/backend/build/Release/IccProfLib/libIccProfLib2-static.a" ]]; then
            ls -lh "beyondrgb/backend/build/Release/IccProfLib/libIccProfLib2-static.a"
          elif [[ -f "beyondrgb/backend/build/IccProfLib/libIccProfLib2-static.a" ]]; then
            ls -lh "beyondrgb/backend/build/IccProfLib/libIccProfLib2-static.a"
          else
            find beyondrgb/backend/build -name 'libIccProfLib2-static*.a' -print
          fi

          ls -lh "$exe"

      - name: Upload backend artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: beyondrgb-backend-${{ matrix.platform }}-${{ matrix.arch }}
          path: beyondrgb/backend/build/Release/
          if-no-files-found: error
          retention-days: 30

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: beyondrgb/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: beyondrgb/frontend
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          fi
          npm ci

      - name: Build BeyondRGB frontend
        working-directory: beyondrgb/frontend
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          fi
          chmod +x unix_release_frontend.sh
          ./unix_release_frontend.sh

      - name: Upload frontend artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: beyondrgb-frontend-${{ matrix.platform }}-${{ matrix.arch }}
          path: beyondrgb/frontend/out/
          if-no-files-found: error
          retention-days: 30

      - name: Export vcpkg dependency bundle
        working-directory: beyondrgb/backend
        env:
          BASH_ENV: /dev/null
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          fi
          export_dir="$RUNNER_TEMP/vcpkg-export"
          mkdir -p "$export_dir"
          artifact_base="${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}"
          ./vcpkg/vcpkg export \
            --x-all-installed \
            --zip \
            --dereference-symlinks \
            --output-dir "$export_dir" \
            --output "$artifact_base"
          if [[ -d vcpkg/.git ]]; then
            vcpkg_commit="$(git -C vcpkg rev-parse HEAD)"
          else
            vcpkg_commit="unknown"
          fi
          {
            echo "commit=$GITHUB_SHA"
            echo "platform=$MATRIX_PLATFORM"
            echo "arch=$MATRIX_ARCH"
            echo "dependencies_sha=${{ steps.vcpkg-meta.outputs.dependencies_sha }}"
            echo "vcpkg_commit=${vcpkg_commit}"
            echo "restore_path=beyondrgb/backend/vcpkg"
            echo "dependencies:"
            sed 's/^/- /' dependencies.txt
          } > "$export_dir/${artifact_base}.txt"

      - name: Upload vcpkg dependency bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: ${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}
          path: |
            ${{ runner.temp }}/vcpkg-export/${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}.zip
            ${{ runner.temp }}/vcpkg-export/${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write summary
        if: always()
        env:
          BASH_ENV: /dev/null
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          else
            escape_html() {
              local s="$1"
              s="${s//&/&amp;}"
              s="${s//</&lt;}"
              s="${s//>/&gt;}"
              s="${s//\"/&quot;}"
              s="${s//\'/&#39;}"
              printf '%s' "$s"
            }
            sanitize_line() { escape_html "$1"; }
          fi

          exe="beyondrgb/backend/build/Release/beyond-rgb-backend"
          binary_size="<missing>"
          if [[ -f "$exe" ]]; then
            binary_size="$(du -h "$exe" | cut -f1)"
          fi

          frontend_status="not built"
          if [[ "$MATRIX_PLATFORM" == "macos" ]] && compgen -G 'beyondrgb/frontend/out/make/zip/darwin/*/*.zip' > /dev/null; then
            frontend_status="zip package built"
          elif [[ "$MATRIX_PLATFORM" == "linux" ]] && \
               compgen -G 'beyondrgb/frontend/out/make/zip/linux/*/*.zip' > /dev/null && \
               compgen -G 'beyondrgb/frontend/out/make/deb/*/*.deb' > /dev/null && \
               compgen -G 'beyondrgb/frontend/out/make/rpm/*/*.rpm' > /dev/null; then
            frontend_status="zip, deb, and rpm packages built"
          elif [[ -d "beyondrgb/frontend/out" ]]; then
            frontend_status="frontend out directory present"
          fi

          vcpkg_bundle="not exported"
          vcpkg_bundle_path="$RUNNER_TEMP/vcpkg-export/${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}.zip"
          if [[ -f "$vcpkg_bundle_path" ]]; then
            vcpkg_bundle="$(du -h "$vcpkg_bundle_path" | cut -f1) zip exported"
          fi

          iccdev_commit="$(git -C beyondrgb/backend/submodules/iccDEV rev-parse --short HEAD)"

          {
            echo "## BeyondRGB Unix ($(sanitize_line "$MATRIX_PLATFORM")/$(sanitize_line "$MATRIX_ARCH"))"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Status | $(sanitize_line "$JOB_STATUS") |"
            echo "| Commit | \`$(sanitize_line "$GITHUB_SHA")\` |"
            echo "| iccDEV | \`$(sanitize_line "$iccdev_commit")\` |"
            echo "| Binary size | $(sanitize_line "$binary_size") |"
            echo "| Frontend | $(sanitize_line "$frontend_status") |"
            echo "| vcpkg export | $(sanitize_line "$vcpkg_bundle") |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: "BeyondRGB Windows - x86_64"
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Harden environment
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $ProgressPreference = 'SilentlyContinue'
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
          git config --global credential.helper ""
          foreach ($v in @('GITHUB_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_URL','ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
            if (Test-Path "Env:$v") { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          }
          . "$env:GITHUB_WORKSPACE\.github\scripts\sanitize.ps1"

      - name: Validate sanitize.ps1
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) { Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue }

          . "$env:GITHUB_WORKSPACE\.github\scripts\sanitize.ps1"
          $result = Sanitize-Line "<script>alert(1)</script>"
          $expected = "&lt;script&gt;alert(1)&lt;/script&gt;"
          if ($result -ne $expected) {
            throw "Unexpected sanitizer output: [$result]"
          }

      - name: Compute vcpkg bundle metadata
        id: vcpkg-meta
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $schema = 'v2'
          $depsSha = (Get-FileHash -Algorithm SHA256 "$env:GITHUB_WORKSPACE\beyondrgb\backend\dependencies.txt").Hash.ToLower()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "cache_schema=$schema"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dependencies_sha=$depsSha"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "bundle_artifact_name=beyondrgb-vcpkg-$schema-windows-x86_64-$depsSha"

      - name: Cache vcpkg
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_export_restore) }}
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        id: cache-vcpkg-windows
        with:
          path: beyondrgb/backend/vcpkg
          key: beyondrgb-vcpkg-${{ steps.vcpkg-meta.outputs.cache_schema }}-${{ runner.os }}-x86_64-${{ steps.vcpkg-meta.outputs.dependencies_sha }}
          restore-keys: |
            beyondrgb-vcpkg-${{ steps.vcpkg-meta.outputs.cache_schema }}-${{ runner.os }}-x86_64-
            beyondrgb-vcpkg-${{ steps.vcpkg-meta.outputs.cache_schema }}-${{ runner.os }}-

      - name: Restore prebuilt vcpkg export
        id: restore-vcpkg-windows
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_export_restore) || steps.cache-vcpkg-windows.outputs.cache-hit != 'true' }}
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}"
          artifact_root=".github/tmp/vcpkg-import/windows-x86_64"
          run_id="$(./.github/scripts/find-actions-artifact-run.sh "${GITHUB_REPOSITORY}" "ci-beyondrgb-integration.yml" "main" "${artifact_name}")"

          if [[ -n "${run_id}" ]]; then
            rm -rf "${artifact_root}"
            mkdir -p "${artifact_root}"
            if gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" -n "${artifact_name}" -D "${artifact_root}" && \
              ./.github/scripts/restore-vcpkg-export.sh "${artifact_root}" "${artifact_name}" "beyondrgb/backend/vcpkg"; then
              echo "restored=true" >> "${GITHUB_OUTPUT}"
              echo "Restored prebuilt vcpkg export from run ${run_id}."
            else
              echo "restored=false" >> "${GITHUB_OUTPUT}"
              echo "Failed to restore prebuilt vcpkg export from run ${run_id}; falling back to bootstrap."
              rm -rf "${artifact_root}" "beyondrgb/backend/vcpkg"
            fi
          else
            echo "restored=false" >> "${GITHUB_OUTPUT}"
            echo "No matching prebuilt vcpkg export found on main."
          fi

      - name: Require restored vcpkg export
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_export_restore }}
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ("${{ steps.restore-vcpkg-windows.outputs.restored }}" -ne 'true') {
            throw "force_export_restore=true requires a published vcpkg export for windows-x86_64."
          }

      - name: Install pkg-config-lite
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) { Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue }
          . "$env:GITHUB_WORKSPACE\.github\scripts\sanitize.ps1"

          winget install bloodrock.pkg-config-lite --disable-interactivity --accept-source-agreements --accept-package-agreements
          if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) {
            throw "pkg-config was not found after winget install"
          }

      - name: Build BeyondRGB backend
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global credential.helper ""
          foreach ($v in @('GITHUB_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_URL','ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
            if (Test-Path "Env:$v") { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          }
          . "$env:GITHUB_WORKSPACE\.github\scripts\sanitize.ps1"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          if (-not $vsInstall) {
            throw "Unable to locate a Visual Studio installation with C++ tools"
          }

          $buildScript = Join-Path $env:RUNNER_TEMP 'build-beyondrgb.cmd'
          @"
          @echo off
          setlocal enabledelayedexpansion
          call "$vsInstall\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cd /d "$env:GITHUB_WORKSPACE\beyondrgb\backend"
          if errorlevel 1 exit /b 1
          if /I "${{ steps.cache-vcpkg-windows.outputs.cache-hit }}"=="true" (
            echo Using prebuilt vcpkg tree already present at %CD%\vcpkg.
          ) else (
            if /I "${{ steps.restore-vcpkg-windows.outputs.restored }}"=="true" (
              echo Using prebuilt vcpkg tree already present at %CD%\vcpkg.
            ) else (
              call win_config_environment.bat
              if errorlevel 1 exit /b 1
            )
          )
          call win_build.bat -m Release
          if errorlevel 1 exit /b 1
          "@ | Out-File -FilePath $buildScript -Encoding ascii

          cmd.exe /d /c "`"$buildScript`""
          if ($LASTEXITCODE -ne 0) {
            throw "Windows backend build failed with exit code $LASTEXITCODE"
          }

      - name: Verify build
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) { Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue }
          . "$env:GITHUB_WORKSPACE\.github\scripts\sanitize.ps1"

          $exe = Join-Path $env:GITHUB_WORKSPACE 'beyondrgb\backend\build\Release\beyond-rgb-backend.exe'
          if (-not (Test-Path $exe)) {
            throw "beyond-rgb-backend.exe not found at $exe"
          }

          $lib = Get-ChildItem -Recurse -Path (Join-Path $env:GITHUB_WORKSPACE 'beyondrgb\backend\build') -Filter 'IccProfLib2-static.lib' | Select-Object -First 1
          if ($lib) {
            Get-Item $lib.FullName | Format-List FullName,Length
          }

          Get-Item $exe | Format-List FullName,Length

      - name: Upload backend artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: beyondrgb-backend-windows-x86_64
          path: beyondrgb/backend/build/Release/
          if-no-files-found: error
          retention-days: 30

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: beyondrgb/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: beyondrgb/frontend
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) { Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue }
          . "$env:GITHUB_WORKSPACE\.github\scripts\sanitize.ps1"
          npm ci

      - name: Build BeyondRGB frontend
        working-directory: beyondrgb/frontend
        shell: cmd
        run: call win_release_frontend.bat

      - name: Upload frontend artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: beyondrgb-frontend-windows-x86_64
          path: beyondrgb/frontend/out/
          if-no-files-found: error
          retention-days: 30

      - name: Export vcpkg dependency bundle
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global credential.helper ""
          foreach ($v in @('GITHUB_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_URL','ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
            if (Test-Path "Env:$v") { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          }
          . "$env:GITHUB_WORKSPACE\.github\scripts\sanitize.ps1"

          $exportDir = Join-Path $env:RUNNER_TEMP 'vcpkg-export'
          New-Item -ItemType Directory -Force -Path $exportDir | Out-Null
          $artifactBase = "${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}"

          & "$env:GITHUB_WORKSPACE\beyondrgb\backend\vcpkg\vcpkg.exe" export --x-all-installed --zip --output-dir $exportDir --output $artifactBase
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg export failed with exit code $LASTEXITCODE"
          }

          if (Test-Path "$env:GITHUB_WORKSPACE\beyondrgb\backend\vcpkg\.git") {
            $vcpkgCommit = (git -C "$env:GITHUB_WORKSPACE\beyondrgb\backend\vcpkg" rev-parse HEAD).Trim()
          } else {
            $vcpkgCommit = 'unknown'
          }
          $metadata = @(
            "commit=$env:GITHUB_SHA"
            'platform=windows'
            'arch=x86_64'
            "dependencies_sha=${{ steps.vcpkg-meta.outputs.dependencies_sha }}"
            "vcpkg_commit=$vcpkgCommit"
            'restore_path=beyondrgb/backend/vcpkg'
            'dependencies:'
          ) + (Get-Content "$env:GITHUB_WORKSPACE\beyondrgb\backend\dependencies.txt" | ForEach-Object { "- $_" })
          $metadata | Out-File -FilePath (Join-Path $exportDir "$artifactBase.txt") -Encoding ascii

      - name: Upload vcpkg dependency bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: ${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}
          path: |
            ${{ runner.temp }}/vcpkg-export/${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}.zip
            ${{ runner.temp }}/vcpkg-export/${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write summary
        if: always()
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: Off
          JOB_STATUS: ${{ job.status }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['*:ErrorAction'] = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global credential.helper ""
          if (Test-Path Env:GITHUB_TOKEN) { Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue }

          . "$env:GITHUB_WORKSPACE\.github\scripts\sanitize.ps1"

          $exe = Join-Path $env:GITHUB_WORKSPACE 'beyondrgb\backend\build\Release\beyond-rgb-backend.exe'
          $binarySize = '<missing>'
          if (Test-Path $exe) {
            $binarySize = ('{0:N2} MB' -f ((Get-Item $exe).Length / 1MB))
          }

          $iccdevCommit = (git -C "$env:GITHUB_WORKSPACE\beyondrgb\backend\submodules\iccDEV" rev-parse --short HEAD).Trim()
          $frontendStatus = 'not built'
          if (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'beyondrgb\frontend\out')) {
            $frontendStatus = 'frontend out directory present'
          }
          $frontendInstaller = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'beyondrgb\frontend\out\make\squirrel.windows') -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($frontendInstaller) {
            $frontendStatus = 'squirrel package built'
          }
          $vcpkgBundle = 'not exported'
          $vcpkgBundlePath = Join-Path $env:RUNNER_TEMP "vcpkg-export\${{ steps.vcpkg-meta.outputs.bundle_artifact_name }}.zip"
          if (Test-Path $vcpkgBundlePath) {
            $vcpkgBundle = ('{0:N2} MB zip exported' -f ((Get-Item $vcpkgBundlePath).Length / 1MB))
          }

          @"
          ## BeyondRGB Windows

          | Field | Value |
          |-------|-------|
          | Status | $(Sanitize-Line $env:JOB_STATUS) |
          | Commit | $(Sanitize-Line $env:GITHUB_SHA) |
          | iccDEV | $(Sanitize-Line $iccdevCommit) |
          | Binary size | $(Sanitize-Line $binarySize) |
          | Frontend | $(Sanitize-Line $frontendStatus) |
          | vcpkg export | $(Sanitize-Line $vcpkgBundle) |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
