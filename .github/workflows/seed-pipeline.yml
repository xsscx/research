name: Seed Pipeline

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      image_source:
        description: 'Directory containing source images (relative to repo root)'
        required: false
        default: 'temp'
        type: string
  push:
    branches: [main]
    paths:
      - 'test-profiles/*.icc'
      - '.github/scripts/seed-pipeline.sh'
      - '.github/scripts/craft-seeds.py'

jobs:
  generate-seeds:
    name: Generate ICC-embedded seeds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v5.0.0 (node24)
        with:
          persist-credentials: false

      - name: Install dependencies
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq exiftool
          pip3 install --quiet tifffile Pillow

      - name: Run craft-seeds.py
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          else
            escape_html() {
              local s="$1"
              s="${s//&/&amp;}" ; s="${s//</&lt;}" ; s="${s//>/&gt;}"
              s="${s//\"/&quot;}" ; s="${s//\'/&#39;}"
              printf '%s' "$s"
            }
            sanitize_line() { escape_html "$1"; }
          fi
          python3 .github/scripts/craft-seeds.py \
            --outdir seed-output/crafted \
            --profiles test-profiles
          echo "### Crafted Seeds" >> "$GITHUB_STEP_SUMMARY"
          echo "$(sanitize_line "$(ls seed-output/crafted/ | wc -l)") synthetic seeds generated" >> "$GITHUB_STEP_SUMMARY"

      - name: Run seed-pipeline.sh
        env:
          BASH_ENV: /dev/null
          INPUT_IMAGE_SOURCE: ${{ inputs.image_source || 'test-profiles' }}
        run: |
          set -euo pipefail
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          else
            escape_html() {
              local s="$1"
              s="${s//&/&amp;}" ; s="${s//</&lt;}" ; s="${s//>/&gt;}"
              s="${s//\"/&quot;}" ; s="${s//\'/&#39;}"
              printf '%s' "$s"
            }
            sanitize_line() { escape_html "$1"; }
          fi
          # Sanitize user-controllable input — strip hidden Unicode, path traversal, etc.
          image_dir="${INPUT_IMAGE_SOURCE}"
          # Reject path traversal attempts
          if [[ "$image_dir" == *..* ]] || [[ "$image_dir" == /* ]]; then
            echo "ERROR: Invalid image_source path"
            exit 1
          fi
          if [ ! -d "$image_dir" ]; then
            echo "Image directory '$image_dir' not found, using test-profiles/"
            image_dir="test-profiles"
          fi
          .github/scripts/seed-pipeline.sh "$image_dir"
          echo "### Pipeline Seeds" >> "$GITHUB_STEP_SUMMARY"
          echo "$(sanitize_line "$(ls temp/pipeline-staging/embedded/ 2>/dev/null | wc -l)") ICC-embedded seeds" >> "$GITHUB_STEP_SUMMARY"
          echo "$(sanitize_line "$(ls temp/pipeline-staging/rejected/ 2>/dev/null | wc -l)") rejected files" >> "$GITHUB_STEP_SUMMARY"

      - name: Package seed corpus
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          else
            escape_html() {
              local s="$1"
              s="${s//&/&amp;}" ; s="${s//</&lt;}" ; s="${s//>/&gt;}"
              s="${s//\"/&quot;}" ; s="${s//\'/&#39;}"
              printf '%s' "$s"
            }
            sanitize_line() { escape_html "$1"; }
          fi
          mkdir -p seed-output/tiff seed-output/icc
          # Collect TIFF seeds
          cp seed-output/crafted/*.tiff seed-output/tiff/ 2>/dev/null || true
          cp temp/pipeline-staging/embedded/*.tiff seed-output/tiff/ 2>/dev/null || true
          cp temp/pipeline-staging/embedded/*.tif seed-output/tiff/ 2>/dev/null || true
          # Collect ICC seeds (extracted from embedded images)
          for f in seed-output/crafted/*.tiff; do
            [ -f "$f" ] || continue
            bn=$(basename "$f" .tiff)
            exiftool -ICC_Profile -b "$f" > "seed-output/icc/${bn}.icc" 2>/dev/null || true
            [ -s "seed-output/icc/${bn}.icc" ] || rm -f "seed-output/icc/${bn}.icc"
          done
          echo "### Packaged Output" >> "$GITHUB_STEP_SUMMARY"
          echo "- TIFF seeds: $(sanitize_line "$(ls seed-output/tiff/ | wc -l)")" >> "$GITHUB_STEP_SUMMARY"
          echo "- ICC seeds: $(sanitize_line "$(ls seed-output/icc/ | wc -l)")" >> "$GITHUB_STEP_SUMMARY"
          tar czf seed-corpus.tar.gz -C seed-output .

      - name: Upload seed corpus artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: seed-corpus-${{ github.sha }}
          path: seed-corpus.tar.gz
          retention-days: 30
