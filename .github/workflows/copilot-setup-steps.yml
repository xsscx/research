###############################################################
# Copilot Coding Agent - Environment Setup
#
# Pulls pre-built Docker image with iccanalyzer-lite,
# icctest, colorbleed_tools, and MCP server. Extracts binaries to the
# workspace so the coding agent can run them directly.
#
# Image built by: mcp-server-docker.yml
# Registry: ghcr.io/xsscx/icc-profile-mcp:latest
#
# Ref: https://docs.github.com/en/copilot/customizing-copilot/
#      customizing-the-development-environment-for-copilot-coding-agent
###############################################################

name: Copilot Setup Steps

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-workflow-scripts
          sparse-checkout: .github/scripts/sanitize-sed.sh
          sparse-checkout-cone-mode: false

      - name: Pull image and extract binaries
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.trusted-workflow-scripts/.github/scripts/sanitize-sed.sh"
          # shellcheck source=/dev/null
          source "$SANITIZER"
          docker pull --quiet ghcr.io/xsscx/icc-profile-mcp:latest
          CID=$(docker create ghcr.io/xsscx/icc-profile-mcp:latest)
          docker cp "$CID":/app/iccanalyzer-lite/iccanalyzer-lite iccanalyzer-lite/iccanalyzer-lite
          mkdir -p iccanalyzer-lite/icctest/build/cli
          docker cp "$CID":/app/iccanalyzer-lite/icctest/build/cli/icctest iccanalyzer-lite/icctest/build/cli/icctest
          docker cp "$CID":/app/colorbleed_tools/iccToXml_unsafe colorbleed_tools/iccToXml_unsafe
          docker cp "$CID":/app/colorbleed_tools/iccFromXml_unsafe colorbleed_tools/iccFromXml_unsafe
          docker rm "$CID" > /dev/null
          chmod +x iccanalyzer-lite/iccanalyzer-lite iccanalyzer-lite/icctest/build/cli/icctest colorbleed_tools/icc*_unsafe

      - name: Install MCP server and verify
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          SANITIZER="$GITHUB_WORKSPACE/.trusted-workflow-scripts/.github/scripts/sanitize-sed.sh"
          # shellcheck source=/dev/null
          source "$SANITIZER"
          pip install --quiet --no-cache-dir ./mcp-server[dev]
          echo "--- iccanalyzer-lite ---"
          iccanalyzer-lite/iccanalyzer-lite --version 2>&1 | sed -n '1,3p'
          echo "--- icctest ---"
          iccanalyzer-lite/icctest/build/cli/icctest --version 2>&1 | sed -n '1,3p'
          echo "--- colorbleed_tools ---"
          ls -la colorbleed_tools/icc*_unsafe
          echo "--- MCP server ---"
          python -c "from icc_profile_mcp import mcp; print('[OK]')"
          echo "--- analyze-profile.sh ---"
          test -x .github/scripts/analyze-profile.sh && echo "[OK]" || echo "[FAIL] missing"
