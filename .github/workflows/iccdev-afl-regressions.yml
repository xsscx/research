name: iccDEV AFL Regressions

permissions:
  contents: read

on:
  push:
    paths:
      - '.github/workflows/iccdev-afl-regressions.yml'
      - 'afl/*.sh'
      - 'afl/targets.sh'
      - '.github/scripts/validate-afl-applynamedcmm-targets.sh'
      - '.github/scripts/validate-afl-target-configs.sh'
      - '.github/scripts/validate-afl-jpeg-seeds.sh'
  pull_request:
    paths:
      - '.github/workflows/iccdev-afl-regressions.yml'
      - 'afl/*.sh'
      - 'afl/targets.sh'
      - '.github/scripts/validate-afl-applynamedcmm-targets.sh'
      - '.github/scripts/validate-afl-target-configs.sh'
      - '.github/scripts/validate-afl-jpeg-seeds.sh'
  workflow_dispatch:

concurrency:
  group: iccdev-afl-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  afl-script-smoke:
    name: AFL script and report smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null
      AFL_BASE: /tmp/afl-script-smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl shellcheck

      - name: Validate AFL shell scripts
        run: |
          set -euo pipefail
          shellcheck afl/report.sh afl/run-all.sh afl/status.sh afl/targets.sh \
            afl/build-afl-runtime.sh \
            .github/scripts/validate-afl-applynamedcmm-targets.sh \
            .github/scripts/validate-afl-target-configs.sh \
            .github/scripts/validate-afl-jpeg-seeds.sh
          bash -n afl/*.sh

      - name: Validate ApplyNamedCmm AFL target contracts
        run: |
          set -euo pipefail
          .github/scripts/validate-afl-applynamedcmm-targets.sh

      - name: Validate all AFL target configurations
        run: |
          set -euo pipefail
          .github/scripts/validate-afl-target-configs.sh

      - name: Validate JPEG AFL seed policy
        run: |
          set -euo pipefail
          .github/scripts/validate-afl-jpeg-seeds.sh

      - name: Smoke report pipeline
        run: |
          set -euo pipefail
          ./afl/report.sh jpegdump --stats-only --report-root /tmp/afl-report-smoke
          test -s /tmp/afl-report-smoke/index.md
          test -s /tmp/afl-report-smoke/status.json
          test -s /tmp/afl-report-smoke/targets.tsv
          test -s /tmp/afl-report-smoke/summary.tsv
          ./afl/run-all.sh jpegdump --dry-run --seconds 1 --no-report
