###############################################################
# Copyright (c) 2026 David H Hoyt LLC
#
# Intent: Run iccanalyzer-lite unit tests (290 tests)
#         - Exit code validation
#         - Analysis mode verification
#         - Heuristic detection (H1-H171)
#         - ASAN/UBSAN cleanliness
#         - Synthesized corpus + repo profile testing
#         - JSON/XML/Report output validation
#         - PAWG report validation
#         - LUT Text I/O and .cube round-trip
#
# Last Updated: 2026-03-19
###############################################################

name: iccAnalyzer-lite Unit Tests

permissions:
  contents: read

on:
  push:
    paths:
      - 'iccanalyzer-lite/**'
      - '.github/workflows/iccanalyzer-lite-unit-tests.yml'
  pull_request:
    paths:
      - 'iccanalyzer-lite/**'
  workflow_dispatch:

concurrency:
  group: iccanalyzer-lite-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "Unit Tests • clang • ASAN+UBSAN"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Configure environment
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          echo "Workflow:    ${WORKFLOW_NAME}"
          echo "Ref:         ${WORKFLOW_REF}"
          echo "Commit:      ${WORKFLOW_SHA}"
          echo "Runner OS:   ${RUNNER_OS_NAME}"

      - name: Cache APT packages
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        id: cache-apt
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles(format('.github/workflows/{0}', github.workflow_ref)) }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install build dependencies
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != 'true' ]; then
            sudo apt-get update -qq
          else
            echo "Using cached APT packages"
          fi
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            clang \
            libxml2-dev \
            libtiff-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            liblzma-dev \
            nlohmann-json3-dev \
            libssl-dev \
            python3

      - name: Print compiler version
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          echo "Compiler: clang++"
          clang++ --version | head -n 1

          {
            echo "### Build Configuration"
            echo ""
            echo "**Compiler:**   clang++ ($(clang++ --version | head -n 1))"
            echo "**Build Type:** Debug"
            echo "**Flags:**      ASAN + UBSAN"
            echo "**Tool:**       iccanalyzer-lite unit tests"
          } >> $GITHUB_STEP_SUMMARY

      - name: Clone iccDEV dependency
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          rm -rf iccanalyzer-lite/iccDEV
          git clone --depth 1 https://github.com/InternationalColorConsortium/iccDEV.git iccanalyzer-lite/iccDEV
          cd iccanalyzer-lite/iccDEV

          echo "iccDEV cloned at: $(pwd)"
          echo "iccDEV commit: $(git log --oneline -1)"

          {
            echo ""
            echo "### iccDEV Dependency"
            echo ""
            echo "**Location:** \`iccanalyzer-lite/iccDEV/\`"
            echo "**Commit:**   $(git log --oneline -1)"
          } >> $GITHUB_STEP_SUMMARY

      - name: Normalize upstream iccDEV source
        run: |
          set -euo pipefail
          # Strip stray U+FE0F (emoji variation selector) from upstream source
          SIGUTILS="iccanalyzer-lite/iccDEV/IccProfLib/IccSignatureUtils.h"
          if grep -qP '\xef\xb8\x8f' "$SIGUTILS" 2>/dev/null; then
            sed -i 's/\xef\xb8\x8f//g' "$SIGUTILS"
            echo "[OK] Stripped stray U+FE0F from IccSignatureUtils.h"
          fi

      - name: Build iccDEV libraries
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite/iccDEV/Build
          find . -mindepth 1 -maxdepth 1 ! -name Cmake ! -name XCode -exec rm -rf {} +

          echo "Configuring CMake with instrumentation..."
          cmake Cmake \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fsanitize=integer -fsanitize-recover=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls -fprofile-instr-generate -fcoverage-mapping -O0 -g3" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fsanitize=integer -fsanitize-recover=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls -fprofile-instr-generate -fcoverage-mapping -O0 -g3 -std=c++17" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fprofile-instr-generate" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fprofile-instr-generate" \
            -DENABLE_TOOLS=OFF \
            -DICC_LOG_SAFE=ON \
            -DICC_TRACE_NAN_ENABLED=ON \
            -Wno-dev

          echo "Building libraries with $(nproc) cores..."
          make -j$(nproc)

          echo "Verifying libraries..."
          ls -lh IccProfLib/libIccProfLib2-static.a
          ls -lh IccXML/libIccXML2-static.a

          {
            echo ""
            echo "### iccDEV Libraries Built"
            echo ""
            echo '```'
            ls -lh IccProfLib/libIccProfLib2-static.a
            ls -lh IccXML/libIccXML2-static.a
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Build iccanalyzer-lite
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite

          echo "Working directory: $(pwd)"
          echo "Building iccanalyzer-lite..."

          chmod +x build.sh
          ./build.sh

          echo "Build complete."
          ls -lh iccanalyzer-lite
          file iccanalyzer-lite

          {
            echo ""
            echo "### iccanalyzer-lite Binary"
            echo ""
            echo '```'
            ls -lh iccanalyzer-lite
            file iccanalyzer-lite
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Build icctest V2
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite/icctest
          chmod +x build.sh
          bash build.sh

          echo "icctest build complete."
          ls -lh build/cli/icctest
          ls -lh build/lib/libIccTest.a
          ls -lh build/lib/tests/icctest_unit_tests

          # Verify ASAN instrumentation
          if nm build/cli/icctest 2>/dev/null | grep -q "__asan_init"; then
            echo "[OK] icctest ASan instrumentation detected"
          else
            echo "[WARN] icctest ASan symbols not found"
          fi

          {
            echo ""
            echo "### icctest V2 Binary"
            echo ""
            echo '```'
            ls -lh build/cli/icctest
            ls -lh build/lib/libIccTest.a
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Run icctest V2 unit tests
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
          ASAN_OPTIONS: "detect_leaks=0"
          LLVM_PROFILE_FILE: "/dev/null"
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          echo "Running icctest V2 unit tests..."
          iccanalyzer-lite/icctest/build/lib/tests/icctest_unit_tests

      - name: Run icctest V2 parity verification
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite/icctest
          cmake --build build --target icctest-verify-parity

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(Path("build/parity-artifacts/verify-parity-summary.json").read_text())
          summary = payload["summary"]
          raw_counts = summary["rawParity"]["counts"]
          outer_counts = summary["imageParity"]["outerImage"]["counts"]
          embedded_counts = summary["imageParity"]["embeddedRaw"]["counts"]

          print("")
          print("### icctest V2 Parity Verification")
          print("")
          print(f"- Status: `{summary['status']}`")
          print(f"- Raw parity delta: `{raw_counts.get('delta', 0)}`")
          print(f"- Image outer delta: `{outer_counts.get('delta', 0)}`")
          print(f"- Embedded raw delta: `{embedded_counts.get('delta', 0)}`")
          print(f"- Unit tests: `{summary['unitTests'].get('summaryLine', '')}`")
          print(f"- Generated image smoke: `{summary['generatedImageSmoke'].get('status', 'unknown')}`")
          print("- Artifact: `iccanalyzer-lite/icctest/build/parity-artifacts`")
          PY

      - name: Exercise icctest V2 CLI
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
          ASAN_OPTIONS: "detect_leaks=0,halt_on_error=0"
          LLVM_PROFILE_FILE: "/dev/null"
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          ICCTEST="iccanalyzer-lite/icctest/build/cli/icctest"
          PROFILE="test-profiles/sRGB_D65_MAT.icc"

          echo "=== icctest --version ==="
          $ICCTEST --version

          echo "=== icctest --registry ==="
          $ICCTEST --registry | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Registry: {d[\"totalChecks\"]} checks')"

          echo "=== icctest -a (comprehensive) ==="
          $ICCTEST -a "$PROFILE" > /dev/null 2>&1 || true

          echo "=== icctest --json ==="
          $ICCTEST --json "$PROFILE" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'JSON: {d[\"stats\"][\"checksRun\"]} checks, {d[\"stats\"][\"findingsTotal\"]} findings')" || true

          echo "=== icctest --sarif ==="
          $ICCTEST --sarif "$PROFILE" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'SARIF: {len(d[\"runs\"][0][\"results\"])} results')" || true

          echo "=== icctest --no-sandbox ==="
          $ICCTEST --no-sandbox -a "$PROFILE" > /dev/null 2>&1 || true

          echo "=== icctest --min-severity HIGH ==="
          $ICCTEST --min-severity HIGH --json "$PROFILE" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'HIGH+ filter: {d[\"stats\"][\"findingsTotal\"]} findings')" || true

          echo "[OK] All icctest V2 CLI modes exercised successfully"

          {
            echo ""
            echo "### icctest V2 CLI Exercise"
            echo ""
            echo "✅ All CLI modes exercised: -a, --json, --sarif, --registry, --version, --no-sandbox, --min-severity"
          } >> $GITHUB_STEP_SUMMARY

      - name: Synthesize test corpus
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite/tests
          python3 synthesize_profiles.py
          echo "Corpus files:"
          ls -la corpus/

      - name: Run unit tests
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
          ASAN_OPTIONS: "detect_leaks=0"
          LLVM_PROFILE_FILE: "/dev/null"
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite/tests
          python3 run_tests.py -v --xml test-results.xml
          echo ""
          echo "Unit test suite passed."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: unit-test-results
          path: iccanalyzer-lite/tests/test-results.xml
          if-no-files-found: warn

      - name: Upload icctest parity artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: icctest-parity-artifacts-unit-tests
          path: iccanalyzer-lite/icctest/build/parity-artifacts/
          if-no-files-found: warn

      - name: Upload icctest CLI bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: icctest-cli-unit-tests
          path: |
            iccanalyzer-lite/icctest/build/cli/icctest
            iccanalyzer-lite/icctest/build/tools/icctest-parity
            iccanalyzer-lite/icctest/README.md
            iccanalyzer-lite/icctest/tools/heuristic-remap.tsv
          if-no-files-found: warn

      - name: Generate summary
        if: always()
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          {
            echo ""
            echo "## iccAnalyzer-lite Unit Tests"
            echo ""
            if [ -f iccanalyzer-lite/tests/test-results.xml ]; then
              total=$(grep -o 'tests="[0-9]*"' iccanalyzer-lite/tests/test-results.xml | head -1 | grep -o '[0-9]*')
              failures=$(grep -o 'failures="[0-9]*"' iccanalyzer-lite/tests/test-results.xml | head -1 | grep -o '[0-9]*')
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| Total tests | ${total} |"
              echo "| Passed | $((total - failures)) |"
              echo "| Failed | ${failures} |"
              echo ""
              if [ "${failures}" = "0" ]; then
                echo "✅ All tests passed"
              else
                echo "❌ ${failures} test(s) failed"
              fi
            else
              echo "⚠️ Test results file not found"
            fi
          } >> $GITHUB_STEP_SUMMARY
