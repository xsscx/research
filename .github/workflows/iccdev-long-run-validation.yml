name: iccDEV Long-Run Validation

# Long CMake invocations are intentionally kept as single commands.
# yamllint disable rule:line-length

permissions:
  actions: read
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact 40-character upstream iccDEV commit SHA'
        required: false
        default: ''
        type: string
      upstream_pr:
        description: 'Open upstream iccDEV PR number (alternative to target_sha)'
        required: false
        default: ''
        type: string

concurrency:
  group: iccdev-long-run-${{ inputs.target_sha || inputs.upstream_pr || github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve-target:
    name: Resolve immutable upstream target
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: resolve
        env:
          BASH_ENV: /dev/null
          TARGET_SHA: ${{ inputs.target_sha }}
          UPSTREAM_PR: ${{ inputs.upstream_pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          if [[ -n "$TARGET_SHA" && -n "$UPSTREAM_PR" ]]; then
            echo "Specify target_sha or upstream_pr, not both." >&2
            exit 1
          fi
          if [[ -n "$UPSTREAM_PR" ]]; then
            [[ "$UPSTREAM_PR" =~ ^[1-9][0-9]*$ ]] || exit 1
            sha="$(gh api "repos/InternationalColorConsortium/iccDEV/pulls/$UPSTREAM_PR" --jq .head.sha)"
          elif [[ -n "$TARGET_SHA" ]]; then
            [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
            sha="$(gh api "repos/InternationalColorConsortium/iccDEV/commits/$TARGET_SHA" --jq .sha)"
          else
            sha="$(gh api "repos/InternationalColorConsortium/iccDEV/commits/master" --jq .sha)"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'sha=%s\n' "$(sanitize_line "$sha")" >> "$GITHUB_OUTPUT"

  unix:
    name: Unix ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.build_type }}
    needs: resolve-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
        compiler: [gcc, clang]
        build_type: [Release, Debug]
        exclude:
          - os: macos-15-intel
            compiler: gcc
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh
          if [[ "$RUNNER_OS" == Linux ]]; then
            bash .github/scripts/configure-llvm-22.sh
            sudo apt-get install -y --no-install-recommends build-essential cmake clang-22 libclang-rt-22-dev libbrotli-dev libfreetype-dev libjpeg-dev libpng-dev libtiff-dev libxml2-dev libssl-dev nlohmann-json3-dev
          else
            for formula in bash brotli cmake coreutils freetype libjpeg libpng libtiff libxml2 nlohmann-json llvm@22; do
              brew list --versions "$formula" >/dev/null || brew install "$formula"
            done
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          fi
      - name: Install CTest Python dependencies
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          if [[ "$RUNNER_OS" == macOS ]]; then
            source .github/scripts/configure-macos-clang-22.sh
          fi
          python -m pip install --no-cache-dir \
            "numpy>=2.0.0,<2.4" \
            "tifffile>=2024.8.30,<2025" \
            "pillow==13.0.0" \
            --quiet
          if [[ "$RUNNER_OS" == macOS && "$(uname -m)" == x86_64 ]]; then
            CFLAGS="${CFLAGS:-} -fgnu89-inline" \
              CG_LIMITED_API=0 \
              IMAGECODECS_ONLY=imcd \
              python -m pip install --no-cache-dir \
                --no-binary=imagecodecs \
                "imagecodecs==2026.10.10" \
                --quiet
          else
            python -m pip install --no-cache-dir \
              "imagecodecs==2026.10.10" \
              --quiet
          fi
          python -m pip check
          python - <<'PY'
          import imagecodecs
          from imagecodecs import _imcd

          assert _imcd.IMCD.available
          data = b"iccdev-lzw-check"
          assert imagecodecs.lzw_decode(imagecodecs.lzw_encode(data)) == data
          PY
          printf 'ICCDEV_SPECTRAL_PREVIEW_PYTHON=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          BASH_ENV: /dev/null
          MATRIX_COMPILER: ${{ matrix.compiler }}
          MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh
          if [[ "$MATRIX_COMPILER" == gcc ]]; then
            export CC=gcc CXX=g++
          elif [[ "$RUNNER_OS" == macOS ]]; then
            homebrew_prefix="$(brew --prefix)"
            coreutils_prefix="$(brew --prefix coreutils)"
            export PATH="$homebrew_prefix/bin:$coreutils_prefix/libexec/gnubin:$PATH"
            bash -c 'type mapfile' >/dev/null
            timeout --version | grep -q 'GNU coreutils'
            source .github/scripts/configure-macos-clang-22.sh
            specsep_timeout="$(sed -n '/iccdev\.specsep-corpus-matrix/{n;p;}' iccDEV/Build/Cmake/Testing/CMakeLists.txt)"
            [[ "$specsep_timeout" == "    180" ]]
            sed -i.bak '/iccdev\.specsep-corpus-matrix/{n;s/180/600/;}' iccDEV/Build/Cmake/Testing/CMakeLists.txt
            specsep_timeout="$(sed -n '/iccdev\.specsep-corpus-matrix/{n;p;}' iccDEV/Build/Cmake/Testing/CMakeLists.txt)"
            [[ "$specsep_timeout" == "    600" ]]
          else
            export CC=clang-22 CXX=clang++-22
          fi
          cmake -S iccDEV/Build/Cmake -B build -DCMAKE_BUILD_TYPE="$MATRIX_BUILD_TYPE" -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build build --parallel "$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)" --target all build-test-binaries
          ctest_args=(--test-dir build --output-on-failure --no-tests=error)
          if [[ "$RUNNER_OS" == macOS ]]; then
            ctest_args+=(--label-exclude 'afl|clusterfuzzlite|libfuzzer')
            ctest_args+=(--exclude-regex 'iccdev\.(mpexml-reflectance-clut-writer|json-srng-uf32-roundtrip|pawg-q2-tonecurves-only|pawg-q3-steep-not-discontinuous|pawg-q1-quality-contract|curve-gamma-tool-labels)')
          fi
          ctest "${ctest_args[@]}"

  gcc15-lto:
    name: GCC 15 Release LTO
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Build strict LTO configuration
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ghcr.io/internationalcolorconsortium/iccdev:latest
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          docker pull "$TEST_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE/iccDEV:/src:ro" "$TEST_IMAGE" bash -lc '
            set -euo pipefail
            work="$(mktemp -d)"
            cp -a /src/. "$work/iccDEV"
            gcc --version | head -1 | grep -q "15\."
            g++ --version | head -1 | grep -q "15\."
            cmake -S "$work/iccDEV/Build/Cmake" -B "$work/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
              -DENABLE_TOOLS=ON \
              -DENABLE_TESTS=ON \
              -DENABLE_WXWIDGETS=OFF
            cmake --build "$work/build" --parallel "$(nproc)" --target all build-test-binaries
            ctest --test-dir "$work/build" --output-on-failure --no-tests=error
          '

  tools:
    name: Tool tests ASAN UBSAN
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install CTest Python dependencies
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          python -m pip install --no-cache-dir \
            "numpy>=2.0.0,<2.4" \
            "tifffile>=2024.8.30,<2025" \
            "pillow==13.0.0" \
            "imagecodecs==2026.10.10" \
            --quiet
          python -m pip check
          python - <<'PY'
          import imagecodecs

          data = b"iccdev-lzw-check"
          assert imagecodecs.lzw_decode(imagecodecs.lzw_encode(data)) == data
          PY
          printf 'ICCDEV_SPECTRAL_PREVIEW_PYTHON=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
      - name: Build sanitizer tools and run CTest
        env:
          BASH_ENV: /dev/null
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1,print_stacktrace=1
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          bash .github/scripts/configure-llvm-22.sh
          sudo apt-get install -y --no-install-recommends clang-22 cmake libclang-rt-22-dev libjpeg-dev libpng-dev libtiff-dev libxml2-dev libssl-dev nlohmann-json3-dev python3
          cmake -S iccDEV/Build/Cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build build --parallel "$(nproc)" --target all build-test-binaries
          ctest --test-dir build --output-on-failure --no-tests=error

  windows:
    name: Windows MSVC build and CTest
    needs: resolve-target
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
      - name: Install prebuilt dependencies
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'iccDEV/deps.zip'
          Invoke-WebRequest -Uri 'https://github.com/InternationalColorConsortium/iccDEV/releases/download/vcpkg-win-23241-libheif-deps/iccdev-windows-vcpkg-classic-libheif-3087493.zip' -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSha256 = '9b051a50f152f616986e735d618a2f5ade2cf5443c680216894f2897dbbf5eca'
          if ($actualSha256 -ne $expectedSha256) {
            throw "Dependency archive SHA-256 mismatch: $actualSha256"
          }
          tar -xf $archive -C iccDEV
          Remove-Item -LiteralPath $archive
      - name: Configure, build, and test
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global credential.helper ""
          if (Test-Path env:GITHUB_TOKEN) { Remove-Item env:GITHUB_TOKEN }
          $toolchain = (Resolve-Path -LiteralPath 'iccDEV/scripts/buildsystems/vcpkg.cmake').Path
          $vswhere = (Get-Command vswhere.exe -ErrorAction Stop).Source
          $installationVersion = (& $vswhere -products '*' -requires Microsoft.Component.MSBuild -property installationVersion -latest).Trim()
          $generator = switch ([int]($installationVersion.Split('.')[0])) {
            17 { 'Visual Studio 17 2022' }
            18 { 'Visual Studio 18 2026' }
            default { throw "Unsupported Visual Studio version: $installationVersion" }
          }
          cmake -S iccDEV/Build/Cmake -B build -G $generator -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_MANIFEST_MODE=OFF -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build build --config Debug --parallel --target ALL_BUILD build-test-binaries
          ctest --test-dir build -C Debug --output-on-failure --no-tests=error

  python-json:
    name: Python JSON round trip
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Build JSON tools and run JSON CTest labels
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ libjpeg-dev libpng-dev libtiff-dev libxml2-dev libssl-dev nlohmann-json3-dev python3 python3-pip
          cmake -S iccDEV/Build/Cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build build --parallel "$(nproc)" --target all build-test-binaries
          ctest --test-dir build --output-on-failure --no-tests=error -L json

  docker:
    name: Docker regression verification
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Build and test in the maintainer regression image
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ghcr.io/internationalcolorconsortium/iccdev:latest
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          docker pull "$TEST_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE/iccDEV:/src:ro" "$TEST_IMAGE" bash -lc '
            set -euo pipefail
            work="$(mktemp -d)"
            cp -a /src/. "$work/iccDEV"
            cmake -S "$work/iccDEV/Build/Cmake" -B "$work/build" -DCMAKE_BUILD_TYPE=Debug -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
            cmake --build "$work/build" --parallel "$(nproc)" --target all build-test-binaries
            ctest --test-dir "$work/build" --output-on-failure --no-tests=error
          '

  wasm:
    name: WASM release build
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned Emscripten SDK and build
        env:
          BASH_ENV: /dev/null
          EMSDK_VERSION: 4.0.20
          EMSDK_REF: e4fe26ef59168ff44f4c23c466e497bf60b3411e
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          git -C emsdk fetch --depth 1 origin "$EMSDK_REF"
          git -C emsdk checkout --detach "$EMSDK_REF"
          emsdk/emsdk install "$EMSDK_VERSION"
          emsdk/emsdk activate "$EMSDK_VERSION"
          source emsdk/emsdk_env.sh
          emcc --version
          emcc -dM -E -x c /dev/null | grep -Fx '#define __clang_major__ 22'
          emcmake cmake -S iccDEV/Build/Cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release -DENABLE_TOOLS=ON -DENABLE_ICCXML=OFF -DENABLE_ICCJSON=OFF -DENABLE_IMAGE_TOOLS=OFF -DENABLE_SHARED_LIBS=OFF -DENABLE_STATIC_LIBS=ON -DICC_USE_ZLIB=OFF -DENABLE_WXWIDGETS=OFF
          cmake --build build-wasm --parallel "$(nproc)"
          test -n "$(find build-wasm -type f -name '*.wasm' -print -quit)"

  summary:
    name: Long-Run Summary
    needs: [resolve-target, unix, gcc15-lto, tools, windows, python-json, docker, wasm]
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Report runner timing
        env:
          BASH_ENV: /dev/null
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RESOLVED_SHA: ${{ needs.resolve-target.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          # jq variables must remain literal in the single-quoted filter.
          # shellcheck disable=SC2016
          job_rows="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '
            .jobs[]
            | select(.name != "Long-Run Summary")
            | (.steps[0].started_at // .started_at) as $runner_started
            | [
                .name,
                .conclusion,
                (.runner_name // "unreported"),
                (.labels | join(",")),
                (($runner_started | fromdateiso8601) - (.started_at | fromdateiso8601)),
                ((.completed_at | fromdateiso8601) - ($runner_started | fromdateiso8601)),
                ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))
              ]
            | @tsv')"

          {
            sanitize_print "### Long-run runner timing"
            sanitize_print ""
            sanitize_print "- Workflow SHA: $WORKFLOW_SHA"
            sanitize_print "- Upstream iccDEV SHA: $RESOLVED_SHA"
            sanitize_print ""
            sanitize_print "| Job | Conclusion | Runner | Labels | Queue (s) | Execution (s) | Total (s) |"
            sanitize_print "|---|---|---|---|---:|---:|---:|"
            while IFS=$'\t' read -r job conclusion runner labels queue_seconds execution_seconds total_seconds; do
              sanitize_print "| $job | $conclusion | $runner | $labels | $queue_seconds | $execution_seconds | $total_seconds |"
            done <<< "$job_rows"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require every selected lane
        env:
          BASH_ENV: /dev/null
          RESOLVE: ${{ needs.resolve-target.result }}
          UNIX: ${{ needs.unix.result }}
          GCC15: ${{ needs.gcc15-lto.result }}
          TOOLS: ${{ needs.tools.result }}
          WINDOWS: ${{ needs.windows.result }}
          PYTHON_JSON: ${{ needs.python-json.result }}
          DOCKER: ${{ needs.docker.result }}
          WASM: ${{ needs.wasm.result }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          for result in "$RESOLVE" "$UNIX" "$GCC15" "$TOOLS" "$WINDOWS" "$PYTHON_JSON" "$DOCKER" "$WASM"; do
            test "$result" = success
          done
