name: iccDEV Long-Run Validation

# Long CMake invocations are intentionally kept as single commands.
# yamllint disable rule:line-length

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact 40-character upstream iccDEV commit SHA'
        required: false
        default: ''
        type: string
      upstream_pr:
        description: 'Open upstream iccDEV PR number (alternative to target_sha)'
        required: false
        default: ''
        type: string

concurrency:
  group: iccdev-long-run-${{ inputs.target_sha || inputs.upstream_pr || github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve-target:
    name: Resolve immutable upstream target
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: resolve
        env:
          BASH_ENV: /dev/null
          TARGET_SHA: ${{ inputs.target_sha }}
          UPSTREAM_PR: ${{ inputs.upstream_pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh

          if [[ -n "$TARGET_SHA" && -n "$UPSTREAM_PR" ]]; then
            echo "Specify target_sha or upstream_pr, not both." >&2
            exit 1
          fi
          if [[ -n "$UPSTREAM_PR" ]]; then
            [[ "$UPSTREAM_PR" =~ ^[1-9][0-9]*$ ]] || exit 1
            sha="$(gh api "repos/InternationalColorConsortium/iccDEV/pulls/$UPSTREAM_PR" --jq .head.sha)"
          else
            [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
            sha="$(gh api "repos/InternationalColorConsortium/iccDEV/commits/$TARGET_SHA" --jq .sha)"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'sha=%s\n' "$(sanitize_line "$sha")" >> "$GITHUB_OUTPUT"

  unix:
    name: Unix ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.build_type }}
    needs: resolve-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        compiler: [gcc, clang]
        build_type: [Release, Debug]
        exclude:
          - os: macos-latest
            compiler: gcc
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Install dependencies
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential cmake clang libjpeg-dev libpng-dev libtiff-dev libxml2-dev libssl-dev nlohmann-json3-dev
          else
            brew install cmake libjpeg libpng libtiff libxml2 nlohmann-json
          fi
      - name: Build and test
        env:
          BASH_ENV: /dev/null
          MATRIX_COMPILER: ${{ matrix.compiler }}
          MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh
          if [[ "$MATRIX_COMPILER" == gcc ]]; then export CC=gcc CXX=g++; else export CC=clang CXX=clang++; fi
          cmake -S iccDEV/Build/Cmake -B build -DCMAKE_BUILD_TYPE="$MATRIX_BUILD_TYPE" -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build build --parallel "$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"
          ctest --test-dir build --output-on-failure --no-tests=error

  gcc15-lto:
    name: GCC 15 Release LTO
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Build strict LTO configuration
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ghcr.io/internationalcolorconsortium/iccdev-ci-regression:latest
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          docker pull "$TEST_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE/iccDEV:/src:ro" "$TEST_IMAGE" bash -lc '
            set -euo pipefail
            work="$(mktemp -d)"
            cp -a /src/. "$work/iccDEV"
            gcc --version | head -1 | grep -q "15\."
            g++ --version | head -1 | grep -q "15\."
            cmake -S "$work/iccDEV/Build/Cmake" -B "$work/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
              -DENABLE_TOOLS=ON \
              -DENABLE_TESTS=ON \
              -DENABLE_WXWIDGETS=OFF
            cmake --build "$work/build" --parallel "$(nproc)"
            ctest --test-dir "$work/build" --output-on-failure --no-tests=error
          '

  tools:
    name: Tool tests ASAN UBSAN
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Build sanitizer tools and run CTest
        env:
          BASH_ENV: /dev/null
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1,print_stacktrace=1
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake libclang-rt-dev libjpeg-dev libpng-dev libtiff-dev libxml2-dev libssl-dev nlohmann-json3-dev python3
          cmake -S iccDEV/Build/Cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS='-fsanitize=address,undefined' -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build build --parallel "$(nproc)" --target all build-test-binaries
          ctest --test-dir build --output-on-failure --no-tests=error

  windows:
    name: Windows MSVC build and CTest
    needs: resolve-target
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Configure, build, and test
        shell: pwsh -NoProfile -NoLogo -NonInteractive -Command {0}
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global credential.helper ""
          if (Test-Path env:GITHUB_TOKEN) { Remove-Item env:GITHUB_TOKEN }
          cmake -S iccDEV/Build/Cmake -B build -G 'Visual Studio 17 2022' -A x64 -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build build --config Debug --parallel
          ctest --test-dir build -C Debug --output-on-failure --no-tests=error

  python-json:
    name: Python JSON round trip
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Build JSON tools and run JSON CTest labels
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ libjpeg-dev libpng-dev libtiff-dev libxml2-dev libssl-dev nlohmann-json3-dev python3 python3-pip
          cmake -S iccDEV/Build/Cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build build --parallel "$(nproc)" --target all build-test-binaries
          ctest --test-dir build --output-on-failure --no-tests=error -L JSON

  docker:
    name: Docker regression verification
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Build and test in the maintainer regression image
        env:
          BASH_ENV: /dev/null
          TEST_IMAGE: ghcr.io/internationalcolorconsortium/iccdev-ci-regression:latest
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          docker pull "$TEST_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE/iccDEV:/src:ro" "$TEST_IMAGE" bash -lc '
            set -euo pipefail
            work="$(mktemp -d)"
            cp -a /src/. "$work/iccDEV"
            cmake -S "$work/iccDEV/Build/Cmake" -B "$work/build" -DCMAKE_BUILD_TYPE=Debug -DENABLE_TOOLS=ON -DENABLE_TESTS=ON -DENABLE_WXWIDGETS=OFF
            cmake --build "$work/build" --parallel "$(nproc)" --target all build-test-binaries
            ctest --test-dir "$work/build" --output-on-failure --no-tests=error
          '

  wasm:
    name: WASM release build
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: InternationalColorConsortium/iccDEV
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: iccDEV
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned Emscripten SDK and build
        env:
          BASH_ENV: /dev/null
          EMSDK_VERSION: 4.0.20
          EMSDK_REF: e4fe26ef59168ff44f4c23c466e497bf60b3411e
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          git -C emsdk fetch --depth 1 origin "$EMSDK_REF"
          git -C emsdk checkout --detach "$EMSDK_REF"
          emsdk/emsdk install "$EMSDK_VERSION"
          emsdk/emsdk activate "$EMSDK_VERSION"
          source emsdk/emsdk_env.sh
          emcmake cmake -S iccDEV/Build/Cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release -DENABLE_TOOLS=ON -DENABLE_WXWIDGETS=OFF
          cmake --build build-wasm --parallel "$(nproc)"
          test -n "$(find build-wasm -type f -name '*.wasm' -print -quit)"

  summary:
    name: Long-Run Summary
    needs: [resolve-target, unix, gcc15-lto, tools, windows, python-json, docker, wasm]
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - name: Require every selected lane
        env:
          BASH_ENV: /dev/null
          RESOLVE: ${{ needs.resolve-target.result }}
          UNIX: ${{ needs.unix.result }}
          GCC15: ${{ needs.gcc15-lto.result }}
          TOOLS: ${{ needs.tools.result }}
          WINDOWS: ${{ needs.windows.result }}
          PYTHON_JSON: ${{ needs.python-json.result }}
          DOCKER: ${{ needs.docker.result }}
          WASM: ${{ needs.wasm.result }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          for result in "$RESOLVE" "$UNIX" "$GCC15" "$TOOLS" "$WINDOWS" "$PYTHON_JSON" "$DOCKER" "$WASM"; do
            test "$result" = success
          done
