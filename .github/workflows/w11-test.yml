name: win-check

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Host System Info
        shell: pwsh
        run: |
          systeminfo
          Write-Host "========= Fetching Deps from Releases... ================`n"
          Start-BitsTransfer -Source "https://github.com/InternationalColorConsortium/iccDEV/releases/download/v2.3.1/vcpkg-exported-deps.zip" -Destination "bitsdeps.zip"
          Write-Host "========= Extracting Dependencies ...    ================`n"
          tar -xf bitsdeps.zip
          ls
          Write-Host "========= Fetching Deps from Releases... ================`n"
          curl -L "https://github.com/InternationalColorConsortium/iccDEV/releases/download/v2.3.1/vcpkg-exported-deps.zip" -o deps.zip
          Write-Host "========= Extracting Dependencies ... ===================`n"
          Expand-Archive -Path "deps.zip" -DestinationPath "deps" -Force
          ls
          Get-CimInstance -ClassName Win32_Processor
          
      - name: Summary Report
        if: always()
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          SANITIZER="$GITHUB_WORKSPACE/.github/scripts/sanitize-sed.sh"
          if [[ -f "$SANITIZER" ]]; then
            # shellcheck disable=SC1090
            source "$SANITIZER"
          else
            escape_html() {
              local s="$1"
              s="${s//&/&amp;}" ; s="${s//</&lt;}" ; s="${s//>/&gt;}"
              s="${s//\"/&quot;}" ; s="${s//\'/&#39;}"
              printf '%s' "$s"
            }
            sanitize_line() { escape_html "$1"; }
          fi

          echo "### Windows Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $(sanitize_line "${{ job.status }}")" >> $GITHUB_STEP_SUMMARY
