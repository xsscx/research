# Thin caller for _test-profiles.yml callable workflow.
# Tests profiles from extended-test-profiles/ directory (25).
#
###############################################################

name: iccAnalyzer-lite Cached Testing

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      profile_count:
        description: Number of random profiles to test (max 50)
        required: false
        default: "25"
        type: string

jobs:
  test:
    uses: ./.github/workflows/_test-profiles.yml
    with:
      profile-directory: extended-test-profiles
      profile-count: ${{ inputs.profile_count || '25' }}
      artifact-name: iccanalyzer-lite-cached-test-results
      report-title: iccAnalyzer-lite Cached Testing Results
