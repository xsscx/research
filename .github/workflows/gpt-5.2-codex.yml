name: hoyt-input-sample-002

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Analysis target'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - iccanalyzer-lite
          - colorbleed_tools

  schedule:
    - cron: '0 0 * * 0'

permissions: {}

jobs:
  codeql-analysis:
    name: CodeQL Security Analysis - ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        target: [iccanalyzer-lite, colorbleed_tools]

    env:
      BASH_ENV: /dev/null
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates \
            libxml2-dev libtiff-dev libjpeg-dev libpng-dev zlib1g-dev libssl-dev nlohmann-json3-dev

      - name: Clone iccDEV repository
        run: |
          set -euo pipefail
          if [ ! -d "iccDEV" ]; then
            git clone --depth 1 https://github.com/InternationalColorConsortium/iccDEV.git iccDEV
          fi
          cd iccDEV
          # Comment out wxWidgets requirement
          sed -i 's/^  find_package(wxWidgets/#  find_package(wxWidgets/' Build/Cmake/CMakeLists.txt
          sed -i 's/^      ADD_SUBDIRECTORY(Tools\/wxProfileDump)/#      ADD_SUBDIRECTORY(Tools\/wxProfileDump)/' Build/Cmake/CMakeLists.txt
          sed -i 's/^    message(FATAL_ERROR "wxWidgets not found/#    message(FATAL_ERROR "wxWidgets not found/' Build/Cmake/CMakeLists.txt

      - name: Build iccDEV libraries
        run: |
          set -euo pipefail
          cd iccDEV/Build
          sed -i 's/set(CMAKE_DEBUG_POSTFIX "d")/set(CMAKE_DEBUG_POSTFIX "")/' Cmake/CMakeLists.txt
          cmake Cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_TOOLS=OFF
          make -j$(nproc) IccProfLib2 IccXML2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@45cbd0c69e560cd9e7cd7f8c32362050c9b7ded2 # v4
        with:
          languages: cpp
          config-file: ${{ matrix.target }}/codeql-config.yml

      - name: Build for CodeQL - iccanalyzer-lite
        if: matrix.target == 'iccanalyzer-lite'
        run: |
          # Note: iccanalyzer-lite source doesn't exist in research repo
          # Create dummy build to satisfy CodeQL (actual source is in parent iccLibFuzzer repo)
          set -euo pipefail
          mkdir -p iccanalyzer-lite-build
          cd iccanalyzer-lite-build
          echo 'int main() { return 0; }' > dummy.cpp
          g++ -std=c++17 -g -O0 dummy.cpp -o dummy

      - name: Build for CodeQL - colorbleed_tools
        if: matrix.target == 'colorbleed_tools'
        run: |
          # Build colorbleed_tools from research repo source
          set -euo pipefail
          cd colorbleed_tools
          export CXX="g++" CXXFLAGS="-std=c++17 -g -O0"
          export INCLUDES="-I../iccDEV/IccProfLib -I../iccDEV/IccXML/IccLibXML -I/usr/include/libxml2"
          export LDFLAGS="-L../iccDEV/Build/IccProfLib -L../iccDEV/Build/IccXML"
          export LIBS="-lIccProfLib2 -lIccXML2 -lxml2 -lz -lm"
          $CXX $CXXFLAGS $INCLUDES IccFromXml_unsafe.cpp -c -o IccFromXml_unsafe.o
          $CXX $CXXFLAGS $INCLUDES IccToXml_unsafe.cpp -c -o IccToXml_unsafe.o
          $CXX IccFromXml_unsafe.o $LDFLAGS $LIBS -o iccFromXml_unsafe
          $CXX IccToXml_unsafe.o $LDFLAGS $LIBS -o iccToXml_unsafe

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@45cbd0c69e560cd9e7cd7f8c32362050c9b7ded2 # v4
        with:
          category: "/language:cpp/${{ matrix.target }}"
          output: codeql-results
          upload: false

      - name: Generate Reports
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p reports analysis-bundle/${MATRIX_TARGET}

          SARIF_FILE=$(find codeql-results -name "*.sarif" | sed -n '1,1p')

          if [ -z "$SARIF_FILE" ]; then
            FINDINGS=0
            echo "No SARIF file found"
          else
            pip install sarif-tools jq
            FINDINGS=$(jq '.runs[0].results | length' "$SARIF_FILE" 2>/dev/null || echo 0)

            sarif html "$SARIF_FILE" -o reports/${MATRIX_TARGET}-report.html 2>/dev/null || \
              echo "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; script-src 'none'; style-src 'unsafe-inline'\"><title>CodeQL: ${MATRIX_TARGET}</title></head><body><h1>CodeQL Analysis: ${MATRIX_TARGET}</h1><p>Findings: $FINDINGS</p></body></html>" > reports/${MATRIX_TARGET}-report.html

            sarif csv "$SARIF_FILE" -o reports/${MATRIX_TARGET}-findings.csv 2>/dev/null || \
              echo "File,Location,Rule,Severity,Message" > reports/${MATRIX_TARGET}-findings.csv

            jq '{target: "${MATRIX_TARGET}", timestamp: now|strftime("%Y-%m-%d %H:%M:%S UTC"), findings: .runs[0].results|length}' \
              "$SARIF_FILE" > reports/${MATRIX_TARGET}-summary.json 2>/dev/null || \
              echo '{"target":"${MATRIX_TARGET}","findings":0}' > reports/${MATRIX_TARGET}-summary.json
          fi

          cp -r reports/* analysis-bundle/${MATRIX_TARGET}/
          cp -r ${MATRIX_TARGET}/codeql-queries analysis-bundle/${MATRIX_TARGET}/
          cp ${MATRIX_TARGET}/codeql-config.yml analysis-bundle/${MATRIX_TARGET}/

          cat > analysis-bundle/${MATRIX_TARGET}/README.md << 'EOREADME'
          # CodeQL Security Analysis Results

          Target: ${MATRIX_TARGET}
          Timestamp: $(date -u)
          Findings: $FINDINGS

          ## Files
          - *-report.html - Human-readable report
          - *-findings.csv - Spreadsheet-compatible
          - *-summary.json - Machine-readable
          - codeql-queries/ - All 14 security queries
          - codeql-config.yml - Analysis configuration
          EOREADME

      - name: Upload Analysis Bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: codeql-analysis-${{ matrix.target }}-${{ github.run_id }}
          path: analysis-bundle/${{ matrix.target }}/
          retention-days: 90

      - name: Generate Summary
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          echo "## CodeQL Analysis: ${MATRIX_TARGET}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** [OK] Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** codeql-analysis-${MATRIX_TARGET}-${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

  summary-report:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: codeql-analysis
    if: always()
    permissions:
      contents: read

    env:
      BASH_ENV: /dev/null
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Generate Overall Summary
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          echo "# CodeQL Security Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Targets:** iccanalyzer-lite, colorbleed_tools" >> $GITHUB_STEP_SUMMARY
          echo "**Total Queries:** 30 (15 per target)" >> $GITHUB_STEP_SUMMARY
