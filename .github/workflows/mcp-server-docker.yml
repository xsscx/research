#
# Intent: Build and push ICC Profile MCP Server container image
#         with SBOM generation and build provenance attestation
#         Modes: mcp (stdio, default), web (Starlette UI)
#
###############################################################

name: MCP Server Docker Build

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Version tag without leading v'
        required: false
        default: '0.1.1'
        type: string

concurrency:
  group: mcp-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build, Push, Attest
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/icc-profile-mcp
          tags: |
            type=sha,prefix=
            type=raw,value=v${{ github.event.inputs.image_version || '0.1.1' }}
            type=raw,value=dev
            type=raw,value=latest

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: mcp-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test -- MCP stdio
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/icc-profile-mcp@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' \
            | docker run --rm -i "$IMAGE" mcp \
            | python3 -c "import sys,json; r=json.load(sys.stdin); assert r['result']['serverInfo']['name']=='icc-profile-analyzer', f'Bad: {r}'; print('[OK] MCP stdio init')"

      - name: Smoke test -- tool count
        env:
          EXPECTED_MCP_TOOLS: "28"
          IMAGE: ghcr.io/${{ github.repository_owner }}/icc-profile-mcp@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          cat > /tmp/check_tools.py << 'PYEOF'
          import os, sys, json
          expected = int(os.environ["EXPECTED_MCP_TOOLS"])
          for line in sys.stdin:
              msg = json.loads(line)
              if 'result' in msg and 'tools' in msg['result']:
                  tools = [t['name'] for t in msg['result']['tools']]
                  print(f'[OK] {len(tools)} tools: {tools}')
                  assert len(tools) == expected, f'Expected {expected} tools, got {len(tools)}'
                  sys.exit(0)
          print('[FAIL] No tools/list response found')
          sys.exit(1)
          PYEOF
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}\n{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' \
            | docker run --rm -i "$IMAGE" mcp \
            | python3 /tmp/check_tools.py

      - name: Smoke test -- Web API
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/icc-profile-mcp@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          cid="$(docker run -d --rm -p 127.0.0.1:8080:8080 "$IMAGE" web)"
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/tmp/mcp-health.json; then
              break
            fi
            sleep 2
          done
          python3 - <<'PYEOF'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/mcp-health.json").read_text())
          assert payload.get("ok") is True, payload
          assert payload.get("tools") == 28, payload
          assert payload.get("defaultAnalysisEngine") in {"auto", "v1", "v2"}, payload
          assert payload.get("defaultStructuralEngine") in {"auto", "v1", "v2"}, payload
          print("[OK] Web API health")
          PYEOF
          docker exec "$cid" which xmllint
          curl -fsS -F "file=@test-profiles/sRGB_D65_MAT.icc" \
            http://127.0.0.1:8080/api/upload >/tmp/mcp-upload.json
          profile_path="$(python3 - <<'PYEOF'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/mcp-upload.json").read_text())
          assert payload.get("ok") is True, payload
          assert payload.get("path"), payload
          print(payload["path"])
          PYEOF
          )"
          curl -fsS --get --data-urlencode "path=$profile_path" \
            http://127.0.0.1:8080/api/security-json >/tmp/mcp-security-json.json
          python3 - <<'PYEOF'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/mcp-security-json.json").read_text())
          assert payload.get("ok") is True, payload
          result = payload.get("result", {})
          assert isinstance(result, dict), payload
          assert "summary" in result or "stats" in result, payload
          print("[OK] Web API upload and security-json")
          PYEOF

      - name: Smoke test -- icctest CLI in image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/icc-profile-mcp@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          docker run --rm "$IMAGE" /app/iccanalyzer-lite/icctest/build/cli/icctest --version
          docker run --rm "$IMAGE" /app/iccanalyzer-lite/icctest/build/cli/icctest --registry >/dev/null

      - name: Generate SBOM
        uses: anchore/sbom-action@5dd6ac9278f372ca3f8480f05a1ed38534773086 # v0.22.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/icc-profile-mcp@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/icc-profile-mcp
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@5ab5806a2ce22f5acba1a3cf560dc12fd0049bd6 # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/icc-profile-mcp
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: mcp-server-sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Summary
        env:
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_REPOSITORY: ${{ github.repository }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          safe_tags="$(printf '%s' "$IMAGE_TAGS" | tr '\n' ', ')"
          {
            echo "## MCP Server Docker Build"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Image** | \`ghcr.io/$(sanitize_line "$IMAGE_OWNER")/icc-profile-mcp\` |"
            echo "| **Digest** | \`$(sanitize_line "$IMAGE_DIGEST")\` |"
            echo "| **Tags** | $(sanitize_line "$safe_tags") |"
            echo ""
            echo "### Attestations"
            echo "- [OK] Build provenance (SLSA)"
            echo "- [OK] SBOM (SPDX)"
            echo ""
            echo "Verify: \`gh attestation verify oci://ghcr.io/$(sanitize_line "$IMAGE_OWNER")/icc-profile-mcp:latest -R $(sanitize_line "$IMAGE_REPOSITORY")\`"
          } >> $GITHUB_STEP_SUMMARY
