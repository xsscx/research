#
# Thin caller for _test-profiles.yml callable workflow.
# Tests profiles from test-profiles/ directory (default 10).
#
###############################################################

name: iccAnalyzer-lite Profile Testing

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      profile_count:
        description: 'Number of random profiles to test (max 50)'
        required: false
        default: '10'
        type: string

jobs:
  test:
    uses: ./.github/workflows/_test-profiles.yml
    with:
      profile-directory: 'test-profiles'
      profile-count: ${{ inputs.profile_count || '10' }}
      artifact-name: 'iccanalyzer-lite-profile-test-results'
      report-title: 'iccAnalyzer-lite Profile Testing Results'
