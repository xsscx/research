name: iccDEV CFL Regressions

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '.github/instructions/cfl.instructions.md'
      - '.github/scripts/validate-cfl-applynamedcmm.sh'
      - '.github/workflows/iccdev-cfl-regressions.yml'
      - 'cfl/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/instructions/cfl.instructions.md'
      - '.github/scripts/validate-cfl-applynamedcmm.sh'
      - '.github/workflows/iccdev-cfl-regressions.yml'
      - 'cfl/**'
  workflow_dispatch:
    inputs:
      iccdev_ref:
        description: 'Upstream iccDEV branch, tag, or commit'
        required: false
        default: 'master'
        type: string

concurrency:
  group: iccdev-cfl-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: CFL build and focused smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null
      ICCDEV_REF: ${{ inputs.iccdev_ref || 'master' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build dependencies
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang \
            cmake \
            libclang-rt-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff-dev \
            libxml2-dev \
            nlohmann-json3-dev \
            pkg-config \
            shellcheck

      - name: Validate CFL metadata and scripts
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          shellcheck cfl/build.sh cfl/fuzzers.sh cfl/fuzz-local.sh cfl/start.sh \
            .github/scripts/validate-cfl-applynamedcmm.sh
          bash -n cfl/build.sh cfl/fuzzers.sh cfl/fuzz-local.sh cfl/start.sh \
            .github/scripts/validate-cfl-applynamedcmm.sh
          source cfl/fuzzers.sh
          test "$(cfl_list_fuzzers | wc -l)" -eq "${#CFL_FUZZERS[@]}"
          test "${#CFL_FUZZERS[@]}" -gt 0
          test "$(cfl_normalize_fuzzer visualize)" = \
            icc_profilevisualize_fuzzer
          test "$(file -b --mime-encoding \
            cfl/icc_profilevisualize_fuzzer.cpp)" = us-ascii
          test "$(file -b --mime-encoding \
            cfl/icc_applynamedcmm_fuzzer.cpp)" = us-ascii
          .github/scripts/validate-cfl-applynamedcmm.sh

      - name: Build all CFL fuzzers
        env:
          BASH_ENV: /dev/null
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          cfl/build.sh --branch "$ICCDEV_REF" --refresh-iccdev

      - name: Smoke profile visualization harness
        env:
          BASH_ENV: /dev/null
          ASAN_OPTIONS: detect_leaks=0,halt_on_error=1,abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1,abort_on_error=1,print_stacktrace=1
          LLVM_PROFILE_FILE: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          timeout 120s cfl/bin/icc_profilevisualize_fuzzer \
            -runs=1 cfl/corpus/

      - name: Replay ApplyNamedCmm curated seeds
        env:
          BASH_ENV: /dev/null
          ASAN_OPTIONS: detect_leaks=0,halt_on_error=1,abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1,abort_on_error=1,print_stacktrace=1
          LLVM_PROFILE_FILE: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          .github/scripts/validate-cfl-applynamedcmm.sh --replay
