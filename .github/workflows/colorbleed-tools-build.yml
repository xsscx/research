name: ColorBleed Tools Build

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - 'colorbleed_tools/**'
      - '.github/workflows/colorbleed-tools-build.yml'
  pull_request:
    paths:
      - 'colorbleed_tools/**'
      - '.github/workflows/colorbleed-tools-build.yml'

jobs:
  linux:
    name: "Linux ${{ matrix.compiler }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout master
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-env
        with:
          preset: 'colorbleed'
          extra-packages: 'libxml2 libwxgtk3.2-dev wx-common'

      - name: Set Compiler
        env:
          BASH_ENV: /dev/null
          MATRIX_COMPILER: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          git config --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          if [ "$MATRIX_COMPILER" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang-18" >> "$GITHUB_ENV"
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi

      - name: Print Compiler Version
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          echo "Compiler Version:" >> "$GITHUB_STEP_SUMMARY"
          sanitize_codeblock "$($CC --version 2>&1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          cd colorbleed_tools
          make setup
          make test

      - name: Test iccDumpAll and iccDiagnosticLoad
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          source .github/scripts/sanitize-sed.sh 2>/dev/null || true

          LOGDIR="$GITHUB_WORKSPACE/colorbleed_tools/tool-test-logs"
          mkdir -p "$LOGDIR"

          # Collect candidate profiles from test-profiles/ and iccDEV/Testing/
          mapfile -t PROFILES < <(find test-profiles/ -maxdepth 1 -name '*.icc' -size +128c -size -2M 2>/dev/null | sort)
          if [ -d colorbleed_tools/iccDEV/Testing ]; then
            while IFS= read -r p; do
              PROFILES+=("$p")
            done < <(find colorbleed_tools/iccDEV/Testing -maxdepth 1 -name '*.icc' -size +128c -size -2M 2>/dev/null | sort)
          fi

          if [ "${#PROFILES[@]}" -lt 2 ]; then
            echo "::error::Need at least 2 test profiles, found ${#PROFILES[@]}"
            exit 1
          fi

          # Pick 2 random profiles using RANDOM
          idx1=$((RANDOM % ${#PROFILES[@]}))
          idx2=$(( (idx1 + 1 + RANDOM % (${#PROFILES[@]} - 1)) % ${#PROFILES[@]} ))
          SELECTED=("${PROFILES[$idx1]}" "${PROFILES[$idx2]}")

          TOOL_DIR="$GITHUB_WORKSPACE/colorbleed_tools"
          PASS=0
          FAIL=0
          RESULTS=""

          for profile in "${SELECTED[@]}"; do
            pname="$(basename "$profile" .icc)"

            # ---- iccDumpAll tests ----
            for mode in "" "--diag" "--read" "--diag --read" "-v"; do
              label="iccDumpAll ${mode:-default}"
              slug="${mode// /-}"
              slug="${slug:-default}"
              logfile="$LOGDIR/dumpall-${pname}-${slug}.log"

              echo "--- $label on $pname ---"
              rc=0
              if [ "$slug" = "-v" ]; then
                timeout 30 "$TOOL_DIR/iccDumpAll" -v "$profile" ALL \
                  > "$logfile" 2>&1 || rc=$?
              else
                timeout 30 "$TOOL_DIR/iccDumpAll" $mode "$profile" ALL \
                  > "$logfile" 2>&1 || rc=$?
              fi

              lines=$(wc -l < "$logfile")
              bytes=$(stat -c%s "$logfile" 2>/dev/null || echo 0)
              if [ "$rc" -eq 0 ]; then
                PASS=$((PASS + 1))
                RESULTS="${RESULTS}| $label | $pname | 0 | $lines | $bytes |\n"
              else
                FAIL=$((FAIL + 1))
                RESULTS="${RESULTS}| $label | $pname | $rc | $lines | $bytes |\n"
              fi
            done

            # ---- iccDiagnosticLoad tests ----
            for mode in "--raw" "--compare" "--trace" "--dump" "--all"; do
              label="iccDiagnosticLoad $mode"
              logfile="$LOGDIR/diagload-${pname}-${mode#--}.log"

              echo "--- $label on $pname ---"
              rc=0
              timeout 30 "$TOOL_DIR/iccDiagnosticLoad" $mode "$profile" \
                > "$logfile" 2>&1 || rc=$?

              lines=$(wc -l < "$logfile")
              bytes=$(stat -c%s "$logfile" 2>/dev/null || echo 0)
              if [ "$rc" -eq 0 ]; then
                PASS=$((PASS + 1))
                RESULTS="${RESULTS}| $label | $pname | 0 | $lines | $bytes |\n"
              else
                FAIL=$((FAIL + 1))
                RESULTS="${RESULTS}| $label | $pname | $rc | $lines | $bytes |\n"
              fi
            done
          done

          # Write compact summary table
          {
            echo "### iccDumpAll and iccDiagnosticLoad Test Results"
            echo ""
            echo "**Selected profiles:**"
            for p in "${SELECTED[@]}"; do
              echo "- \`$(basename "$p")\` ($(stat -c%s "$p" 2>/dev/null || echo '?') bytes)"
            done
            echo ""
            echo "| Tool + Mode | Profile | Exit | Lines | Bytes |"
            echo "|---|---|---|---|---|"
            printf '%b' "$RESULTS"
            echo ""
            echo "**Results: $PASS passed, $FAIL non-zero exit**"
            echo ""
            echo "> Full tool output is in the uploaded \`tool-test-logs/\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Checksums
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          cd colorbleed_tools
          sha256sum iccToXml_unsafe iccFromXml_unsafe iccDumpAll iccDiagnosticLoad > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: colorbleed-linux-${{ matrix.compiler }}
          path: |
            colorbleed_tools/iccToXml_unsafe
            colorbleed_tools/iccFromXml_unsafe
            colorbleed_tools/iccDumpAll
            colorbleed_tools/iccDiagnosticLoad
            colorbleed_tools/SHA256SUMS
            colorbleed_tools/test.xml
            colorbleed_tools/roundtrip.icc
            colorbleed_tools/tool-test-logs/

      - name: Summary Report
        if: always()
        env:
          BASH_ENV: /dev/null
          MATRIX_COMPILER: ${{ matrix.compiler }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          git config --add safe.directory "$GITHUB_WORKSPACE"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true
          case "$JOB_STATUS" in
            success) STATUS_LINE="[OK] Build complete" ;;
            cancelled) STATUS_LINE="[CANCELLED] Job cancelled" ;;
            *) STATUS_LINE="[FAIL] Build or tests failed" ;;
          esac
          echo "### Linux Build Summary ($(sanitize_line "$MATRIX_COMPILER"))" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compiler: $(sanitize_line "$MATRIX_COMPILER")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: $(sanitize_line "$STATUS_LINE")" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh colorbleed_tools/iccToXml_unsafe colorbleed_tools/iccFromXml_unsafe \
                 colorbleed_tools/iccDumpAll colorbleed_tools/iccDiagnosticLoad 2>&1 | \
            while IFS= read -r line; do
              sanitize_line "$line" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### SHA256 Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat colorbleed_tools/SHA256SUMS | while IFS= read -r line; do
            sanitize_line "$line" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
