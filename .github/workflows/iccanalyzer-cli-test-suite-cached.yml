###############################################################
# iccanalyzer-cli-test-suite-cached.yml
#
# Cached CLI test suite with dynamic iccDEV commit-hash cache keys.
# Thin caller of _cli-test-suite.yml callable workflow.
###############################################################

name: iccAnalyzer CLI Test Suite (Cached)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      test_profile_count:
        description: 'Number of test profiles to use (max 50)'
        required: false
        default: '25'
        type: string
      include_malformed:
        description: 'Include potentially malformed profiles'
        required: false
        default: true
        type: boolean

jobs:
  cli-test:
    uses: ./.github/workflows/_cli-test-suite.yml
    with:
      use-dynamic-cache: true
      test-profile-count: ${{ github.event.inputs.test_profile_count || '25' }}
      include-malformed: ${{ github.event.inputs.include_malformed == 'true' || github.event.inputs.include_malformed == '' }}
      report-title: 'iccAnalyzer-lite CLI Test Suite Results (Cached Build)'
      artifact-name: 'iccanalyzer-cli-test-suite-cached-results'
