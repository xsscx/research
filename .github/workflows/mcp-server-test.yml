name: MCP Server Tests

on:
  push:
    paths:
      - 'mcp-server/**'
      - 'iccanalyzer-lite/**'
      - '.github/workflows/mcp-server-test.yml'
      - '!mcp-server/**/*.md'
      - '!mcp-server/codeql-queries/**'
      - '!mcp-server/codeql-config.yml'
      - '!iccanalyzer-lite/**/*.md'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'iccanalyzer-lite/**'
      - '.github/workflows/mcp-server-test.yml'
      - '!mcp-server/**/*.md'
      - '!mcp-server/codeql-queries/**'
      - '!mcp-server/codeql-config.yml'
      - '!iccanalyzer-lite/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash --noprofile --norc {0}
    env:
      BASH_ENV: /dev/null

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('mcp-server/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-env
        with:
          preset: 'codeql'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          cd mcp-server
          pip install -r requirements.txt

      - name: Cache iccDEV repository
        id: cache-iccdev
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        with:
          path: iccDEV
          key: ${{ runner.os }}-iccdev-mcp-upstream-v1

      - name: Cache iccDEV build
        id: cache-iccdev-build
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        with:
          path: |
            iccDEV/Build/IccProfLib
            iccDEV/Build/IccXML
          key: ${{ runner.os }}-iccdev-build-mcp-upstream-v2-${{ hashFiles('.github/workflows/mcp-server-test.yml') }}

      - name: Cache native tools
        id: cache-native-tools
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        with:
          path: |
            iccanalyzer-lite/iccanalyzer-lite
            colorbleed_tools/iccToXml_unsafe
            colorbleed_tools/iccFromXml_unsafe
            colorbleed_tools/bin/
          key: ${{ runner.os }}-native-tools-mcp-v3-${{ hashFiles('.github/workflows/mcp-server-test.yml', 'iccanalyzer-lite/*.cpp', 'iccanalyzer-lite/*.h', 'colorbleed_tools/*.cpp') }}

      - name: Install iccDEV + iccanalyzer-lite
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != 'true' ]; then
            sudo apt-get update
          else
            echo "Using cached APT packages"
          fi
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang git ca-certificates \
            libxml2-dev libtiff-dev libjpeg-dev libpng-dev zlib1g-dev libssl-dev nlohmann-json3-dev

          if [ "${{ steps.cache-iccdev.outputs.cache-hit }}" != 'true' ]; then
            # Clone and build iccDEV
            if [ ! -d "iccDEV" ]; then
              git clone --depth 1 https://github.com/InternationalColorConsortium/iccDEV.git iccDEV
            fi
            cd iccDEV
            sed -i 's/^  find_package(wxWidgets/#  find_package(wxWidgets/' Build/Cmake/CMakeLists.txt
            sed -i 's/^      ADD_SUBDIRECTORY(Tools\/wxProfileDump)/#      ADD_SUBDIRECTORY(Tools\/wxProfileDump)/' Build/Cmake/CMakeLists.txt
            sed -i 's/^    message(FATAL_ERROR "wxWidgets not found/#    message(FATAL_ERROR "wxWidgets not found/' Build/Cmake/CMakeLists.txt
            sed -i 's/set(CMAKE_INTERPROCEDURAL_OPTIMIZATION ON)/#set(CMAKE_INTERPROCEDURAL_OPTIMIZATION ON)/' Build/Cmake/CMakeLists.txt
            cd ..
          fi

          if [ "${{ steps.cache-iccdev-build.outputs.cache-hit }}" != 'true' ]; then
            # Strip stray U+FE0F (emoji variation selector) from upstream source
            SIGUTILS="iccDEV/IccProfLib/IccSignatureUtils.h"
            if grep -qP '\xef\xb8\x8f' "$SIGUTILS" 2>/dev/null; then
              sed -i 's/\xef\xb8\x8f//g' "$SIGUTILS"
              echo "[OK] Stripped stray U+FE0F from IccSignatureUtils.h"
            fi
            sed -i 's/set(CMAKE_DEBUG_POSTFIX "d")/set(CMAKE_DEBUG_POSTFIX "")/' iccDEV/Build/Cmake/CMakeLists.txt
            cd iccDEV/Build && rm -f CMakeCache.txt && rm -rf CMakeFiles && cmake Cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF && make -j$(nproc)
            cd ../..
          fi

          # Build colorbleed_tools and iccanalyzer-lite (critical for demo)
          if [ "${{ steps.cache-native-tools.outputs.cache-hit }}" != 'true' ]; then
            export CXX=clang++
            export INCLUDES="-I../iccDEV/IccProfLib -I../iccDEV/IccXML/IccLibXML -I/usr/include/libxml2"

            echo "Building colorbleed_tools against cached iccDEV..."
            cd colorbleed_tools
            $CXX -std=c++17 -O2 $INCLUDES \
              -c ColorBleedAlloc.cpp -o ColorBleedAlloc.o
            $CXX -std=c++17 -O2 $INCLUDES \
              IccToXml_unsafe.cpp ColorBleedAlloc.o \
              -L../iccDEV/Build/IccProfLib -L../iccDEV/Build/IccXML \
              -lIccProfLib2 -lIccXML2 -lxml2 -lz -lm \
              -Wl,--allow-multiple-definition \
              -o iccToXml_unsafe
            $CXX -std=c++17 -O2 $INCLUDES \
              IccFromXml_unsafe.cpp ColorBleedAlloc.o \
              -L../iccDEV/Build/IccProfLib -L../iccDEV/Build/IccXML \
              -lIccProfLib2 -lIccXML2 -lxml2 -lz -lm \
              -Wl,--allow-multiple-definition \
              -o iccFromXml_unsafe
            ls -la iccToXml_unsafe iccFromXml_unsafe
            cd ..

            # Build iccanalyzer-lite
            cd iccanalyzer-lite
            export CXXFLAGS="-std=c++17 -O2 -DICCANALYZER_LITE"
            SRCS=$(grep '^SOURCES=' build.sh | head -1 | sed 's/^SOURCES=//' | tr -d '"')
            for src in $SRCS; do
              $CXX $CXXFLAGS $INCLUDES -c "$src" -o "${src%.cpp}.o"
            done
            OBJS=$(echo "$SRCS" | sed 's/\.cpp/.o/g')
            $CXX $OBJS \
              -L../iccDEV/Build/IccProfLib -L../iccDEV/Build/IccXML \
              -lIccProfLib2 -lIccXML2 -lxml2 -lssl -lcrypto -lz -llzma -lm -ltiff -lpng -ljpeg \
              -Wl,--allow-multiple-definition \
              -o iccanalyzer-lite
            cd ..
          else
            echo "Using cached native tools (iccanalyzer-lite + colorbleed_tools)"
            ls -la iccanalyzer-lite/iccanalyzer-lite colorbleed_tools/iccToXml_unsafe colorbleed_tools/iccFromXml_unsafe
          fi

      - name: Build icctest V2
        run: |
          set -euo pipefail
          cd iccanalyzer-lite/icctest
          chmod +x build.sh
          # icctest cmake auto-detects iccDEV at ../../iccDEV (workflow root layout)
          bash build.sh
          echo "[OK] icctest V2 build complete"
          ls -lh build/cli/icctest build/lib/libIccTest.a

      - name: Run icctest V2 unit tests
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          LLVM_PROFILE_FILE: "/dev/null"
        run: |
          set -euo pipefail
          iccanalyzer-lite/icctest/build/lib/tests/icctest_unit_tests

      - name: Run icctest V2 parity verification
        run: |
          set -euo pipefail
          cd iccanalyzer-lite/icctest
          rm -rf build/parity-artifacts
          cmake --build build --target icctest-verify-parity

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(Path("build/parity-artifacts/verify-parity-summary.json").read_text())
          summary = payload["summary"]
          raw_counts = summary["rawParity"]["counts"]
          outer_counts = summary["imageParity"]["outerImage"]["counts"]
          embedded_counts = summary["imageParity"]["embeddedRaw"]["counts"]

          print("")
          print("### icctest V2 Parity Verification")
          print("")
          print(f"- Status: `{summary['status']}`")
          print(f"- Raw parity delta: `{raw_counts.get('delta', 0)}`")
          print(f"- Image outer delta: `{outer_counts.get('delta', 0)}`")
          print(f"- Embedded raw delta: `{embedded_counts.get('delta', 0)}`")
          print(f"- Unit tests: `{summary['unitTests'].get('summaryLine', '')}`")
          print(f"- Generated image smoke: `{summary['generatedImageSmoke'].get('status', 'unknown')}`")
          print("- Artifact: `iccanalyzer-lite/icctest/build/parity-artifacts`")
          PY

      - name: Run MCP Server Tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd mcp-server
          export PATH="$(pwd)/../iccanalyzer-lite:$PATH"
          export LD_LIBRARY_PATH="$(pwd)/../iccDEV/Build/IccProfLib:$(pwd)/../iccDEV/Build/IccXML:${LD_LIBRARY_PATH:-}"
          python test_mcp.py

      - name: Run Web UI Tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd mcp-server
          export PATH="$(pwd)/../iccanalyzer-lite:$PATH"
          export LD_LIBRARY_PATH="$(pwd)/../iccDEV/Build/IccProfLib:$(pwd)/../iccDEV/Build/IccXML:${LD_LIBRARY_PATH:-}"
          python test_web_ui.py

      - name: Upload icctest parity artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: icctest-parity-artifacts-mcp-server
          path: iccanalyzer-lite/icctest/build/parity-artifacts/
          if-no-files-found: warn

      - name: Upload icctest CLI bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: icctest-cli-mcp-server
          path: |
            iccanalyzer-lite/icctest/build/cli/icctest
            iccanalyzer-lite/icctest/build/tools/icctest-parity
            iccanalyzer-lite/icctest/README.md
            iccanalyzer-lite/icctest/tools/heuristic-remap.tsv
          if-no-files-found: warn

      - name: Test Summary
        if: always()
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          echo "## MCP Server Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** $(sanitize_line "${{ job.status }}")" >> $GITHUB_STEP_SUMMARY
          echo "**Python:** 3.12" >> $GITHUB_STEP_SUMMARY
