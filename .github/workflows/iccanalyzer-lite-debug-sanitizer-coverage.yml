###############################################################
# Copyright (c) 2026 David H Hoyt LLC
#
# Intent: Build iccanalyzer-lite in Debug mode with ASan, UBSan,
#         and Clang source-based code coverage instrumentation.
#         Run CLI test suite, merge profraw data, generate
#         llvm-cov HTML + lcov + text summary reports.
#
# Instrumentation: -fprofile-instr-generate -fcoverage-mapping
# Sanitizers: -fsanitize=address,undefined
#
# Reference:
#   https://github.com/InternationalColorConsortium/iccDEV/actions/runs/21802938256/workflow
#   https://github.com/xsscx/research/actions/workflows/iccanalyzer-cli-test-suite.yml
#
###############################################################

name: iccAnalyzer Debug Sanitizer Coverage

permissions:
  contents: read
  security-events: write

on:
  workflow_dispatch:
    inputs:
      profile_count:
        description: 'Number of profiles to test (use "all" for maximum coverage)'
        required: false
        default: '50'
        type: string
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 08:00 UTC

concurrency:
  group: debug-sanitizer-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-sanitizer-coverage:
    name: "Debug + ASan + UBSan + Coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git environment
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Cache APT packages
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        id: cache-apt
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles(format('.github/workflows/{0}', github.workflow_ref)) }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != 'true' ]; then
            sudo apt-get update -qq
          else
            echo "Using cached APT packages"
          fi
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            clang-18 \
            llvm-18 \
            libxml2-dev \
            libtiff-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            liblzma-dev \
            nlohmann-json3-dev \
            libwxgtk3.2-dev \
            wx-common \
            libssl-dev \
            lcov

      - name: Cache iccDEV repository
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        id: cache-iccdev
        with:
          path: iccanalyzer-lite/iccDEV
          key: ${{ runner.os }}-iccdev-lite-upstream-v1
          restore-keys: |
            ${{ runner.os }}-iccdev-lite-

      - name: Clone iccDEV dependency
        if: steps.cache-iccdev.outputs.cache-hit != 'true'
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          cd iccanalyzer-lite
          if [ ! -d "iccDEV" ]; then
            git clone https://github.com/InternationalColorConsortium/iccDEV.git
          fi
          cd iccDEV && git config --add safe.directory "$PWD"
          echo "iccDEV commit: $(git log --oneline -1)"

      - name: Cache iccDEV build
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        id: cache-iccdev-build
        with:
          path: |
            iccanalyzer-lite/iccDEV/Build/IccProfLib
            iccanalyzer-lite/iccDEV/Build/IccXML
            iccanalyzer-lite/iccDEV/Build/CMakeCache.txt
            iccanalyzer-lite/iccDEV/Build/CMakeFiles
          key: ${{ runner.os }}-iccdev-build-lite-debug-san-upstream-${{ hashFiles('.github/workflows/iccanalyzer-lite-debug-sanitizer-coverage.yml') }}
          restore-keys: |
            ${{ runner.os }}-iccdev-build-lite-debug-san-

      - name: Normalize upstream iccDEV source
        if: steps.cache-iccdev-build.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Strip stray U+FE0F (emoji variation selector) from upstream source
          SIGUTILS="iccanalyzer-lite/iccDEV/IccProfLib/IccSignatureUtils.h"
          if grep -qP '\xef\xb8\x8f' "$SIGUTILS" 2>/dev/null; then
            sed -i 's/\xef\xb8\x8f//g' "$SIGUTILS"
            echo "[OK] Stripped stray U+FE0F from IccSignatureUtils.h"
          fi

      - name: Build iccDEV libraries (Debug + ASan + UBSan + Coverage)
        if: steps.cache-iccdev-build.outputs.cache-hit != 'true'
        env:
          BASH_ENV: /dev/null
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euo pipefail
          cd iccanalyzer-lite/iccDEV/Build

          # Disable LTO — produces bitcode archives incompatible with sanitizer linking
          sed -i 's/set(CMAKE_INTERPROCEDURAL_OPTIMIZATION ON)/#set(CMAKE_INTERPROCEDURAL_OPTIMIZATION ON)/' Cmake/CMakeLists.txt

          cmake Cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fsanitize=integer -fsanitize-recover=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls -fprofile-instr-generate -fcoverage-mapping -O0 -g3 -DDEBUG -ftrapv -fstack-protector-strong" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fsanitize=integer -fsanitize-recover=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls -fprofile-instr-generate -fcoverage-mapping -O0 -g3 -DDEBUG -ftrapv -fstack-protector-strong -std=c++17" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fprofile-instr-generate" \
            -DENABLE_TOOLS=OFF \
            -DENABLE_STATIC_LIBS=ON \
            -DICC_LOG_SAFE=ON \
            -DICC_TRACE_NAN_ENABLED=ON \
            -Wno-dev

          make -j$(nproc)

          echo "Verifying instrumented libraries..."
          ls -lh IccProfLib/libIccProfLib2-static.a
          ls -lh IccXML/libIccXML2-static.a

          echo "Checking coverage instrumentation flags..."
          find . -name "flags.make" -path "*/CMakeFiles/*" -exec grep -l "fprofile-instr-generate" {} \; | head -3 || true

      - name: Build iccanalyzer-lite (Debug + ASan + UBSan + Coverage)
        working-directory: iccanalyzer-lite
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          export CXX=clang++-18

          SANITIZE_FLAGS="-fsanitize=address,undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fsanitize=integer -fsanitize-recover=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls"
          COVERAGE_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
          DEBUG_FLAGS="-g3 -O0 -DDEBUG -fno-common -ftrapv -fstack-protector-strong"
          export CXXFLAGS="${SANITIZE_FLAGS} ${COVERAGE_FLAGS} ${DEBUG_FLAGS} -std=c++17 -DICCANALYZER_LITE -Wall -Wextra -Wno-unused-parameter"
          export LDFLAGS="${SANITIZE_FLAGS} -fprofile-instr-generate -Wl,--allow-multiple-definition"

          ICCDEV_BUILD="iccDEV/Build"
          ICCDEV_ROOT="iccDEV"
          INCLUDES="-I. -I${ICCDEV_ROOT}/IccProfLib -I${ICCDEV_ROOT}/IccXML/IccLibXML -I/usr/include/libxml2"
          LIBS="${ICCDEV_BUILD}/IccProfLib/libIccProfLib2-static.a ${ICCDEV_BUILD}/IccXML/libIccXML2-static.a -lxml2 -ltiff -lpng -ljpeg -lz -llzma -lm -lssl -lcrypto"

          SOURCES="iccAnalyzer-lite.cpp IccDevSafeOverrides.cpp IccAnalyzerConfig.cpp IccAnalyzerErrors.cpp IccAnalyzerSecurity.cpp IccAnalyzerPathValidation.cpp IccAnalyzerSignatures.cpp IccAnalyzerValidation.cpp IccAnalyzerComprehensive.cpp IccAnalyzerInspect.cpp IccAnalyzerNinja.cpp IccAnalyzerLUT.cpp IccAnalyzerLUTTextIO.cpp IccAnalyzerLUTVisualization.cpp IccAnalyzerXMLExport.cpp IccAnalyzerCallGraph.cpp IccAnalyzerTagDetails.cpp IccHeuristicResult.cpp IccAnalyzerCapture.cpp IccHeuristicsRawPost.cpp IccHeuristicsCodeQLPatterns.cpp IccHeuristicsExploitGap.cpp IccHeuristicsRegistry.cpp IccHeuristicsLibrary.cpp IccHeuristicsTagValidation.cpp IccHeuristicsDataValidation.cpp IccHeuristicsProfileCompliance.cpp IccHeuristicsIntegrity.cpp IccHeuristicsHeader.cpp IccImageAnalyzer.cpp IccAnalyzerJson.cpp IccAnalyzerReport.cpp IccAnalyzerPAWG.cpp IccHeuristicsXmlSafety.cpp IccConformanceHeader.cpp IccConformanceTagTypes.cpp IccConformanceRequired.cpp IccConformanceLUT.cpp IccConformanceV5.cpp IccConformanceSecurity.cpp IccConformanceQuality.cpp"

          echo "Building iccanalyzer-lite: Debug + ASan + UBSan + Clang Coverage..."
          for src in $SOURCES; do
            obj="${src%.cpp}.o"
            ${CXX} ${CXXFLAGS} ${INCLUDES} -c $src -o $obj &
          done
          wait

          echo "Linking..."
          ${CXX} ${LDFLAGS} *.o ${LIBS} -o iccanalyzer-lite

          echo "[OK] Debug + Sanitizer + Coverage build complete"
          ls -lh iccanalyzer-lite
          file iccanalyzer-lite

      - name: Verify binary
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          BINARY="iccanalyzer-lite/iccanalyzer-lite"
          echo "Binary: $BINARY ($(stat -c%s "$BINARY") bytes)"
          file "$BINARY"

          # Verify sanitizer + coverage instrumentation
          if nm "$BINARY" 2>/dev/null | grep -q "__asan_init"; then
            echo "[OK] ASan instrumentation detected"
          else
            echo "[WARN] ASan symbols not found"
          fi
          if nm "$BINARY" 2>/dev/null | grep -q "__llvm_profile"; then
            echo "[OK] Clang source-based coverage instrumentation detected"
          else
            echo "[WARN] Coverage symbols not found"
          fi

          echo "binary_path=$BINARY" >> $GITHUB_ENV

      - name: Build icctest V2 (Debug + ASan + UBSan + Coverage)
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          cd iccanalyzer-lite/icctest
          chmod +x build.sh
          bash build.sh

          echo "[OK] icctest V2 build complete"
          ls -lh build/cli/icctest
          ls -lh build/lib/libIccTest.a
          ls -lh build/lib/tests/icctest_unit_tests

          # Verify ASAN + coverage instrumentation
          if nm build/cli/icctest 2>/dev/null | grep -q "__asan_init"; then
            echo "[OK] icctest ASan instrumentation detected"
          fi
          if nm build/cli/icctest 2>/dev/null | grep -q "__llvm_profile"; then
            echo "[OK] icctest coverage instrumentation detected"
          fi

      - name: Run icctest V2 unit tests
        env:
          BASH_ENV: /dev/null
          ASAN_OPTIONS: "detect_leaks=0"
          LLVM_PROFILE_FILE: "/dev/null"
        run: |
          set -euo pipefail
          iccanalyzer-lite/icctest/build/lib/tests/icctest_unit_tests

      - name: Run icctest V2 parity verification
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          cd iccanalyzer-lite/icctest
          cmake --build build --target icctest-verify-parity

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(Path("build/parity-artifacts/verify-parity-summary.json").read_text())
          summary = payload["summary"]
          raw_counts = summary["rawParity"]["counts"]
          outer_counts = summary["imageParity"]["outerImage"]["counts"]
          embedded_counts = summary["imageParity"]["embeddedRaw"]["counts"]

          print("")
          print("### icctest V2 Parity Verification")
          print("")
          print(f"- Status: `{summary['status']}`")
          print(f"- Raw parity delta: `{raw_counts.get('delta', 0)}`")
          print(f"- Image outer delta: `{outer_counts.get('delta', 0)}`")
          print(f"- Embedded raw delta: `{embedded_counts.get('delta', 0)}`")
          print(f"- Unit tests: `{summary['unitTests'].get('summaryLine', '')}`")
          print(f"- Generated image smoke: `{summary['generatedImageSmoke'].get('status', 'unknown')}`")
          print("- Artifact: `iccanalyzer-lite/icctest/build/parity-artifacts`")
          PY

      - name: Exercise icctest V2 CLI (all modes)
        env:
          BASH_ENV: /dev/null
          ASAN_OPTIONS: "detect_leaks=0,halt_on_error=0"
          LLVM_PROFILE_FILE: "${{ github.workspace }}/profraw/icctest-%p-%m.profraw"
        run: |
          set -euo pipefail
          ICCTEST="iccanalyzer-lite/icctest/build/cli/icctest"
          PROFILE="test-profiles/sRGB_D65_MAT.icc"

          echo "=== icctest --version ==="
          $ICCTEST --version

          echo "=== icctest --registry ==="
          $ICCTEST --registry | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Registry: {d[\"totalChecks\"]} checks')"

          echo "=== icctest -a (comprehensive) ==="
          $ICCTEST -a "$PROFILE" > /dev/null 2>&1 || true

          echo "=== icctest --json ==="
          $ICCTEST --json "$PROFILE" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'JSON: {d[\"stats\"][\"checksRun\"]} checks, {d[\"stats\"][\"findingsTotal\"]} findings')" || true

          echo "=== icctest --sarif ==="
          $ICCTEST --sarif "$PROFILE" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'SARIF: {len(d[\"runs\"][0][\"results\"])} results')" || true

          echo "=== icctest --report ==="
          $ICCTEST --report "$PROFILE" > /dev/null 2>&1 || true

          echo "=== icctest --pawg ==="
          $ICCTEST --pawg "$PROFILE" > /dev/null 2>&1 || true

          echo "=== icctest --csv ==="
          $ICCTEST --csv "$PROFILE" > /dev/null 2>&1 || true

          echo "=== icctest --no-sandbox ==="
          $ICCTEST --no-sandbox -a "$PROFILE" > /dev/null 2>&1 || true

          echo "=== icctest --min-severity HIGH ==="
          $ICCTEST --min-severity HIGH --json "$PROFILE" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'HIGH+ filter: {d[\"stats\"][\"findingsTotal\"]} findings')" || true

          echo "=== icctest --max-findings 5 ==="
          $ICCTEST --max-findings 5 --json "$PROFILE" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Max 5: {d[\"stats\"][\"findingsTotal\"]} findings')" || true

          # Test with multiple profiles
          echo "=== icctest batch exercise ==="
          PROFILES=$(find test-profiles/ -name "*.icc" -type f 2>/dev/null | sed -n '1,5p')
          for p in $PROFILES; do
            $ICCTEST -a "$p" > /dev/null 2>&1 || true
            echo "  [OK] $(basename "$p")"
          done

          echo "[OK] All icctest V2 CLI modes exercised"

      - name: Setup test profiles
        env:
          BASH_ENV: /dev/null
          INPUT_PROFILE_COUNT: ${{ inputs.profile_count || '50' }}
        run: |
          set -euo pipefail
          mkdir -p profraw results/outputs

          # Collect all available profiles
          find test-profiles/ -name "*.icc" > /tmp/all-profiles.txt 2>/dev/null || true
          find extended-test-profiles/ -name "*.icc" >> /tmp/all-profiles.txt 2>/dev/null || true
          find cfl/ -name "*.icc" >> /tmp/all-profiles.txt 2>/dev/null || true
          find iccanalyzer-lite/iccDEV/Testing -name "*.icc" >> /tmp/all-profiles.txt 2>/dev/null || true

          sort -u /tmp/all-profiles.txt > /tmp/all-profiles-dedup.txt

          PROFILE_COUNT=${INPUT_PROFILE_COUNT:-50}
          AVAILABLE=$(wc -l < /tmp/all-profiles-dedup.txt)

          if [ "$PROFILE_COUNT" = "all" ] || [ "$PROFILE_COUNT" = "0" ]; then
            USE_COUNT=$AVAILABLE
          else
            USE_COUNT=$((AVAILABLE < PROFILE_COUNT ? AVAILABLE : PROFILE_COUNT))
          fi

          shuf -n $USE_COUNT /tmp/all-profiles-dedup.txt > results/selected-profiles.txt
          echo "Selected $USE_COUNT profiles from $AVAILABLE available"
          echo "profile_count=$USE_COUNT" >> $GITHUB_ENV

      - name: Run CLI test suite with profiling
        env:
          BASH_ENV: /dev/null
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=0:print_scariness=1:print_stats=1:symbolize=1:print_stacktrace=1:log_path=${{ github.workspace }}/results/asan.log"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=0:log_path=${{ github.workspace }}/results/ubsan.log"
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true

          BINARY="${{ env.binary_path }}"
          MODES="heuristics:h roundtrip:r comprehensive:a ninja:n ninja-full:nf"
          SUMMARY="results/test-summary.txt"

          strip_ansi() {
            sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$1"
          }

          echo "==================================================================" > $SUMMARY
          echo "iccAnalyzer-lite Debug + Sanitizer + Coverage Test Report" >> $SUMMARY
          echo "==================================================================" >> $SUMMARY
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $SUMMARY
          echo "Build: Debug + ASan + UBSan + Clang Coverage" >> $SUMMARY
          echo "Profiles: ${{ env.profile_count }}" >> $SUMMARY
          echo "" >> $SUMMARY

          GRAND_TOTAL=0
          GRAND_CLEAN=0
          GRAND_FINDINGS=0
          SANITIZER_HITS=0

          for MODE_PAIR in $MODES; do
            MODE_NAME="${MODE_PAIR%%:*}"
            MODE_FLAG="-${MODE_PAIR##*:}"

            echo "=== $MODE_NAME ($MODE_FLAG) ===" | tee -a $SUMMARY
            mkdir -p "results/outputs/${MODE_NAME}"

            TOTAL=0
            CLEAN=0
            FINDINGS=0

            while IFS= read -r profile; do
              TOTAL=$((TOTAL + 1))
              PROFILE_NAME=$(basename "$profile")
              OUTPUT_FILE="results/outputs/${MODE_NAME}/${PROFILE_NAME}.txt"

              # Each profile run writes its own profraw
              export LLVM_PROFILE_FILE="${{ github.workspace }}/profraw/${MODE_NAME}-%p-%m.profraw"

              echo "[$MODE_NAME] Testing: $PROFILE_NAME"

              # Exit codes: 0=clean, 1=finding, 2=error, 3=usage, 128+=crash
              EXIT_CODE=0
              timeout 30s $BINARY $MODE_FLAG "$profile" > "$OUTPUT_FILE" 2>&1 || EXIT_CODE=$?
              strip_ansi "$OUTPUT_FILE"

              if [ $EXIT_CODE -ge 128 ]; then
                # Signal-based exit (SIGILL=132, SIGABRT=134, SIGSEGV=139)
                SANITIZER_HITS=$((SANITIZER_HITS + 1))
                FINDINGS=$((FINDINGS + 1))
                echo "  Result: CRASH (signal $((EXIT_CODE - 128)))" >> $SUMMARY
                echo "  [CRASH] $MODE_NAME/$PROFILE_NAME exit=$EXIT_CODE" | tee -a $SUMMARY
                tail -5 "$OUTPUT_FILE" >> $SUMMARY 2>/dev/null || true
              elif [ $EXIT_CODE -eq 2 ]; then
                # I/O error (file not found, profile read failure)
                FINDINGS=$((FINDINGS + 1))
                echo "  Result: ERROR (exit $EXIT_CODE)" >> $SUMMARY
              elif [ $EXIT_CODE -eq 1 ]; then
                # Finding detected by the analyzer
                FINDINGS=$((FINDINGS + 1))
                echo "  Result: FINDING (exit $EXIT_CODE)" >> $SUMMARY
                if grep -qi "AddressSanitizer\|LeakSanitizer\|UndefinedBehaviorSanitizer\|SUMMARY:.*Sanitizer" "$OUTPUT_FILE" 2>/dev/null; then
                  SANITIZER_HITS=$((SANITIZER_HITS + 1))
                  echo "  [SANITIZER] Detection in $MODE_NAME/$PROFILE_NAME" | tee -a $SUMMARY
                  tail -5 "$OUTPUT_FILE" >> $SUMMARY 2>/dev/null || true
                fi
              elif [ $EXIT_CODE -eq 124 ]; then
                # timeout killed the process
                FINDINGS=$((FINDINGS + 1))
                echo "  Result: TIMEOUT" >> $SUMMARY
              else
                # Exit 0 = clean per analyzer, but check content for ninja modes
                if grep -qai "MISMATCH\|overlap\|extends beyond\|truncat\|\[WARN\].*HEURISTIC\|Suspicious\|UAF RISK\|INVALID\|CORRUPT\|AddressSanitizer\|UndefinedBehaviorSanitizer" "$OUTPUT_FILE" 2>/dev/null; then
                  FINDINGS=$((FINDINGS + 1))
                  echo "  Result: FINDING (content)" >> $SUMMARY
                  if grep -qi "AddressSanitizer\|LeakSanitizer\|UndefinedBehaviorSanitizer\|SUMMARY:.*Sanitizer" "$OUTPUT_FILE" 2>/dev/null; then
                    SANITIZER_HITS=$((SANITIZER_HITS + 1))
                    echo "  [SANITIZER] Detection in $MODE_NAME/$PROFILE_NAME" | tee -a $SUMMARY
                    tail -5 "$OUTPUT_FILE" >> $SUMMARY 2>/dev/null || true
                  fi
                else
                  CLEAN=$((CLEAN + 1))
                  echo "  Result: CLEAN" >> $SUMMARY
                fi
              fi

              echo "  Profile: $PROFILE_NAME" >> $SUMMARY
            done < results/selected-profiles.txt

            echo "--- $MODE_NAME: $CLEAN/$TOTAL clean, $FINDINGS findings ---" >> $SUMMARY
            echo "" >> $SUMMARY

            GRAND_TOTAL=$((GRAND_TOTAL + TOTAL))
            GRAND_CLEAN=$((GRAND_CLEAN + CLEAN))
            GRAND_FINDINGS=$((GRAND_FINDINGS + FINDINGS))

            echo "${MODE_NAME}_total=$TOTAL" >> $GITHUB_ENV
            echo "${MODE_NAME}_clean=$CLEAN" >> $GITHUB_ENV
            echo "${MODE_NAME}_findings=$FINDINGS" >> $GITHUB_ENV
          done

          echo "==================================================================" >> $SUMMARY
          echo "FINAL: $GRAND_CLEAN/$GRAND_TOTAL clean, $GRAND_FINDINGS findings, $SANITIZER_HITS sanitizer hits" >> $SUMMARY
          echo "==================================================================" >> $SUMMARY

          echo "grand_total=$GRAND_TOTAL" >> $GITHUB_ENV
          echo "grand_clean=$GRAND_CLEAN" >> $GITHUB_ENV
          echo "grand_findings=$GRAND_FINDINGS" >> $GITHUB_ENV
          echo "sanitizer_hits=$SANITIZER_HITS" >> $GITHUB_ENV

          cat $SUMMARY

          # Verify profraw files were generated
          PROFRAW_COUNT=$(find "${{ github.workspace }}/profraw" -name "*.profraw" 2>/dev/null | wc -l)
          echo "Generated $PROFRAW_COUNT .profraw files"

      - name: Collect sanitizer logs
        if: always()
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          mkdir -p results/sanitizer-logs

          # Collect ASan/UBSan log files (written to workspace by ASAN_OPTIONS/UBSAN_OPTIONS)
          find "${{ github.workspace }}/results" -name "asan.log*" -exec cp {} results/sanitizer-logs/ \; 2>/dev/null || true
          find "${{ github.workspace }}/results" -name "ubsan.log*" -exec cp {} results/sanitizer-logs/ \; 2>/dev/null || true

          LOG_COUNT=$(find results/sanitizer-logs -type f 2>/dev/null | wc -l)
          echo "Collected $LOG_COUNT sanitizer log files"

          if [ "$LOG_COUNT" -gt 0 ]; then
            echo "--- Sanitizer Log Summary ---"
            for log in results/sanitizer-logs/*; do
              echo "=== $(basename "$log") ==="
              head -20 "$log"
              echo ""
            done
          fi

      - name: Merge profdata and generate coverage report
        if: always()
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          mkdir -p results/coverage

          # Merge all .profraw files
          PROFRAW_COUNT=$(find "${{ github.workspace }}/profraw" -name "*.profraw" 2>/dev/null | wc -l)
          echo "Found $PROFRAW_COUNT .profraw files"

          if [ "$PROFRAW_COUNT" -eq 0 ]; then
            echo "::warning::No profraw files generated — coverage instrumentation may have failed"
            echo "No coverage data available" > results/coverage/coverage-summary.txt
            exit 0
          fi

          llvm-profdata-18 merge \
            -sparse \
            "${{ github.workspace }}"/profraw/*.profraw \
            -o results/coverage/merged.profdata

          echo "Merged profdata: $(stat -c%s results/coverage/merged.profdata) bytes"

          MAIN_BIN="${{ env.binary_path }}"

          # Generate text summary report
          echo "--- Coverage Summary Report ---"
          llvm-cov-18 report \
            "$MAIN_BIN" \
            -instr-profile=results/coverage/merged.profdata \
            -ignore-filename-regex='(third_party|/usr/|test)' \
            2>&1 | tee results/coverage/coverage-summary.txt

          # Generate HTML report
          llvm-cov-18 show \
            "$MAIN_BIN" \
            -instr-profile=results/coverage/merged.profdata \
            -format=html \
            -output-dir=results/coverage/html \
            -show-line-counts-or-regions \
            -show-expansions \
            -ignore-filename-regex='(third_party|/usr/|test)' \
            2>&1 | tail -5

          # Generate lcov-compatible export
          llvm-cov-18 export \
            "$MAIN_BIN" \
            -instr-profile=results/coverage/merged.profdata \
            -format=lcov \
            -ignore-filename-regex='(third_party|/usr/|test)' \
            > results/coverage/lcov.info 2>/dev/null || true

          # Report stats
          if [ -d results/coverage/html ]; then
            HTML_COUNT=$(find results/coverage/html -name "*.html" | wc -l)
            echo "HTML report: $HTML_COUNT files"
          fi

          LCOV_RECORDS=$(grep -c "^SF:" results/coverage/lcov.info 2>/dev/null || echo 0)
          echo "LCOV: $LCOV_RECORDS source file records"

      - name: Generate results index
        if: always()
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          cd results

          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'unsafe-inline'">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>iccAnalyzer-lite Debug + Sanitizer + Coverage Report</title>
            <style>
              body { font-family: monospace; margin: 20px; background: #f5f5f5; }
              .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; }
              h1 { color: #333; border-bottom: 2px solid #007acc; padding-bottom: 10px; }
              h2 { color: #555; }
              .summary { background: #e8f4f8; padding: 15px; margin: 20px 0; border-left: 4px solid #007acc; }
              .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
              .stat-box { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; text-align: center; }
              .stat-value { font-size: 2em; font-weight: bold; color: #007acc; }
              .stat-label { color: #666; margin-top: 5px; }
              pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; overflow-x: auto; border-radius: 4px; }
              table { width: 100%; border-collapse: collapse; margin: 20px 0; }
              th, td { padding: 10px; text-align: left; border: 1px solid #ddd; }
              th { background: #007acc; color: white; }
              tr:nth-child(even) { background: #f9f9f9; }
              .clean { color: green; font-weight: bold; }
              .finding { color: #cc6600; font-weight: bold; }
              .sanitizer { color: red; font-weight: bold; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>iccAnalyzer-lite Debug + Sanitizer + Coverage Report</h1>
          HTMLEOF

          echo "<div class='summary'>" >> index.html
          echo "<strong>Date:</strong> $(date -u '+%Y-%m-%d %H:%M:%S UTC')<br>" >> index.html
          echo "<strong>Build:</strong> Debug + ASan + UBSan + Clang Source-Based Coverage<br>" >> index.html
          echo "<strong>Compiler:</strong> clang++-18<br>" >> index.html
          echo "<strong>Modes:</strong> -h (heuristics), -r (roundtrip), -a (comprehensive), -n (ninja), -nf (ninja-full)" >> index.html
          echo "</div>" >> index.html

          echo "<div class='stats'>" >> index.html
          echo "<div class='stat-box'><div class='stat-value'>${{ env.grand_total }}</div><div class='stat-label'>Total Tests</div></div>" >> index.html
          echo "<div class='stat-box'><div class='stat-value' style='color: green;'>${{ env.grand_clean }}</div><div class='stat-label'>Clean</div></div>" >> index.html
          echo "<div class='stat-box'><div class='stat-value' style='color: #cc6600;'>${{ env.grand_findings }}</div><div class='stat-label'>Findings</div></div>" >> index.html
          echo "<div class='stat-box'><div class='stat-value' style='color: red;'>${{ env.sanitizer_hits }}</div><div class='stat-label'>Sanitizer Hits</div></div>" >> index.html
          echo "</div>" >> index.html

          # Coverage summary
          if [ -f coverage/coverage-summary.txt ]; then
            echo "<h2>Code Coverage Summary (llvm-cov)</h2>" >> index.html
            echo "<pre>" >> index.html
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' coverage/coverage-summary.txt >> index.html
            echo "</pre>" >> index.html
          fi

          # Link to detailed HTML coverage report
          if [ -d coverage/html ]; then
            echo "<h2>Detailed Coverage</h2>" >> index.html
            echo "<p><a href='coverage/html/index.html'>View detailed llvm-cov HTML report</a></p>" >> index.html
          fi

          html_esc() { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g; s/'"'"'/\&#39;/g'; }

          # Per-mode results
          for MODE_NAME in heuristics roundtrip comprehensive ninja ninja-full; do
            if [ -d "outputs/${MODE_NAME}" ]; then
              case "${MODE_NAME}" in
                heuristics)    FLAG="-h" ;;
                roundtrip)     FLAG="-r" ;;
                comprehensive) FLAG="-a" ;;
                ninja)         FLAG="-n" ;;
                ninja-full)    FLAG="-nf" ;;
              esac

              echo "<h2>${MODE_NAME} Mode (${FLAG})</h2>" >> index.html
              echo "<table>" >> index.html
              echo "<tr><th>#</th><th>Profile</th><th>Status</th><th>Output</th><th>Size</th></tr>" >> index.html

              NUM=1
              while IFS= read -r profile; do
                PROFILE_NAME=$(basename "$profile")
                OUTPUT_FILE="outputs/${MODE_NAME}/${PROFILE_NAME}.txt"

                if [ -f "$OUTPUT_FILE" ]; then
                  FILE_SIZE=$(stat -c%s "$OUTPUT_FILE" 2>/dev/null || echo 0)

                  if grep -qi "AddressSanitizer\|LeakSanitizer\|UndefinedBehaviorSanitizer\|SUMMARY:.*Sanitizer" "$OUTPUT_FILE" 2>/dev/null; then
                    STATUS="<span class='sanitizer'>SANITIZER</span>"
                  elif grep -qi "\[ERR\]\|\[WARN\].*HEURISTIC\|Error reading ICC profile\|failed validation\|MISMATCH\|overlap\|Suspicious\|UAF RISK\|INVALID\|CORRUPT" "$OUTPUT_FILE" 2>/dev/null; then
                    STATUS="<span class='finding'>FINDING</span>"
                  else
                    STATUS="<span class='clean'>CLEAN</span>"
                  fi

                  echo "<tr><td>$NUM</td><td><code>$(html_esc "$PROFILE_NAME")</code></td><td>$STATUS</td><td><a href='$(html_esc "$OUTPUT_FILE")'>View</a></td><td>$FILE_SIZE bytes</td></tr>" >> index.html
                  NUM=$((NUM + 1))
                fi
              done < selected-profiles.txt

              echo "</table>" >> index.html
            fi
          done

          echo "</div></body></html>" >> index.html
          echo "Results index created"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: iccanalyzer-debug-sanitizer-coverage
          path: |
            results/
            iccanalyzer-lite/icctest/build/parity-artifacts/
          retention-days: 90

      - name: Upload icctest CLI bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: icctest-cli-debug-sanitizer-coverage
          path: |
            iccanalyzer-lite/icctest/build/cli/icctest
            iccanalyzer-lite/icctest/build/tools/icctest-parity
            iccanalyzer-lite/icctest/README.md
            iccanalyzer-lite/icctest/tools/heuristic-remap.tsv
          retention-days: 90

      # -----------------------------------------------------------------------
      # Generate LUT visualizations SVG + TIFF (iccanalyzer-lite -luts)
      # -----------------------------------------------------------------------
      - name: Generate LUT visualizations (SVG + TIFF)
        if: always()
        env:
          BASH_ENV: /dev/null
          LD_LIBRARY_PATH: "${{ github.workspace }}/iccanalyzer-lite/iccDEV/Build/IccProfLib:${{ github.workspace }}/iccanalyzer-lite/iccDEV/Build/IccXML"
          ASAN_OPTIONS: "halt_on_error=0,detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=0,print_stacktrace=1"
          LLVM_PROFILE_FILE: "/dev/null"
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true

          BINARY="iccanalyzer-lite/iccanalyzer-lite"
          OUTDIR="results/lut-visualizations"
          mkdir -p "$OUTDIR"

          if [ ! -x "$BINARY" ]; then
            echo "WARN: iccanalyzer-lite not found, skipping LUT visualization"
            exit 0
          fi

          # Use the same selected profiles from the test run
          PROFILES="results/selected-profiles.txt"
          if [ ! -f "$PROFILES" ]; then
            find test-profiles/ -name '*.icc' -type f 2>/dev/null | sed -n '1,50p' > /tmp/svg-profiles.txt
            PROFILES="/tmp/svg-profiles.txt"
          fi

          while IFS= read -r profile; do
            [ -f "$profile" ] || continue
            name="$(basename "$profile" .icc)"
            dir="$(dirname "$profile")"
            echo "  -luts: $profile"
            timeout 30 "$BINARY" -luts "$profile" 2>/dev/null || true
            # Collect SVG
            if [ -f "$dir/${name}_luts.svg" ]; then
              cp "$dir/${name}_luts.svg" "$OUTDIR/"
            fi
            # Collect TIFFs (e.g. _A2B0.tif, _B2A0.tif, _kTRC.tif)
            for tif in "$dir"/${name}_*.tif; do
              [ -f "$tif" ] || continue
              cp "$tif" "$OUTDIR/"
            done
          done < "$PROFILES"

          SVG_COUNT=$(find "$OUTDIR" -name '*.svg' 2>/dev/null | wc -l)
          TIF_COUNT=$(find "$OUTDIR" -name '*.tif' 2>/dev/null | wc -l)
          echo "Generated $SVG_COUNT SVG + $TIF_COUNT TIFF files"

          {
            echo ""
            echo "### LUT Visualizations (SVG + TIFF)"
            echo ""
            echo "**$SVG_COUNT** SVG + **$TIF_COUNT** TIFF files via \`iccanalyzer-lite -luts\`"
            if [ "$SVG_COUNT" -gt 0 ] || [ "$TIF_COUNT" -gt 0 ]; then
              echo ""
              echo "| File | Size |"
              echo "|------|------|"
              for f in "$OUTDIR"/*.svg "$OUTDIR"/*.tif; do
                [ -f "$f" ] || continue
                sz=$(stat -c%s "$f" 2>/dev/null || echo "?")
                echo "| $(basename "$f") | ${sz} bytes |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # Upload LUT visualizations (SVG + TIFF)
      # -----------------------------------------------------------------------
      - name: Upload LUT visualizations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: iccanalyzer-lut-visualizations
          path: results/lut-visualizations/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # -----------------------------------------------------------------------
      # LUT Text I/O and .cube round-trip exercises
      # -----------------------------------------------------------------------
      - name: LUT Text I/O and Cube exercises
        if: always()
        env:
          BASH_ENV: /dev/null
          LD_LIBRARY_PATH: "${{ github.workspace }}/iccanalyzer-lite/iccDEV/Build/IccProfLib:${{ github.workspace }}/iccanalyzer-lite/iccDEV/Build/IccXML"
          ASAN_OPTIONS: "halt_on_error=0,detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=0,print_stacktrace=1"
          LLVM_PROFILE_FILE: "${{ github.workspace }}/profraw/lut-io-%p-%m.profraw"
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true

          BINARY="iccanalyzer-lite/iccanalyzer-lite"
          OUTDIR="results/lut-text-io"
          mkdir -p "$OUTDIR"

          if [ ! -x "$BINARY" ]; then
            echo "WARN: iccanalyzer-lite not found, skipping LUT Text I/O"
            exit 0
          fi

          TOTAL=0
          PASS=0
          FAIL=0
          ASAN_HITS=0

          log_result() {
            local name="$1" exit_code="$2" stderr_file="$3"
            TOTAL=$((TOTAL + 1))
            local asan_count=0
            if [ -f "$stderr_file" ]; then
              # Count real ASAN/UBSAN errors, excluding IccMD5.cpp noise
              # MD5 uses intentional 32-bit wrapping arithmetic (RFC 1321),
              # which triggers -fsanitize=integer false positives
              asan_count=$(grep -E "ERROR: AddressSanitizer|ERROR: LeakSanitizer" "$stderr_file" 2>/dev/null | wc -l || true)
              local ubsan_count
              # Filter out known false positives and upstream library noise:
              #   "unsigned integer overflow" — defined C/C++ behavior (wrapping)
              #   "implicit conversion" — truncation/sign-change sanitizer
              #   "negation of .* cannot be represented" — unsigned negation
              #   IccMD5.cpp — RFC 1321 intentional 32-bit wrapping arithmetic
              #   iccDEV/ paths — upstream library UBSAN (float-cast-overflow,
              #     NaN-to-int in IccMpeBasic/IccMatrixMath/IccCAM/IccTagLut,
              #     div-by-zero in IccCAM/IccProfile). Not actionable by us.
              ubsan_count=$(grep "runtime error:" "$stderr_file" 2>/dev/null \
                | grep -v "IccMD5.cpp" \
                | grep -v "iccDEV/" \
                | grep -v "unsigned integer overflow" \
                | grep -v "implicit conversion" \
                | grep -v "negation of .* cannot be represented" \
                | wc -l || true)
              asan_count=$((asan_count + ubsan_count))
            fi
            if [ "$asan_count" -gt 0 ]; then
              ASAN_HITS=$((ASAN_HITS + 1))
              FAIL=$((FAIL + 1))
              echo "  [ASAN] $name (exit=$exit_code, asan=$asan_count)"
            elif [ "$exit_code" -ge 128 ]; then
              FAIL=$((FAIL + 1))
              echo "  [CRASH] $name (exit=$exit_code)"
            else
              PASS=$((PASS + 1))
              echo "  [OK] $name (exit=$exit_code)"
            fi
          }

          echo "=== LUT Text Export (-xt) ==="
          # Test -xt on a selection of profiles with different tag structures
          XT_PROFILES=(
            "test-profiles/sRGB_D65_MAT.icc"
            "test-profiles/sRGB_D65_MAT-500lx.icc"
          )
          # Add profiles with AToB/BToA tags if available
          for p in test-profiles/Rec2100HlgFull*.icc test-profiles/sRGB2014*.icc; do
            [ -f "$p" ] && XT_PROFILES+=("$p")
          done
          # Cap at 10 profiles
          XT_PROFILES=("${XT_PROFILES[@]:0:10}")

          for profile in "${XT_PROFILES[@]}"; do
            [ -f "$profile" ] || continue
            name="$(basename "$profile" .icc)"
            prefix="$OUTDIR/${name}_"
            EC=0
            timeout 30 "$BINARY" -xt "$profile" "$prefix" > "$OUTDIR/${name}_xt.log" 2>&1 || EC=$?
            log_result "xt:${name}" "$EC" "$OUTDIR/${name}_xt.log"
            # Count generated text files
            txt_count=$(find "$OUTDIR" -name "${name}_*.txt" 2>/dev/null | wc -l)
            echo "    → $txt_count text file(s) exported"
          done

          echo ""
          echo "=== .cube Export (-cube) ==="
          # Export .cube from profiles with 3D CLUTs (AToB0Tag)
          CUBE_PROFILES=(
            "test-profiles/fuzzed-prtr-Lab-414k.icc"
          )
          for p in test-profiles/Rec2100HlgFull*.icc test-profiles/Rec2020*.icc; do
            [ -f "$p" ] && CUBE_PROFILES+=("$p")
          done
          CUBE_PROFILES=("${CUBE_PROFILES[@]:0:5}")

          for profile in "${CUBE_PROFILES[@]}"; do
            [ -f "$profile" ] || continue
            name="$(basename "$profile" .icc)"
            cube_out="$OUTDIR/${name}.cube"
            EC=0
            timeout 30 "$BINARY" -cube "$profile" AToB0Tag "$cube_out" > "$OUTDIR/${name}_cube.log" 2>&1 || EC=$?
            log_result "cube:${name}" "$EC" "$OUTDIR/${name}_cube.log"
            if [ -f "$cube_out" ]; then
              sz=$(stat -c%s "$cube_out" 2>/dev/null || echo "?")
              echo "    → $cube_out ($sz bytes)"
            fi
          done

          echo ""
          echo "=== .cube Import (-from-cube) ==="
          # Import .cube files from seed corpus
          CUBE_SEEDS=(
            "cfl/icc_fromcube_fuzzer_seed_corpus/identity_2x2x2.cube"
            "cfl/icc_fromcube_fuzzer_seed_corpus/input_range_video_5x5x5.cube"
            "cfl/icc_fromcube_fuzzer_seed_corpus/custom_domain_3x3x3.cube"
          )
          for cube in "${CUBE_SEEDS[@]}"; do
            [ -f "$cube" ] || continue
            name="$(basename "$cube" .cube)"
            icc_out="$OUTDIR/${name}_from_cube.icc"
            EC=0
            timeout 30 "$BINARY" -from-cube "$cube" "$icc_out" > "$OUTDIR/${name}_fromcube.log" 2>&1 || EC=$?
            log_result "from-cube:${name}" "$EC" "$OUTDIR/${name}_fromcube.log"
            if [ -f "$icc_out" ]; then
              sz=$(stat -c%s "$icc_out" 2>/dev/null || echo "?")
              echo "    → $icc_out ($sz bytes)"
              # Validate the generated ICC profile with -a
              EC2=0
              timeout 30 "$BINARY" -a "$icc_out" > "$OUTDIR/${name}_validate.log" 2>&1 || EC2=$?
              log_result "validate-from-cube:${name}" "$EC2" "$OUTDIR/${name}_validate.log"
            fi
          done

          echo ""
          echo "=== .cube Round-Trip (import → export → compare) ==="
          # Full round-trip: .cube → ICC → .cube → compare
          RT_CUBE="cfl/icc_fromcube_fuzzer_seed_corpus/identity_2x2x2.cube"
          if [ -f "$RT_CUBE" ]; then
            RT_ICC="$OUTDIR/rt_identity.icc"
            RT_CUBE_OUT="$OUTDIR/rt_identity_exported.cube"
            EC=0
            # Import
            timeout 30 "$BINARY" -from-cube "$RT_CUBE" "$RT_ICC" > "$OUTDIR/rt_import.log" 2>&1 || EC=$?
            log_result "rt-cube-import" "$EC" "$OUTDIR/rt_import.log"
            # Export back
            if [ -f "$RT_ICC" ]; then
              EC=0
              timeout 30 "$BINARY" -cube "$RT_ICC" AToB0Tag "$RT_CUBE_OUT" > "$OUTDIR/rt_export.log" 2>&1 || EC=$?
              log_result "rt-cube-export" "$EC" "$OUTDIR/rt_export.log"
            fi
          fi

          echo ""
          echo "=== Text Import Round-Trip (-xt → edit → -it) ==="
          # Extract text, then re-import unchanged to verify round-trip
          RT_PROFILE="test-profiles/sRGB_D65_MAT.icc"
          if [ -f "$RT_PROFILE" ]; then
            RT_PREFIX="$OUTDIR/rt_srgb_"
            EC=0
            timeout 30 "$BINARY" -xt "$RT_PROFILE" "$RT_PREFIX" > "$OUTDIR/rt_xt.log" 2>&1 || EC=$?
            log_result "rt-text-extract" "$EC" "$OUTDIR/rt_xt.log"

            # Find exported text files and try re-importing each
            for txt in "$OUTDIR"/rt_srgb_*.txt; do
              [ -f "$txt" ] || continue
              tname="$(basename "$txt")"
              RT_OUT="$OUTDIR/rt_srgb_modified.icc"
              cp "$RT_PROFILE" "$RT_OUT"
              EC=0
              timeout 30 "$BINARY" -it "$RT_OUT" "$txt" > "$OUTDIR/rt_it_${tname}.log" 2>&1 || EC=$?
              log_result "rt-text-import:${tname}" "$EC" "$OUTDIR/rt_it_${tname}.log"
            done
          fi

          echo ""
          echo "=== Error Handling ==="
          # Verify graceful rejection of bad inputs
          EC=0
          timeout 10 "$BINARY" -xt "/tmp/nonexistent.icc" "$OUTDIR/bad_" > "$OUTDIR/err_xt.log" 2>&1 || EC=$?
          log_result "err-xt-nonexistent" "$EC" "$OUTDIR/err_xt.log"
          [ "$EC" -ne 0 ] && echo "    → correctly rejected (exit=$EC)"

          # Bad .cube
          echo "TITLE bad" > "$OUTDIR/bad.cube"
          echo "LUT_3D_SIZE 0" >> "$OUTDIR/bad.cube"
          EC=0
          timeout 10 "$BINARY" -from-cube "$OUTDIR/bad.cube" "$OUTDIR/bad_out.icc" > "$OUTDIR/err_cube.log" 2>&1 || EC=$?
          log_result "err-bad-cube" "$EC" "$OUTDIR/err_cube.log"
          [ "$EC" -ne 0 ] && echo "    → correctly rejected (exit=$EC)"

          echo ""
          echo "==========================================="
          echo "LUT Text I/O Results: $PASS/$TOTAL passed, $FAIL failed, $ASAN_HITS ASAN"
          echo "==========================================="

          {
            echo ""
            echo "### LUT Text I/O & Cube Exercises"
            echo ""
            echo "**$PASS/$TOTAL** passed, **$FAIL** failed, **$ASAN_HITS** ASAN/UBSAN hits"
            echo ""
            echo "| Exercise | Result |"
            echo "|----------|--------|"
            echo "| Text export (\`-xt\`) | ${#XT_PROFILES[@]} profiles tested |"
            echo "| Cube export (\`-cube\`) | ${#CUBE_PROFILES[@]} profiles tested |"
            echo "| Cube import (\`-from-cube\`) | ${#CUBE_SEEDS[@]} cube files tested |"
            echo "| Cube round-trip | import → export → compare |"
            echo "| Text round-trip | extract → import unchanged |"
            echo "| Error handling | bad inputs correctly rejected |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the step if any ASAN hits
          if [ "$ASAN_HITS" -gt 0 ]; then
            echo "[CRITICAL] $ASAN_HITS ASAN/UBSAN error(s) detected in LUT I/O exercises"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Upload LUT Text I/O artifacts
      # -----------------------------------------------------------------------
      - name: Upload LUT Text I/O artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: iccanalyzer-lut-text-io
          path: results/lut-text-io/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Report to summary
        if: always()
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## iccAnalyzer-lite Debug + Sanitizer + Coverage Report

          ### Build Configuration
          | Setting | Value |
          |---------|-------|
          | Build Type | Debug |
          | Compiler | clang++-18 |
          | Sanitizers | ASan + UBSan |
          | Coverage | Clang source-based (-fprofile-instr-generate -fcoverage-mapping) |
          | Optimization | -O0 |

          ### Test Results
          | Metric | Value |
          |--------|-------|
          | Total Tests | ${{ env.grand_total }} |
          | Clean | ${{ env.grand_clean }} |
          | Findings | ${{ env.grand_findings }} |
          | Sanitizer Hits | ${{ env.sanitizer_hits }} |
          | Profiles Tested | ${{ env.profile_count }} |

          ### Per-Mode Breakdown
          | Mode | Flag | Clean | Findings | Total |
          |------|------|-------|----------|-------|
          | Heuristics | -h | ${{ env.heuristics_clean }} | ${{ env.heuristics_findings }} | ${{ env.heuristics_total }} |
          | Round-trip | -r | ${{ env.roundtrip_clean }} | ${{ env.roundtrip_findings }} | ${{ env.roundtrip_total }} |
          | Comprehensive | -a | ${{ env.comprehensive_clean }} | ${{ env.comprehensive_findings }} | ${{ env.comprehensive_total }} |
          | Ninja | -n | ${{ env.ninja_clean }} | ${{ env.ninja_findings }} | ${{ env.ninja_total }} |
          | Ninja-full | -nf | ${{ env.ninja-full_clean }} | ${{ env.ninja-full_findings }} | ${{ env.ninja-full_total }} |

          ### Code Coverage
          EOF

          if [ -f results/coverage/coverage-summary.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            sanitize_codeblock "$(cat results/coverage/coverage-summary.txt)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          fi

          {
            echo ""
            echo "### Artifacts"
            echo "- **\`iccanalyzer-debug-sanitizer-coverage\`**: Full results archive"
            echo "  - \`coverage/html/\`: llvm-cov HTML report with line-by-line coverage"
            echo "  - \`coverage/lcov.info\`: lcov-compatible coverage data"
            echo "  - \`coverage/coverage-summary.txt\`: Text coverage summary"
            echo "  - \`sanitizer-logs/\`: ASan and UBSan log files"
            echo "  - \`outputs/\`: Per-mode CLI output files"
            echo "  - \`index.html\`: Interactive results dashboard"
            echo ""
            echo "### Status"
          } >> $GITHUB_STEP_SUMMARY

          SANITIZER_HITS="${{ env.sanitizer_hits }}"
          SANITIZER_HITS="${SANITIZER_HITS:-0}"
          GRAND_FINDINGS="${{ env.grand_findings }}"
          GRAND_FINDINGS="${GRAND_FINDINGS:-0}"

          if [ "$SANITIZER_HITS" -gt 0 ]; then
            echo "[WARN] **${SANITIZER_HITS} SANITIZER HIT(S)** detected — review sanitizer-logs/ in the artifact" >> $GITHUB_STEP_SUMMARY
          elif [ "$GRAND_FINDINGS" -gt 0 ]; then
            echo "**${GRAND_FINDINGS} FINDING(S)** — non-sanitizer detections (validation errors, exit codes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "[OK] **ALL CLEAN** — No sanitizer findings across all modes" >> $GITHUB_STEP_SUMMARY
          fi
