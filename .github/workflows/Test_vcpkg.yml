name: Test_vcpkg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      matrix:
        build_type: [Debug]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies & build
        run: |
          git clone https://github.com/InternationalColorConsortium/iccDEV.git
          cd iccDEV
          $root = (Get-Location).Path
          Write-Host "========= Fetching dependencies ================`n"
          Start-BitsTransfer -Source "https://github.com/InternationalColorConsortium/iccDEV/releases/download/vcpkg-win-23241-libheif-deps/iccdev-windows-vcpkg-classic-libheif-3087493.zip" -Destination "deps.zip"
          if ((Get-FileHash -LiteralPath "deps.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne "9b051a50f152f616986e735d618a2f5ade2cf5443c680216894f2897dbbf5eca") { throw "Dependency archive SHA256 mismatch" }
          Write-Host "========= Extracting dependencies ================`n"
          tar -xf deps.zip
          Remove-Item deps.zip
          Write-Host "========= Configuring iccDEV ================`n"
          cmake -B Build\Cmake\build -S Build\Cmake -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$root\scripts\buildsystems\vcpkg.cmake" -DVCPKG_MANIFEST_MODE=OFF -DICCDEV_WINDOWS_UNIFIED_RUNTIME=OFF -Wno-dev
          Write-Host "========= Building iccDEV ================`n"
          cmake --build Build\Cmake\build --config Debug --parallel
          cd examples\hello-iccdev
          Write-Host "========= Configuring hello-iccdev ================`n"
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$root\scripts\buildsystems\vcpkg.cmake" -DVCPKG_MANIFEST_MODE=OFF "-DICCDEV_ROOT=$root" "-DICCDEV_BUILD_DIR=$root\Build\Cmake\build" -Wno-dev
          Write-Host "========= Building hello-iccdev ================`n"
          cmake --build build --config Debug --parallel
          Write-Host "========= Running hello-iccdev ================`n"
          .\build\Debug\hello-iccdev.exe



