###############################################################
# Copyright (c) 2026 David H Hoyt LLC
#
# Intent: CodeQL security analysis for all research tools
#
# Last Updated: 2026-02-25 14:00:00 UTC
#
# Targets: iccanalyzer-lite, icctest, colorbleed_tools, mcp-server (Python)
# Queries: 17 custom C++ (per target) + 6 custom Python + security-and-quality + security-experimental
###############################################################

name: CodeQL Security Analysis

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Analysis target'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - iccanalyzer-lite
          - colorbleed_tools
          - mcp-server
      ref:
        description: 'iccDEV branch (for C++ targets)'
        required: false
        default: 'master'
        type: choice
        options:
          - master

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc {0}

env:
  BASH_ENV: /dev/null
  ICCDEV_REF: ${{ github.event.inputs.ref || 'master' }}

jobs:
  codeql-analysis:
    name: CodeQL Security Analysis - ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        target: [iccanalyzer-lite, icctest, colorbleed_tools]

    env:
      BASH_ENV: /dev/null
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-env
        with:
          preset: 'codeql'

      - name: Cache iccDEV repository
        id: cache-iccdev
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.0.0 (node24)
        with:
          path: iccDEV
          key: ${{ runner.os }}-iccdev-codeql-${{ matrix.target }}-${{ github.event.inputs.ref || 'master' }}-${{ hashFiles('.github/workflows/codeql-security-analysis.yml') }}

      - name: "Clone iccDEV repository (${{ github.event.inputs.ref || 'master' }})"
        if: steps.cache-iccdev.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          REF="$ICCDEV_REF"
          if [ ! -d "iccDEV" ]; then
            git clone --depth 1 --branch "$REF" https://github.com/InternationalColorConsortium/iccDEV.git iccDEV
          fi
          cd iccDEV
          # Comment out wxWidgets requirement
          sed -i 's/^  find_package(wxWidgets/#  find_package(wxWidgets/' Build/Cmake/CMakeLists.txt
          sed -i 's/^      ADD_SUBDIRECTORY(Tools\/wxProfileDump)/#      ADD_SUBDIRECTORY(Tools\/wxProfileDump)/' Build/Cmake/CMakeLists.txt
          sed -i 's/^    message(FATAL_ERROR "wxWidgets not found/#    message(FATAL_ERROR "wxWidgets not found/' Build/Cmake/CMakeLists.txt

      - name: Build iccDEV libraries
        run: |
          set -euo pipefail
          cd iccDEV/Build
          # Disable LTO so static archives contain ELF objects (not LLVM bitcode).
          # The sed is needed until iccDEV merges fix-cmake-lto branch; after that,
          # -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF alone suffices.
          sed -i 's/set(CMAKE_INTERPROCEDURAL_OPTIMIZATION ON)/# LTO disabled by downstream CI\n    # set(CMAKE_INTERPROCEDURAL_OPTIMIZATION ON)/' Cmake/CMakeLists.txt 2>/dev/null || true
          sed -i 's/set(CMAKE_DEBUG_POSTFIX "d")/set(CMAKE_DEBUG_POSTFIX "")/' Cmake/CMakeLists.txt
          cmake Cmake -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DENABLE_TOOLS=OFF -DENABLE_STATIC_LIBS=ON
          make -j$(nproc) IccProfLib2 IccXML2 IccJSON2 IccProfLib2-static IccXML2-static IccJSON2-static

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: cpp
          config-file: ${{ matrix.target == 'icctest' && 'iccanalyzer-lite/codeql-config.yml' || format('{0}/codeql-config.yml', matrix.target) }}

      - name: Build for CodeQL - iccanalyzer-lite
        if: matrix.target == 'iccanalyzer-lite'
        run: |
          set -euo pipefail
          cd iccanalyzer-lite
          export CXX="clang++" CXXFLAGS="-std=c++17 -g -O0 -DICCANALYZER_LITE"
          export INCLUDES="-I../iccDEV/Build/IccProfLib -I../iccDEV/Build/IccXML -I../iccDEV/IccProfLib -I../iccDEV/IccXML/IccLibXML -I../iccDEV/IccJSON/IccLibJSON -I/usr/include/libxml2"
          SRCS=$(grep '^SOURCES=' build.sh | head -1 | sed 's/^SOURCES=//' | tr -d '"')
          for src in $SRCS; do
            $CXX $CXXFLAGS $INCLUDES -c "$src" -o "${src%.cpp}.o"
          done
          OBJS=$(echo "$SRCS" | sed 's/\.cpp/.o/g')
          $CXX $OBJS \
            -L../iccDEV/Build/IccProfLib -L../iccDEV/Build/IccXML \
            -lIccProfLib2 -lIccXML2 -lxml2 -lssl -lcrypto -lz -llzma -lm -ltiff -lpng -ljpeg \
            -Wl,--allow-multiple-definition \
            -o iccanalyzer-lite

      - name: Build for CodeQL - icctest
        if: matrix.target == 'icctest'
        run: |
          set -euo pipefail
          cd iccanalyzer-lite/icctest
          # Use cmake for icctest — CodeQL traces the build automatically
          cmake -B build-codeql \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=OFF \
            -DENABLE_COVERAGE=OFF \
            -DICCDEV_ROOT=$GITHUB_WORKSPACE/iccDEV
          cmake --build build-codeql -j$(nproc) 2>&1 | tail -20

      - name: Build for CodeQL - colorbleed_tools
        if: matrix.target == 'colorbleed_tools'
        run: |
          set -euo pipefail
          cd colorbleed_tools
          export CXX="clang++" CXXFLAGS="-std=c++17 -g -O0"
          export INCLUDES="-I../iccDEV/Build/IccProfLib -I../iccDEV/Build/IccXML -I../iccDEV/IccProfLib -I../iccDEV/IccXML/IccLibXML -I../iccDEV/IccJSON/IccLibJSON -I/usr/include/libxml2"
          $CXX $CXXFLAGS $INCLUDES IccFromXml_unsafe.cpp -c -o IccFromXml_unsafe.o
          $CXX $CXXFLAGS $INCLUDES IccToXml_unsafe.cpp -c -o IccToXml_unsafe.o
          $CXX IccFromXml_unsafe.o \
            -L../iccDEV/Build/IccProfLib -L../iccDEV/Build/IccXML \
            -lIccProfLib2 -lIccXML2 -lxml2 -lz -lm -o iccFromXml_unsafe
          $CXX IccToXml_unsafe.o \
            -L../iccDEV/Build/IccProfLib -L../iccDEV/Build/IccXML \
            -lIccProfLib2 -lIccXML2 -lxml2 -lz -lm -o iccToXml_unsafe

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: "/language:cpp/${{ matrix.target }}"
          output: codeql-results

      - name: Generate Reports
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p reports analysis-bundle/${MATRIX_TARGET}

          SARIF_FILE=$(find codeql-results -name "*.sarif" | sed -n '1,1p')

          if [ -z "$SARIF_FILE" ]; then
            FINDINGS=0
            echo "No SARIF file found"
          else
            pip install --quiet sarif-tools 2>/dev/null || true
            FINDINGS=$(jq '.runs[0].results | length' "$SARIF_FILE" 2>/dev/null || echo 0)

            sarif html "$SARIF_FILE" -o reports/${MATRIX_TARGET}-report.html 2>/dev/null || \
              echo "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; script-src 'none'; style-src 'unsafe-inline'\"><title>CodeQL: ${MATRIX_TARGET}</title></head><body><h1>CodeQL: ${MATRIX_TARGET}</h1><p>Findings: $FINDINGS</p></body></html>" \
              > reports/${MATRIX_TARGET}-report.html

            sarif csv "$SARIF_FILE" -o reports/${MATRIX_TARGET}-findings.csv 2>/dev/null || \
              echo "File,Location,Rule,Severity,Message" > reports/${MATRIX_TARGET}-findings.csv

            jq --arg target "${MATRIX_TARGET}" \
              '{target: $target, timestamp: (now|strftime("%Y-%m-%d %H:%M:%S UTC")), findings: (.runs[0].results|length)}' \
              "$SARIF_FILE" > reports/${MATRIX_TARGET}-summary.json 2>/dev/null || \
              echo "{\"target\":\"${MATRIX_TARGET}\",\"findings\":0}" > reports/${MATRIX_TARGET}-summary.json
          fi

          cp -r reports/* analysis-bundle/${MATRIX_TARGET}/
          cp -r ${MATRIX_TARGET}/codeql-queries analysis-bundle/${MATRIX_TARGET}/ 2>/dev/null || true
          cp ${MATRIX_TARGET}/codeql-config.yml analysis-bundle/${MATRIX_TARGET}/ 2>/dev/null || true

      - name: Upload Analysis Bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: codeql-analysis-${{ matrix.target }}-${{ github.run_id }}
          path: analysis-bundle/${{ matrix.target }}/
          retention-days: 90

      - name: Generate Summary
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          echo "## CodeQL Analysis: $(sanitize_line "${MATRIX_TARGET}")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** [OK] Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(sanitize_line "$(date -u)")" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** codeql-analysis-$(sanitize_line "${MATRIX_TARGET}")-$(sanitize_line "${{ github.run_id }}")" >> $GITHUB_STEP_SUMMARY

  codeql-python:
    name: CodeQL Security Analysis - mcp-server (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      BASH_ENV: /dev/null
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-env
        with:
          preset: 'codeql'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: python
          config-file: mcp-server/codeql-config.yml
          source-root: .

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: "/language:python/all"
          output: codeql-results-python

      - name: Generate Reports
        run: |
          set -euo pipefail
          mkdir -p reports analysis-bundle/mcp-server
          SARIF_FILE=$(find codeql-results-python -name "*.sarif" | sed -n '1,1p')
          if [ -z "$SARIF_FILE" ]; then
            FINDINGS=0
          else
            FINDINGS=$(jq '.runs[0].results | length' "$SARIF_FILE" 2>/dev/null || echo 0)
          fi
          echo "{\"target\":\"mcp-server\",\"language\":\"python\",\"findings\":$FINDINGS}" > reports/mcp-server-summary.json
          cp -r reports/* analysis-bundle/mcp-server/

      - name: Upload Analysis Bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        with:
          name: codeql-analysis-mcp-server-${{ github.run_id }}
          path: analysis-bundle/mcp-server/
          retention-days: 90

  devcontainer-lint:
    name: DevContainer Shell Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      BASH_ENV: /dev/null
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: ShellCheck devcontainer scripts
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          echo "## DevContainer Shell Linting" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SCRIPTS=$(find .devcontainer -name '*.sh' -type f | sort)
          FAIL=0
          for script in $SCRIPTS; do
            if shellcheck -s bash "$script" 2>&1; then
              echo "- [OK] $(sanitize_line "$script")" >> $GITHUB_STEP_SUMMARY
            else
              echo "- [FAIL] $(sanitize_line "$script")" >> $GITHUB_STEP_SUMMARY
              FAIL=1
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" -ne 0 ]; then
            echo "**Status:** [FAIL] ShellCheck found issues" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "**Status:** [OK] All scripts pass ShellCheck" >> $GITHUB_STEP_SUMMARY

      - name: ShellCheck test scripts
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          echo "## Test Script Shell Linting" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SCRIPTS=$(find .github/scripts -name 'test-icc*.sh' -o -name 'iccdev-test-common.sh' | sort)
          FAIL=0
          for script in $SCRIPTS; do
            if shellcheck -s bash --severity=warning "$script" 2>&1; then
              echo "- [OK] $(sanitize_line "$(basename "$script")")" >> $GITHUB_STEP_SUMMARY
            else
              echo "- [FAIL] $(sanitize_line "$(basename "$script")")" >> $GITHUB_STEP_SUMMARY
              FAIL=1
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" -ne 0 ]; then
            echo "**Status:** [FAIL] ShellCheck found issues in test scripts" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "**Status:** [OK] All test scripts pass ShellCheck" >> $GITHUB_STEP_SUMMARY

      - name: Validate devcontainer.json files
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          CONFIGS=$(find .devcontainer -name 'devcontainer.json' -type f | sort)
          for config in $CONFIGS; do
            if python3 -c "import json; json.load(open('$config'))"; then
              echo "[OK] Valid JSON: $config"
            else
              echo "[FAIL] Invalid JSON: $config"
              exit 1
            fi
          done

  summary-report:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [codeql-analysis, codeql-python, devcontainer-lint]
    if: always()
    permissions:
      contents: read

    env:
      BASH_ENV: /dev/null
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Generate Overall Summary
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          echo "# CodeQL Security Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** $(sanitize_line "${{ github.run_id }}")" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(sanitize_line "$(date -u)")" >> $GITHUB_STEP_SUMMARY
          echo "**Targets:** iccanalyzer-lite, icctest, colorbleed_tools, mcp-server, devcontainer" >> $GITHUB_STEP_SUMMARY
          echo "**Total Queries:** 51 C++ (17 per target) + 6 custom Python + security-and-quality" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Repository Security Posture" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-pinned actions:** 83/83 (100%)" >> $GITHUB_STEP_SUMMARY
          echo "- **persist-credentials: false:** 27/27 checkouts (100%)" >> $GITHUB_STEP_SUMMARY
          echo "- **Shell injection (workflow_dispatch):** 0 remaining" >> $GITHUB_STEP_SUMMARY
          echo "- **scan-build findings:** 0" >> $GITHUB_STEP_SUMMARY
