###############################################################
# Copyright (c) 2026 David H Hoyt LLC
#
# Intent: Manual-trigger CLI test suite that publishes results
#         as a GitHub Release with test artifacts attached.
#
# Based on: iccanalyzer-cli-test-suite.yml
#
# Usage: Actions -> iccAnalyzer CLI Test Suite -> Release ->
#        Run workflow (manual dispatch)
#
###############################################################

name: "iccAnalyzer CLI Test Suite -> Release"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      test_profile_count:
        description: 'Number of test profiles to use (max 50)'
        required: false
        default: '25'
        type: string
      include_malformed:
        description: 'Include potentially malformed profiles'
        required: false
        default: true
        type: boolean
      release_tag_prefix:
        description: 'Release tag prefix (auto-appended with date+run)'
        required: false
        default: 'iccanalyzer-lite-v3.7.1'
        type: string

concurrency:
  group: iccanalyzer-cli-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_PROFILE_COUNT: ${{ github.event.inputs.test_profile_count || '25' }}
  INCLUDE_MALFORMED: ${{ github.event.inputs.include_malformed || 'true' }}
  TOTAL_MODES: 5

jobs:
  build-test-release:
    name: "Build, Test & Release"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 (node24)
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-env
        with:
          extra-packages: 'lld lcov'

      - name: Cache iccDEV repository
        id: cache-iccdev
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        with:
          path: iccanalyzer-lite/iccDEV
          key: ${{ runner.os }}-iccdev-lite-upstream-v1

      - name: Clone iccDEV dependency
        if: steps.cache-iccdev.outputs.cache-hit != 'true'
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite
          if [ ! -d "iccDEV" ]; then
            git clone https://github.com/InternationalColorConsortium/iccDEV.git
          fi
          cd iccDEV

          echo "iccDEV cloned at: $(pwd)"
          echo "iccDEV commit: $(git log --oneline -1)"

      - name: Clean iccDEV dependency
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite/iccDEV
          git reset --hard HEAD
          git clean -fdx
          if [ -n "$(git diff --name-only)" ]; then
            echo "[FAIL] iccDEV dependency still has tracked modifications"
            git diff --name-only | sed 's/^/  /'
            exit 1
          fi
          echo "[OK] iccDEV dependency is clean"

      - name: Cache iccDEV build artifacts
        id: cache-iccdev-build
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5.0.0 (node24)
        with:
          path: |
            iccanalyzer-lite/iccDEV/Build/IccProfLib
            iccanalyzer-lite/iccDEV/Build/IccXML
          key: ${{ runner.os }}-iccdev-build-lite-reldbg-upstream-v2-${{ hashFiles('.github/workflows/iccanalyzer-cli-release.yml') }}

      - name: Build iccDEV libraries with full instrumentation
        if: steps.cache-iccdev-build.outputs.cache-hit != 'true'
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite/iccDEV/Build

          echo "Configuring CMake with full instrumentation..."
          rm -f CMakeCache.txt && rm -rf CMakeFiles
          cmake Cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fsanitize=integer -fsanitize-recover=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls -fprofile-instr-generate -fcoverage-mapping -O0 -g3" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fsanitize=integer -fsanitize-recover=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls -fprofile-instr-generate -fcoverage-mapping -O0 -g3 -std=c++17" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fprofile-instr-generate" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fprofile-instr-generate" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DENABLE_TOOLS=OFF \
            -DENABLE_WXWIDGETS=OFF \
            -DICC_LOG_SAFE=ON \
            -DICC_TRACE_NAN_ENABLED=ON \
            -Wno-dev

          echo "Building libraries with $(nproc) cores..."
          make -j$(nproc)

          echo "Verifying instrumented libraries..."
          ls -lh IccProfLib/libIccProfLib2-static*.a
          ls -lh IccXML/libIccXML2-static*.a

      - name: Build iccanalyzer-lite
        working-directory: iccanalyzer-lite
        run: |
          set -euo pipefail
          bash build.sh

      - name: Verify binary
        working-directory: iccanalyzer-lite
        run: |
          set -euo pipefail
          ls -lh iccanalyzer-lite
          file iccanalyzer-lite
          ./iccanalyzer-lite --version

      - name: Build icctest V2
        env:
          BASH_ENV: /dev/null
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          git config --add safe.directory "$PWD"
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

          cd iccanalyzer-lite/icctest
          chmod +x build.sh
          bash build.sh

          echo "[OK] icctest V2 build complete"
          ls -lh build/cli/icctest build/tools/icctest-parity build/lib/libIccTest.a

      - name: Run icctest V2 unit tests
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          LLVM_PROFILE_FILE: "/dev/null"
        run: |
          set -euo pipefail
          iccanalyzer-lite/icctest/build/lib/tests/icctest_unit_tests

      - name: Run icctest V2 parity verification
        run: |
          set -euo pipefail
          cd iccanalyzer-lite/icctest
          cmake --build build --target icctest-verify-parity

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(Path("build/parity-artifacts/verify-parity-summary.json").read_text())
          summary = payload["summary"]
          raw_counts = summary["rawParity"]["counts"]
          outer_counts = summary["imageParity"]["outerImage"]["counts"]
          embedded_counts = summary["imageParity"]["embeddedRaw"]["counts"]

          print("")
          print("### icctest V2 Parity Verification")
          print("")
          print(f"- Status: `{summary['status']}`")
          print(f"- Raw parity delta: `{raw_counts.get('delta', 0)}`")
          print(f"- Image outer delta: `{outer_counts.get('delta', 0)}`")
          print(f"- Embedded raw delta: `{embedded_counts.get('delta', 0)}`")
          print(f"- Unit tests: `{summary['unitTests'].get('summaryLine', '')}`")
          print("- Artifact: `iccanalyzer-lite/icctest/build/parity-artifacts`")
          PY

      - name: Setup test profiles
        id: setup
        run: |
          set -euo pipefail
          source .github/scripts/icc-profile-quarantine.sh
          mkdir -p cli-test-results/outputs

          PROFILE_COUNT=${{ env.TEST_PROFILE_COUNT }}
          PROFILE_COUNT=$((PROFILE_COUNT > 50 ? 50 : PROFILE_COUNT))

          find test-profiles/ -type f -name "*.icc" | sort > /tmp/cli-release-all.txt
          icc_profile_filter_quarantine /tmp/cli-release-all.txt /tmp/cli-release-routine.txt
          shuf -n ${PROFILE_COUNT} /tmp/cli-release-routine.txt > cli-test-results/selected-profiles.txt

          AVAILABLE=$(wc -l < cli-test-results/selected-profiles.txt | tr -d ' \n\r')
          echo "test_count=${AVAILABLE}" >> $GITHUB_OUTPUT

          echo "Selected ${AVAILABLE} profiles for CLI mode testing:"
          cat cli-test-results/selected-profiles.txt

      - name: Run all CLI mode tests
        id: tests
        run: |
          set -euo pipefail
          cd iccanalyzer-lite
          source ../.github/scripts/sanitize-sed.sh

          strip_ansi() {
            sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$1"
          }

          SUMMARY="../cli-test-results/test-summary.txt"
          echo "==================================================================" > $SUMMARY
          echo "iccAnalyzer-lite CLI Test Suite Report" >> $SUMMARY
          echo "==================================================================" >> $SUMMARY
          echo "" >> $SUMMARY
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $SUMMARY
          echo "Binary: $(./iccanalyzer-lite --version 2>&1 | sed -n '1,1p')" >> $SUMMARY
          echo "Build: RelWithDebInfo + ASAN + UBSAN + Coverage" >> $SUMMARY
          echo "Profiles: $(wc -l < ../cli-test-results/selected-profiles.txt)" >> $SUMMARY
          echo "" >> $SUMMARY

          MODES="heuristics:h roundtrip:r comprehensive:a ninja:n ninja-full:nf"

          GRAND_TOTAL=0
          GRAND_SUCCESS=0
          GRAND_FAILED=0

          for MODE_PAIR in $MODES; do
            MODE_NAME="${MODE_PAIR%%:*}"
            MODE_FLAG="-${MODE_PAIR##*:}"

            echo "==================================================================" >> $SUMMARY
            echo "Mode: ${MODE_NAME} (${MODE_FLAG})" >> $SUMMARY
            echo "==================================================================" >> $SUMMARY
            echo "" >> $SUMMARY

            mkdir -p "../cli-test-results/outputs/${MODE_NAME}"

            TOTAL=0
            CLEAN=0
            FINDINGS=0

            while IFS= read -r profile; do
              TOTAL=$((TOTAL + 1))
              PROFILE_NAME=$(basename "$profile")
              OUTPUT_FILE="../cli-test-results/outputs/${MODE_NAME}/${PROFILE_NAME}.txt"
              printf '%s\n' "$MODE_NAME $profile" > ../cli-test-results/current-profile.txt

              echo "[${MODE_NAME}] Testing: ${PROFILE_NAME}"
              echo "Profile: ${PROFILE_NAME}" >> $SUMMARY

              if timeout 30s ./iccanalyzer-lite ${MODE_FLAG} "../${profile}" > "$OUTPUT_FILE" 2>&1; then
                strip_ansi "$OUTPUT_FILE"
                if grep -qai "MISMATCH\|overlap\|extends beyond\|truncat\|\[WARN\].*HEURISTIC\|Suspicious\|UAF RISK\|INVALID\|CORRUPT\|AddressSanitizer\|UndefinedBehaviorSanitizer" "$OUTPUT_FILE" 2>/dev/null; then
                  echo "  Result: FINDING (content)" >> $SUMMARY
                  FINDINGS=$((FINDINGS + 1))
                  echo "  FINDING (content)"
                else
                  echo "  Result: CLEAN" >> $SUMMARY
                  CLEAN=$((CLEAN + 1))
                  echo "  CLEAN"
                fi
              else
                EXIT_CODE=$?
                strip_ansi "$OUTPUT_FILE"
                echo "  Result: FINDING (exit code: $EXIT_CODE)" >> $SUMMARY
                FINDINGS=$((FINDINGS + 1))
                echo "  FINDING (exit $EXIT_CODE)"
                echo "  Detection output:" >> $SUMMARY
                tail -5 "$OUTPUT_FILE" >> $SUMMARY 2>/dev/null || true
              fi

              FILE_SIZE=$(stat -c%s "$OUTPUT_FILE" 2>/dev/null || echo 0)
              echo "  Output size: $FILE_SIZE bytes" >> $SUMMARY
              echo "" >> $SUMMARY

            done < ../cli-test-results/selected-profiles.txt

            echo "---" >> $SUMMARY
            echo "${MODE_NAME} totals: ${CLEAN}/${TOTAL} clean, ${FINDINGS} findings" >> $SUMMARY
            echo "" >> $SUMMARY

            GRAND_TOTAL=$((GRAND_TOTAL + TOTAL))
            GRAND_SUCCESS=$((GRAND_SUCCESS + CLEAN))
            GRAND_FAILED=$((GRAND_FAILED + FINDINGS))

            echo "${MODE_NAME}_total=$TOTAL" >> $GITHUB_ENV
            echo "${MODE_NAME}_success=$CLEAN" >> $GITHUB_ENV
            echo "${MODE_NAME}_failed=$FINDINGS" >> $GITHUB_ENV
          done

          echo "==================================================================" >> $SUMMARY
          echo "FINAL RESULTS" >> $SUMMARY
          echo "==================================================================" >> $SUMMARY
          echo "Grand total: ${GRAND_SUCCESS}/${GRAND_TOTAL} clean, ${GRAND_FAILED} findings" >> $SUMMARY
          RATE=$(awk "BEGIN {printf \"%.1f\", ($GRAND_SUCCESS/$GRAND_TOTAL)*100}")
          echo "Clean rate: ${RATE}%" >> $SUMMARY
          echo "==================================================================" >> $SUMMARY

          echo "grand_total=$GRAND_TOTAL" >> $GITHUB_ENV
          echo "grand_success=$GRAND_SUCCESS" >> $GITHUB_ENV
          echo "grand_failed=$GRAND_FAILED" >> $GITHUB_ENV
          echo "clean_rate=$RATE" >> $GITHUB_ENV

          cat $SUMMARY

      - name: Collect coverage data
        if: always()
        run: |
          set -euo pipefail
          mkdir -p cli-test-results/coverage

          if command -v gcov >/dev/null 2>&1; then
            find iccanalyzer-lite -name "*.gcda" -exec gcov {} \; 2>/dev/null | tail -5 || true
            find . -name "*.gcov" -exec cp {} cli-test-results/coverage/ \; 2>/dev/null || true
            COVERAGE_FILES=$(find cli-test-results/coverage -name "*.gcov" 2>/dev/null | wc -l)
            echo "Coverage files collected: ${COVERAGE_FILES}"
          else
            echo "gcov not available"
          fi

      - name: Generate results index
        if: always()
        run: |
          set -euo pipefail
          cd cli-test-results

          INDEX_FILE="index.html"

          cat > $INDEX_FILE << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'unsafe-inline'">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>iccAnalyzer-lite CLI Test Suite Results</title>
            <style>
              body { font-family: monospace; margin: 20px; background: #f5f5f5; }
              .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; }
              h1 { color: #333; border-bottom: 2px solid #007acc; padding-bottom: 10px; }
              h2 { color: #555; }
              .summary { background: #e8f4f8; padding: 15px; margin: 20px 0; border-left: 4px solid #007acc; }
              .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
              .stat-box { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; text-align: center; }
              .stat-value { font-size: 2em; font-weight: bold; color: #007acc; }
              .stat-label { color: #666; margin-top: 5px; }
              table { width: 100%; border-collapse: collapse; margin: 20px 0; }
              th, td { padding: 10px; text-align: left; border: 1px solid #ddd; }
              th { background: #007acc; color: white; }
              tr:nth-child(even) { background: #f9f9f9; }
              .clean { color: green; font-weight: bold; }
              .finding { color: #cc6600; font-weight: bold; }
              .error { color: red; font-weight: bold; }
              a.profile-link { color: #007acc; text-decoration: none; }
              a.profile-link:hover { text-decoration: underline; }
              a { color: #007acc; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>iccAnalyzer-lite CLI Test Suite -- Release Report</h1>
          EOF

          echo "<div class='summary'>" >> $INDEX_FILE
          echo "<strong>Test Date:</strong> $(date -u '+%Y-%m-%d %H:%M:%S UTC')<br>" >> $INDEX_FILE
          echo "<strong>Binary:</strong> iccanalyzer-lite (ASAN + UBSAN + Coverage)<br>" >> $INDEX_FILE
          echo "<strong>Modes:</strong> -h (heuristics), -r (roundtrip), -a (comprehensive), -n (ninja), -nf (ninja-full)" >> $INDEX_FILE
          echo "</div>" >> $INDEX_FILE

          echo "<div class='stats'>" >> $INDEX_FILE
          echo "<div class='stat-box'><div class='stat-value'>${grand_total:-0}</div><div class='stat-label'>Total Tests</div></div>" >> $INDEX_FILE
          echo "<div class='stat-box'><div class='stat-value' style='color: green;'>${grand_success:-0}</div><div class='stat-label'>Clean</div></div>" >> $INDEX_FILE
          echo "<div class='stat-box'><div class='stat-value' style='color: #cc6600;'>${grand_failed:-0}</div><div class='stat-label'>Findings</div></div>" >> $INDEX_FILE
          echo "</div>" >> $INDEX_FILE

          html_esc() { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g; s/'"'"'/\&#39;/g'; }

          for MODE_NAME in heuristics roundtrip comprehensive ninja ninja-full; do
            if [ -d "outputs/${MODE_NAME}" ]; then
              case "${MODE_NAME}" in
                heuristics)    FLAG="-h" ;;
                roundtrip)     FLAG="-r" ;;
                comprehensive) FLAG="-a" ;;
                ninja)         FLAG="-n" ;;
                ninja-full)    FLAG="-nf" ;;
              esac

              echo "<h2>${MODE_NAME} Mode (${FLAG})</h2>" >> $INDEX_FILE
              echo "<table>" >> $INDEX_FILE
              echo "<tr><th>#</th><th>Profile</th><th>Status</th><th>Output</th><th>Size</th></tr>" >> $INDEX_FILE

              NUM=1
              while IFS= read -r profile; do
                PROFILE_NAME=$(basename "$profile")
                OUTPUT_FILE="outputs/${MODE_NAME}/${PROFILE_NAME}.txt"

                if [ -f "$OUTPUT_FILE" ]; then
                  FILE_SIZE=$(stat -c%s "$OUTPUT_FILE" 2>/dev/null || echo 0)

                  if [ "$FILE_SIZE" -le 1 ]; then
                    STATUS="<span class='error'>ERROR</span>"
                  elif grep -qi "AddressSanitizer\|LeakSanitizer\|UndefinedBehaviorSanitizer\|UBSan\|SUMMARY:.*Sanitizer" "$OUTPUT_FILE" 2>/dev/null; then
                    STATUS="<span class='finding'>FINDING</span>"
                  elif grep -qi "\[ERR\]\|\[WARN\].*HEURISTIC\|Error reading ICC profile\|failed validation\|crash\|SEGV\|ABRT\|stack-smash\|heap-buffer\|memcpy-param-overlap\|double-free\|use-after-free\|MISMATCH\|overlap\|Suspicious\|UAF RISK\|INVALID\|CORRUPT" "$OUTPUT_FILE" 2>/dev/null; then
                    STATUS="<span class='finding'>FINDING</span>"
                  else
                    STATUS="<span class='clean'>CLEAN</span>"
                  fi

                  echo "<tr><td>$NUM</td><td><a href='outputs/${MODE_NAME}/$(html_esc "$PROFILE_NAME").txt'><code>$(html_esc "$PROFILE_NAME")</code></a></td><td>$STATUS</td><td><a class='profile-link' href='$(html_esc "$OUTPUT_FILE")'>View Output</a></td><td>$FILE_SIZE bytes</td></tr>" >> $INDEX_FILE
                  NUM=$((NUM + 1))
                fi
              done < selected-profiles.txt

              echo "</table>" >> $INDEX_FILE
            fi
          done

          echo "</div></body></html>" >> $INDEX_FILE
          echo "Results index created: $INDEX_FILE"

      - name: Package release assets
        id: package
        env:
          INPUT_TAG_PREFIX: ${{ github.event.inputs.release_tag_prefix || 'iccanalyzer-lite-v3.7.1' }}
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh

          TAG_PREFIX="$(sanitize_ref "$INPUT_TAG_PREFIX")"
          DATESTAMP="$(date -u '+%Y%m%d-%H%M%S')"
          RELEASE_TAG="${TAG_PREFIX}-${DATESTAMP}-run${{ github.run_number }}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          TARBALL="iccanalyzer-cli-test-results-${DATESTAMP}.tar.gz"
          tar -czf "${TARBALL}" cli-test-results/
          echo "tarball=${TARBALL}" >> $GITHUB_OUTPUT

          cp cli-test-results/test-summary.txt "test-summary-${DATESTAMP}.txt"
          echo "summary_file=test-summary-${DATESTAMP}.txt" >> $GITHUB_OUTPUT

          # Copy instrumented binaries and generate checksums for release upload
          cp iccanalyzer-lite/iccanalyzer-lite iccanalyzer-lite-linux-amd64-instrumented
          chmod +x iccanalyzer-lite-linux-amd64-instrumented
          mkdir -p icctest-linux-amd64-instrumented
          cp iccanalyzer-lite/icctest/build/cli/icctest icctest-linux-amd64-instrumented/icctest
          cp iccanalyzer-lite/icctest/build/tools/icctest-parity icctest-linux-amd64-instrumented/icctest-parity
          cp iccanalyzer-lite/icctest/build/parity-artifacts/verify-parity-summary.json icctest-linux-amd64-instrumented/verify-parity-summary.json
          cp iccanalyzer-lite/icctest/README.md icctest-linux-amd64-instrumented/README.md
          cp iccanalyzer-lite/icctest/tools/heuristic-remap.tsv icctest-linux-amd64-instrumented/heuristic-remap.tsv
          cat > icctest-linux-amd64-instrumented/RUNTIME.txt <<'EOF'
          IccTest Linux amd64 instrumented bundle

          Files:
          - icctest: V2 command-line analyzer
          - icctest-parity: parity helper binary
          - verify-parity-summary.json: latest parity verification summary
          - README.md: usage notes
          - heuristic-remap.tsv: V1/V2 heuristic ID remap for parity tooling

          Runtime notes:
          - Built in Debug mode with ASAN + UBSAN + Clang coverage instrumentation
          - Requires common Linux runtime libraries from Ubuntu 24.04 class systems
          - Recommended environment:
              ASAN_OPTIONS=detect_leaks=0
              LLVM_PROFILE_FILE=/dev/null
          - Primary CLI usage:
              ./icctest --version
              ./icctest --registry
              ./icctest -a profile.icc
              ./icctest --pawg profile.icc
          EOF
          chmod +x icctest-linux-amd64-instrumented/icctest icctest-linux-amd64-instrumented/icctest-parity

          sha256sum iccanalyzer-lite-linux-amd64-instrumented > SHA256SUMS.txt
          sha256sum icctest-linux-amd64-instrumented/icctest >> SHA256SUMS.txt
          sha256sum icctest-linux-amd64-instrumented/icctest-parity >> SHA256SUMS.txt

          # Wrap binaries in tar.gz to preserve execute permissions
          tar -czf iccanalyzer-lite-linux-amd64-instrumented.tar.gz iccanalyzer-lite-linux-amd64-instrumented
          tar -czf icctest-linux-amd64-instrumented.tar.gz icctest-linux-amd64-instrumented

          ls -lh "${TARBALL}" "test-summary-${DATESTAMP}.txt" iccanalyzer-lite-linux-amd64-instrumented.tar.gz icctest-linux-amd64-instrumented.tar.gz SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          name: "iccAnalyzer-lite v3.7.1 | Security Research Tools for Color Profiles"
          body: |
            ## iccAnalyzer-lite CLI Test Suite Results

            | Metric | Value |
            |--------|-------|
            | **Total Tests** | ${{ env.grand_total }} |
            | **Clean** | ${{ env.grand_success }} |
            | **Findings** | ${{ env.grand_failed }} |
            | **Clean Rate** | ${{ env.clean_rate }}% |

            ### Per-Mode Breakdown
            | Mode | Flag | Clean | Findings | Total |
            |------|------|-------|----------|-------|
            | Heuristics | `-h` | ${{ env.heuristics_success }} | ${{ env.heuristics_failed }} | ${{ env.heuristics_total }} |
            | Round-trip | `-r` | ${{ env.roundtrip_success }} | ${{ env.roundtrip_failed }} | ${{ env.roundtrip_total }} |
            | Comprehensive | `-a` | ${{ env.comprehensive_success }} | ${{ env.comprehensive_failed }} | ${{ env.comprehensive_total }} |
            | Ninja | `-n` | ${{ env.ninja_success }} | ${{ env.ninja_failed }} | ${{ env.ninja_total }} |
            | Ninja-full | `-nf` | ${{ env.ninja-full_success }} | ${{ env.ninja-full_failed }} | ${{ env.ninja-full_total }} |

            ### Build Configuration
            - **Compiler:** clang++
            - **Build Type:** Debug
            - **Sanitizers:** ASAN + UBSAN
            - **Coverage:** Enabled
            - **Linker libs:** `-lxml2 -ltiff -lpng -ljpeg -lz -llzma -lm -lssl -lcrypto`
            - **Release assets:** `iccanalyzer-lite-linux-amd64-instrumented.tar.gz`, `icctest-linux-amd64-instrumented.tar.gz`
            - **IccTest V2:** unit tests + parity verification passed
            - **Triggered by:** @${{ github.actor }}
            - **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.summary_file }}
            iccanalyzer-lite-linux-amd64-instrumented.tar.gz
            icctest-linux-amd64-instrumented.tar.gz
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0 (node24)
        if: always()
        with:
          name: iccanalyzer-cli-release-results
          path: |
            cli-test-results/
            iccanalyzer-lite-linux-amd64-instrumented
            iccanalyzer-lite-linux-amd64-instrumented.tar.gz
            icctest-linux-amd64-instrumented/
            icctest-linux-amd64-instrumented.tar.gz
            iccanalyzer-lite/icctest/build/parity-artifacts/
            SHA256SUMS.txt
          retention-days: 90

      - name: Report to summary
        if: always()
        run: |
          set -euo pipefail
          source .github/scripts/sanitize-sed.sh 2>/dev/null || true
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY_EOF'
          ## iccAnalyzer-lite CLI Test Suite -> Release

          ### Results Summary
          | Metric | Value |
          |--------|-------|
          | Total Tests | ${{ env.grand_total }} |
          | Clean | ${{ env.grand_success }} |
          | Findings | ${{ env.grand_failed }} |
          | Clean Rate | ${{ env.clean_rate }}% |

          ### Per-Mode Breakdown
          | Mode | Flag | Clean | Findings | Total |
          |------|------|-------|----------|-------|
          | Heuristics | `-h` | ${{ env.heuristics_success }} | ${{ env.heuristics_failed }} | ${{ env.heuristics_total }} |
          | Round-trip | `-r` | ${{ env.roundtrip_success }} | ${{ env.roundtrip_failed }} | ${{ env.roundtrip_total }} |
          | Comprehensive | `-a` | ${{ env.comprehensive_success }} | ${{ env.comprehensive_failed }} | ${{ env.comprehensive_total }} |
          | Ninja | `-n` | ${{ env.ninja_success }} | ${{ env.ninja_failed }} | ${{ env.ninja_total }} |
          | Ninja-full | `-nf` | ${{ env.ninja-full_success }} | ${{ env.ninja-full_failed }} | ${{ env.ninja-full_total }} |

          SUMMARY_EOF

          RELEASE_TAG="${{ steps.package.outputs.release_tag }}"
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$(sanitize_line "${RELEASE_TAG}")\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/$(sanitize_line "${RELEASE_TAG}")" >> $GITHUB_STEP_SUMMARY

          if [ "${grand_failed:-0}" -eq 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### [OK] ALL CLEAN -- No sanitizer findings detected across all modes" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### [WARN] $(sanitize_line "${grand_failed:-0}") FINDING(S) -- Sanitizer detections captured" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Final status
        run: |
          set -euo pipefail
          echo "============================================"
          echo "  CLI Test Suite -> Release COMPLETE"
          echo "============================================"
          echo "Tag:      ${{ steps.package.outputs.release_tag }}"
          echo "Total:    ${grand_total:-0} tests"
          echo "Clean:    ${grand_success:-0}"
          echo "Findings: ${grand_failed:-0}"
          echo "Rate:     ${clean_rate:-0}%"
          echo "============================================"

          if [ "${grand_failed:-0}" -eq 0 ]; then
            echo "STATUS: ALL CLEAN"
          else
            echo "STATUS: ${grand_failed:-0} finding(s) -- sanitizer detections, not infrastructure failures"
          fi
          exit 0
