<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA -- User Agent Image &amp; ICC Profile Fuzzer Harness V2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; font-size: 13px; }
        #header { background: #161b22; border-bottom: 1px solid #30363d; padding: 8px 16px; display: flex; align-items: center; gap: 10px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 44px; flex-wrap: nowrap; overflow-x: auto; }
        #header h1 { font-size: 14px; color: #58a6ff; white-space: nowrap; }
        .btn { background: #238636; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; white-space: nowrap; }
        .btn:hover { background: #2ea043; }
        .btn.stop { background: #da3633; }
        .btn.info { background: #1f6feb; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        input[type=number], select { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; padding: 2px 6px; border-radius: 4px; font-family: inherit; font-size: 12px; width: 70px; }
        label { font-size: 11px; color: #8b949e; white-space: nowrap; }
        #stats { display: flex; gap: 12px; margin-left: auto; font-size: 12px; color: #8b949e; white-space: nowrap; }
        #stats b { color: #58a6ff; }
        #stats .err b { color: #f85149; }
        #stats .icc b { color: #bc8cff; }
        #progress { height: 3px; background: #21262d; position: fixed; top: 44px; left: 0; right: 0; z-index: 99; }
        #progress-fill { height: 100%; background: #238636; width: 0%; transition: width 0.3s; }
        #main { margin-top: 52px; display: flex; height: calc(100vh - 52px); }
        #render { flex: 1; background: #010409; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #render img, #render canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        #icc-info { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.92); border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #bc8cff; max-width: 500px; max-height: 280px; overflow-y: auto; display: none; z-index: 10; }
        #file-bar { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(22,27,34,0.92); padding: 4px 12px; font-size: 11px; color: #8b949e; }
        #sidebar { width: 420px; display: flex; flex-direction: column; border-left: 1px solid #30363d; }
        #log-hdr { background: #161b22; padding: 5px 10px; border-bottom: 1px solid #30363d; font-size: 12px; color: #8b949e; display: flex; justify-content: space-between; align-items: center; }
        #log { flex: 1; overflow-y: auto; padding: 4px 8px; font-size: 11px; line-height: 1.5; background: #0d1117; }
        .l { padding: 1px 0; border-bottom: 1px solid #21262d; }
        .l-ok { color: #3fb950; }
        .l-w { color: #d29922; }
        .l-e { color: #f85149; }
        .l-i { color: #8b949e; }
        .l-c { color: #f85149; font-weight: bold; background: #1c0c0c; }
        .l-p { color: #bc8cff; }
        .l-cwe { color: #f0883e; }
        #findings { width: 380px; display: flex; flex-direction: column; border-left: 1px solid #30363d; background: #0d1117; }
        #find-hdr { background: #161b22; padding: 5px 10px; border-bottom: 1px solid #30363d; font-size: 12px; color: #d29922; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        #find-list { flex: 1; overflow-y: auto; padding: 4px 8px; font-size: 11px; }
        .f { padding: 3px 0; border-bottom: 1px solid #21262d; }
        .f .fp { color: #58a6ff; word-break: break-all; }
        .f .fd { color: #f85149; }
        .f .fc { color: #f0883e; font-size: 10px; }
        .f .fs { font-size: 10px; padding: 1px 4px; border-radius: 2px; display: inline-block; margin-top: 2px; }
        .fs-crit { background: #da3633; color: #fff; }
        .fs-high { background: #f0883e; color: #000; }
        .fs-med { background: #d29922; color: #000; }
        .fs-low { background: #388bfd; color: #fff; }
        .fs-info { background: #30363d; color: #8b949e; }
        #summary-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; }
        #summary-modal.active { display: flex; }
        #summary-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
        #summary-box h2 { color: #58a6ff; margin-bottom: 12px; }
        #summary-box table { width: 100%; border-collapse: collapse; margin: 8px 0; }
        #summary-box th, #summary-box td { padding: 4px 8px; border: 1px solid #30363d; text-align: left; font-size: 12px; }
        #summary-box th { background: #21262d; color: #8b949e; }
        .elapsed { color: #8b949e; font-size: 11px; }
    </style>
</head>
<body>

<div id="header">
    <h1>UA Fuzzer V2</h1>
    <button class="btn" id="btn-start">Start</button>
    <button class="btn stop" id="btn-stop" disabled>Stop</button>
    <button class="btn" id="btn-shuffle">Shuffle</button>
    <button class="btn info" id="btn-summary">Summary</button>
    <label>Type:</label>
    <select id="filt">
        <option value="all">All</option>
        <option value="image">Images</option>
        <option value="icc">ICC</option>
        <option value="xml">XML</option>
        <option value=".png">PNG</option>
        <option value=".jpg">JPEG</option>
        <option value=".tif">TIFF</option>
        <option value=".gif">GIF</option>
        <option value=".bmp">BMP</option>
        <option value=".svg">SVG</option>
        <option value=".heic">HEIC</option>
        <option value=".exr">EXR</option>
        <option value=".webp">WebP</option>
    </select>
    <label>Delay:</label>
    <input type="number" id="delay" value="20" min="0" max="5000" step="10">
    <label>Batch:</label>
    <input type="number" id="batch" value="8" min="1" max="64" step="1">
    <label>Workers:</label>
    <input type="number" id="workers" value="4" min="0" max="32" step="1">
    <div id="stats">
        <div>Done: <b id="s-done">0</b></div>
        <div class="err">Err: <b id="s-err">0</b></div>
        <div class="icc">ICC: <b id="s-icc">0</b></div>
        <div>CWE: <b id="s-cwe" style="color:#f0883e">0</b></div>
        <div>Crash: <b id="s-crash" style="color:#f85149">0</b></div>
        <div>Rate: <b id="s-rate">0</b>/s</div>
        <div class="elapsed"><b id="s-elapsed">0:00</b></div>
        <div><b id="s-idx">0</b>/<b id="s-tot">0</b></div>
    </div>
</div>
<div id="progress"><div id="progress-fill"></div></div>

<div id="main">
    <div id="render">
        <div id="icc-info"></div>
        <div id="file-bar">Ready -- click Start</div>
    </div>
    <div id="sidebar">
        <div id="log-hdr"><span>Event Log</span><button class="btn" id="btn-clear" style="font-size:10px;padding:2px 8px">Clear</button></div>
        <div id="log"></div>
    </div>
    <div id="findings">
        <div id="find-hdr">
            <span>Findings: <b id="f-cnt">0</b></span>
            <span>
                <button class="btn info" id="btn-export" style="font-size:10px;padding:2px 8px">JSON</button>
                <button class="btn" id="btn-csv" style="font-size:10px;padding:2px 8px;background:#1f6feb">CSV</button>
            </span>
        </div>
        <div id="find-list"></div>
    </div>
</div>

<div id="summary-modal">
    <div id="summary-box">
        <h2>Fuzzing Summary</h2>
        <div id="summary-content"></div>
        <br>
        <button class="btn" onclick="document.getElementById('summary-modal').classList.remove('active')">Close</button>
    </div>
</div>

<script>
"use strict";

// -- State ----------------------------------------------------------
let manifest = null, filtered = [], idx = 0, running = false, timer = null;
let S = { done: 0, err: 0, icc: 0, crash: 0, cwe: 0, t0: 0 };
let findings = [], logN = 0;
let perFormat = {};   // ext -> {done,err,findings}
let perSeverity = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, INFO: 0 };
const MAX_LOG = 5000;

// -- CWE Mapping for ICC Heuristic Findings -------------------------
const CWE_MAP = {
    'Size mismatch':       { cwe: 'CWE-131', sev: 'HIGH',   desc: 'Incorrect buffer size' },
    'Bad magic':           { cwe: 'CWE-345', sev: 'CRITICAL', desc: 'Invalid ICC magic' },
    'PCS != D50':          { cwe: 'CWE-682', sev: 'MEDIUM', desc: 'Incorrect PCS illuminant' },
    'non-zero reserved':   { cwe: 'CWE-20',  sev: 'LOW',    desc: 'Non-zero reserved bytes' },
    'Suspicious tag count':{ cwe: 'CWE-789', sev: 'HIGH',   desc: 'Uncontrolled tag alloc' },
    'Tag.*overflows':      { cwe: 'CWE-122', sev: 'CRITICAL', desc: 'Heap buffer overflow' },
    'Truncated':           { cwe: 'CWE-125', sev: 'HIGH',   desc: 'Out-of-bounds read' },
    'PARSE CRASH':         { cwe: 'CWE-119', sev: 'CRITICAL', desc: 'Buffer error in parser' },
    'Duplicate tag':       { cwe: 'CWE-694', sev: 'MEDIUM', desc: 'Duplicate tag signature' },
    'Tag overlap':         { cwe: 'CWE-119', sev: 'CRITICAL', desc: 'Overlapping tag data' },
    'Bad version':         { cwe: 'CWE-20',  sev: 'MEDIUM', desc: 'Invalid version BCD' },
    'Intent > 3':          { cwe: 'CWE-20',  sev: 'MEDIUM', desc: 'Invalid rendering intent' },
    'Profile ID.*non-zero':{ cwe: 'CWE-345', sev: 'LOW',    desc: 'Non-zero profile ID' },
    'Flat/degenerate':     { cwe: 'CWE-20',  sev: 'INFO',   desc: 'Degenerate pixel data' },
    'Fully transparent':   { cwe: 'CWE-20',  sev: 'INFO',   desc: 'All-transparent pixels' },
    'Extreme':             { cwe: 'CWE-400', sev: 'HIGH',   desc: 'Extreme dimensions' },
    'Zero-dimension':      { cwe: 'CWE-20',  sev: 'HIGH',   desc: 'Zero-dim image loaded' },
    'Load timeout':        { cwe: 'CWE-400', sev: 'HIGH',   desc: 'Resource exhaustion' },
    'Canvas':              { cwe: 'CWE-787', sev: 'CRITICAL', desc: 'Canvas decode crash' },
    'ICC AS IMAGE':        { cwe: 'CWE-843', sev: 'CRITICAL', desc: 'Type confusion' },
    'WORKER CRASH':        { cwe: 'CWE-119', sev: 'CRITICAL', desc: 'Worker crash' },
    'Image load error':    { cwe: 'CWE-20',  sev: 'LOW',    desc: 'Decoder rejected input' },
    'Fetch error':         { cwe: 'CWE-20',  sev: 'LOW',    desc: 'Network/fetch error' },
};

function classifyFinding(detail) {
    for (const [pat, info] of Object.entries(CWE_MAP)) {
        if (new RegExp(pat, 'i').test(detail)) return info;
    }
    return { cwe: null, sev: 'INFO', desc: '' };
}

// -- DOM ------------------------------------------------------------
const $ = id => document.getElementById(id);
const $log = $('log'), $fl = $('find-list'), $render = $('render'), $icc = $('icc-info'), $fb = $('file-bar'), $pf = $('progress-fill');

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function log(cls, msg) {
    const d = document.createElement('div');
    d.className = 'l l-' + cls;
    d.textContent = '[' + new Date().toISOString().substr(11,12) + '] ' + msg;
    $log.appendChild(d);
    if (++logN > MAX_LOG) { $log.removeChild($log.firstChild); logN--; }
    $log.scrollTop = $log.scrollHeight;
}

function finding(path, detail) {
    const info = classifyFinding(detail);
    if (info.cwe) S.cwe++;
    perSeverity[info.sev] = (perSeverity[info.sev] || 0) + 1;
    findings.push({ path, detail, ts: Date.now(), cwe: info.cwe, severity: info.sev, desc: info.desc });
    $('f-cnt').textContent = findings.length;
    $('s-cwe').textContent = S.cwe;

    const ext = path.split('.').pop().toLowerCase();
    if (!perFormat[ext]) perFormat[ext] = { done: 0, err: 0, findings: 0 };
    perFormat[ext].findings++;

    const d = document.createElement('div');
    d.className = 'f';
    let sevHtml = '';
    if (info.sev !== 'INFO') {
        const sevCls = { CRITICAL: 'crit', HIGH: 'high', MEDIUM: 'med', LOW: 'low' }[info.sev] || 'info';
        sevHtml = '<span class="fs fs-' + sevCls + '">' + info.sev + '</span> ';
    }
    const cweHtml = info.cwe ? '<div class="fc">' + info.cwe + ': ' + esc(info.desc) + '</div>' : '';
    d.innerHTML = '<div class="fp">' + esc(path) + '</div><div class="fd">' + sevHtml + esc(detail) + '</div>' + cweHtml;
    $fl.appendChild(d);
    $fl.scrollTop = $fl.scrollHeight;
}

function fmtElapsed(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
}

let elapsedTimer = null;
function updStats() {
    $('s-done').textContent = S.done;
    $('s-err').textContent = S.err;
    $('s-icc').textContent = S.icc;
    $('s-crash').textContent = S.crash;
    $('s-cwe').textContent = S.cwe;
    $('s-idx').textContent = idx;
    const el = Date.now() - S.t0;
    $('s-rate').textContent = el > 0 ? (S.done / (el / 1000)).toFixed(1) : '0';
    $('s-elapsed').textContent = fmtElapsed(el);
    $pf.style.width = (filtered.length > 0 ? idx / filtered.length * 100 : 0).toFixed(1) + '%';
}

// -- Manifest -------------------------------------------------------
(async function init() {
    try {
        const r = await fetch('manifest.json');
        manifest = await r.json();
        filtered = manifest.files.slice();
        $('s-tot').textContent = manifest.total;
        const byType = manifest.stats ? manifest.stats.types : {};
        log('i', 'Manifest: ' + manifest.total + ' files (ICC:' + (byType.icc||0) + ' IMG:' + (byType.image||0) + ' XML:' + (byType.xml||0) + ')');
        $fb.textContent = 'Ready -- ' + manifest.total + ' files | generate-manifest.py --root .. to refresh';
    } catch(e) {
        log('e', 'Manifest load failed: ' + e.message + ' -- Run: python3 generate-manifest.py --root ..');
    }
})();

// -- Filter / Shuffle -----------------------------------------------
$('filt').onchange = function() {
    if (!manifest) return;
    const v = this.value;
    if (v === 'all') filtered = manifest.files.slice();
    else if (v === 'image') filtered = manifest.files.filter(f => f.type === 'image');
    else if (v === 'icc') filtered = manifest.files.filter(f => f.type === 'icc');
    else if (v === 'xml') filtered = manifest.files.filter(f => f.type === 'xml');
    else filtered = manifest.files.filter(f => f.ext === v || (v === '.jpg' && f.ext === '.jpeg') || (v === '.tif' && f.ext === '.tiff'));
    idx = 0;
    $('s-tot').textContent = filtered.length;
    log('i', 'Filter: ' + v + ' = ' + filtered.length + ' files');
};

$('btn-shuffle').onclick = function() {
    for (let i = filtered.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
    }
    idx = 0;
    log('i', 'Shuffled ' + filtered.length + ' files');
};

// -- Worker Pool for ICC parsing ------------------------------------
// Workers parse ICC binary headers off-main-thread with CWE-annotated heuristic checks
const WORKER_CODE = `
self.onmessage = function(e) {
    const buf = e.data.buf;
    const path = e.data.path;
    const result = { path: path, warnings: [], info: {} };

    try {
        const view = new DataView(buf);
        if (buf.byteLength < 128) {
            result.warnings.push('Truncated: ' + buf.byteLength + ' bytes (<128 minimum)');
            self.postMessage(result);
            return;
        }

        // H1: Profile size
        result.info.size = view.getUint32(0);
        if (result.info.size !== buf.byteLength)
            result.warnings.push('Size mismatch: header=' + result.info.size + ' actual=' + buf.byteLength);

        // H3: Version BCD
        const major = view.getUint8(8);
        const minor = (view.getUint8(9) >> 4) & 0xF;
        const bugfix = view.getUint8(9) & 0xF;
        result.info.version = major + '.' + minor + '.' + bugfix;
        if (view.getUint8(10) !== 0 || view.getUint8(11) !== 0)
            result.warnings.push('Bad version: bytes 10-11 must be 0x0000 (got 0x' + view.getUint8(10).toString(16) + view.getUint8(11).toString(16) + ')');
        if (major > 5 || (major === 0))
            result.warnings.push('Bad version: major=' + major + ' (expected 2-5)');

        function sig(off) {
            return String.fromCharCode(view.getUint8(off), view.getUint8(off+1), view.getUint8(off+2), view.getUint8(off+3)).trim();
        }
        result.info.cls = sig(12);
        result.info.cs = sig(16);
        result.info.pcs = sig(20);

        // H5: Magic number
        const magic = sig(36);
        if (magic !== 'acsp') result.warnings.push('Bad magic: "' + magic + '" (expected "acsp")');

        // H7: Rendering intent
        result.info.intent = view.getUint32(64);
        if (result.info.intent > 3)
            result.warnings.push('Intent > 3: ' + result.info.intent + ' (max=3)');

        // H6: PCS illuminant D50 check
        if (buf.byteLength >= 80) {
            const pX = view.getInt32(68) / 65536.0;
            const pY = view.getInt32(72) / 65536.0;
            const pZ = view.getInt32(76) / 65536.0;
            result.info.illum = pX.toFixed(4) + ',' + pY.toFixed(4) + ',' + pZ.toFixed(4);
            if (Math.abs(pX - 0.9642) > 0.01 || Math.abs(pY - 1.0) > 0.01 || Math.abs(pZ - 0.8249) > 0.01)
                result.warnings.push('PCS != D50: (' + result.info.illum + ')');
        }

        // H8: Reserved bytes 100-127
        let nz = 0;
        for (let i = 100; i < 128; i++) if (view.getUint8(i) !== 0) nz++;
        if (nz > 0) result.warnings.push(nz + ' non-zero reserved bytes (100-127)');

        // Profile ID bytes 84-99
        let pidNonZero = 0;
        for (let i = 84; i < 100; i++) if (view.getUint8(i) !== 0) pidNonZero++;
        if (pidNonZero > 0) {
            let pidHex = '';
            for (let i = 84; i < 100; i++) pidHex += view.getUint8(i).toString(16).padStart(2, '0');
            result.info.profileId = pidHex;
        }

        // Tag table
        if (buf.byteLength >= 132) {
            result.info.tags = view.getUint32(128);
        }
        if (result.info.tags > 200)
            result.warnings.push('Suspicious tag count: ' + result.info.tags);

        // Tag table validation (duplicate sigs, overlaps, OOB)
        if (result.info.tags && result.info.tags < 500 && buf.byteLength >= 132 + result.info.tags * 12) {
            const tagInfo = [];
            const sigSet = new Set();
            const ranges = [];

            for (let t = 0; t < result.info.tags; t++) {
                const base = 132 + t * 12;
                const tSig = sig(base);
                const tOff = view.getUint32(base + 4);
                const tSz = view.getUint32(base + 8);
                tagInfo.push(tSig + '@' + tOff + '+' + tSz);

                // Duplicate signature detection
                if (sigSet.has(tSig))
                    result.warnings.push('Duplicate tag: "' + tSig + '" at entry ' + t);
                sigSet.add(tSig);

                // OOB check
                if (tOff + tSz > buf.byteLength)
                    result.warnings.push('Tag "' + tSig + '" overflows: off=' + tOff + ' sz=' + tSz + ' > fileSize=' + buf.byteLength);

                // 4-byte alignment check
                if (tOff % 4 !== 0)
                    result.warnings.push('Tag "' + tSig + '" unaligned: off=' + tOff + ' (not 4-byte)');

                ranges.push({ sig: tSig, off: tOff, sz: tSz, end: tOff + tSz });

                // Read tag data to exercise buffer
                if (tOff < buf.byteLength && tOff + Math.min(tSz, 4096) <= buf.byteLength) {
                    const tagSlice = new Uint8Array(buf, tOff, Math.min(tSz, 4096));
                    let tagSum = 0;
                    for (let k = 0; k < tagSlice.length; k++) tagSum += tagSlice[k];
                }
            }

            // Tag overlap detection (partial overlaps)
            ranges.sort((a, b) => a.off - b.off);
            for (let i = 0; i < ranges.length - 1; i++) {
                const a = ranges[i], b = ranges[i + 1];
                if (a.off === b.off && a.sz === b.sz) continue; // shared OK
                if (a.end > b.off && a.off !== b.off)
                    result.warnings.push('Tag overlap: "' + a.sig + '" [' + a.off + '-' + a.end + '] vs "' + b.sig + '" [' + b.off + '-' + (b.off + b.sz) + ']');
            }

            result.info.tagList = tagInfo;
        }

        // Memory stress: fragment views to exercise GC
        const chunkSize = Math.max(64, Math.floor(buf.byteLength / 16));
        let fragCount = 0;
        for (let off = 0; off + chunkSize <= buf.byteLength; off += chunkSize) {
            const slice = buf.slice(off, off + chunkSize);
            const v = new Uint8Array(slice);
            let sum = 0;
            for (let k = 0; k < v.length; k++) sum += v[k];
            fragCount++;
        }
        result.info.fragments = fragCount;

    } catch(ex) {
        result.warnings.push('PARSE CRASH: ' + ex.message);
        result.crash = true;
    }
    self.postMessage(result);
};
`;

let workerPool = [];
let workerQueue = [];
let workerBusy = [];

function initWorkers() {
    const n = parseInt($('workers').value) || 4;
    workerPool.forEach(w => w.terminate());
    workerPool = [];
    workerBusy = [];
    const blob = new Blob([WORKER_CODE], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    for (let i = 0; i < n; i++) {
        const w = new Worker(url);
        w.onmessage = function(e) {
            workerBusy[i] = false;
            handleWorkerResult(e.data);
            drainQueue();
        };
        w.onerror = function(e) {
            workerBusy[i] = false;
            S.crash++;
            log('c', 'WORKER CRASH: ' + e.message);
            drainQueue();
        };
        workerPool.push(w);
        workerBusy.push(false);
    }
    URL.revokeObjectURL(url);
}

function submitToWorker(buf, path) {
    workerQueue.push({ buf, path });
    drainQueue();
}

function drainQueue() {
    while (workerQueue.length > 0) {
        const free = workerBusy.indexOf(false);
        if (free === -1) break;
        workerBusy[free] = true;
        const job = workerQueue.shift();
        workerPool[free].postMessage({ buf: job.buf, path: job.path }, [job.buf]);
    }
}

function handleWorkerResult(r) {
    if (r.crash) {
        S.crash++;
        log('c', 'ICC WORKER CRASH: ' + r.path);
        finding(r.path, 'Worker parse crash');
    }
    for (const w of r.warnings) {
        finding(r.path, w);
    }
    if (r.info) {
        const i = r.info;
        const parts = ['v' + (i.version||'?'), (i.cls||'?') + '/' + (i.cs||'?'), 'PCS=' + (i.pcs||'?'), (i.tags||'?') + ' tags'];
        if (i.profileId) parts.push('ID:' + i.profileId.substr(0, 8) + '...');
        const sum = parts.join(' ');
        $icc.style.display = 'block';
        $icc.innerHTML = '<b>ICC</b> ' + esc(sum) +
            (r.warnings.length ? '<br><span style="color:#f85149">' + r.warnings.length + ' findings</span>' : '<br><span style="color:#3fb950">clean</span>');
    }
}

// -- Image Processing (main thread) --------------------------------
function loadImage(file) {
    return new Promise(resolve => {
        const url = '../' + file.path.replace(/^\.\//, '');
        const img = new Image();
        const to = setTimeout(() => {
            S.err++;
            log('w', 'TIMEOUT: ' + file.path);
            finding(file.path, 'Load timeout 10s');
            resolve();
        }, 10000);

        img.onload = () => {
            clearTimeout(to);
            S.done++;
            trackFormat(file.ext);

            // Show in render zone
            while ($render.lastChild && $render.lastChild !== $icc && $render.lastChild !== $fb)
                $render.removeChild($render.lastChild);
            $render.insertBefore(img, $fb);
            $icc.style.display = 'none';
            $fb.textContent = '[' + idx + '/' + filtered.length + '] ' + file.path + ' (' + img.naturalWidth + 'x' + img.naturalHeight + ')';

            // Canvas decode + pixel readback
            try {
                const c = document.createElement('canvas');
                c.width = Math.min(img.naturalWidth || 1, 4096);
                c.height = Math.min(img.naturalHeight || 1, 4096);
                let ctx;
                try { ctx = c.getContext('2d', { colorSpace: 'display-p3' }); } catch(_) { ctx = c.getContext('2d'); }
                ctx.drawImage(img, 0, 0, c.width, c.height);
                const px = ctx.getImageData(0, 0, Math.min(c.width, 256), Math.min(c.height, 256));
                checkPixels(file, px, img);
            } catch(e) {
                S.crash++;
                log('c', 'CANVAS CRASH: ' + file.path + ' -- ' + e.message);
                finding(file.path, 'Canvas: ' + e.message);
            }

            // createImageBitmap path
            try {
                createImageBitmap(img, { resizeWidth: 64, resizeHeight: 64, resizeQuality: 'high' }).then(bmp => {
                    const c2 = document.createElement('canvas');
                    c2.width = 64; c2.height = 64;
                    const ctx2 = c2.getContext('2d');
                    ctx2.drawImage(bmp, 0, 0);
                    ctx2.getImageData(0, 0, 64, 64);
                    bmp.close();
                }).catch(() => {});
            } catch(_) {}

            log('ok', file.path + ' (' + img.naturalWidth + 'x' + img.naturalHeight + ')');
            resolve();
        };

        img.onerror = () => {
            clearTimeout(to);
            S.err++;
            trackFormat(file.ext, true);
            log('e', file.path);
            finding(file.path, 'Image load error (decoder rejected)');
            resolve();
        };

        img.crossOrigin = 'anonymous';
        img.src = url;
    });
}

function trackFormat(ext, isErr) {
    if (!perFormat[ext]) perFormat[ext] = { done: 0, err: 0, findings: 0 };
    if (isErr) perFormat[ext].err++;
    else perFormat[ext].done++;
}

function checkPixels(file, pd, img) {
    const d = pd.data, len = d.length / 4;
    if (len < 16) return;

    let flat = true;
    for (let i = 4; i < Math.min(d.length, 4096); i += 4)
        if (d[i] !== d[0] || d[i+1] !== d[1] || d[i+2] !== d[2]) { flat = false; break; }
    if (flat) { log('w', 'FLAT: ' + file.path); finding(file.path, 'Flat/degenerate'); }

    let trans = true;
    for (let i = 3; i < Math.min(d.length, 4096); i += 4) if (d[i] !== 0) { trans = false; break; }
    if (trans) { log('w', 'TRANSPARENT: ' + file.path); finding(file.path, 'Fully transparent'); }

    if (img.naturalWidth > 16384 || img.naturalHeight > 16384)
        finding(file.path, 'Extreme: ' + img.naturalWidth + 'x' + img.naturalHeight);
    if (img.naturalWidth === 0 || img.naturalHeight === 0)
        finding(file.path, 'Zero-dimension loaded without error');
}

// -- ICC Processing (main thread fetch + worker parse) --------------
async function loadICC(file) {
    const url = '../' + file.path.replace(/^\.\//, '');
    try {
        const r = await fetch(url);
        if (!r.ok) { S.err++; log('e', 'ICC ' + r.status + ': ' + file.path); finding(file.path, 'HTTP ' + r.status); return; }
        const buf = await r.arrayBuffer();
        S.icc++;
        S.done++;
        trackFormat('.icc');

        $fb.textContent = '[' + idx + '/' + filtered.length + '] ' + file.path + ' (' + buf.byteLength + ' B)';

        submitToWorker(buf.slice(0), file.path);

        // Main-thread: try createImageBitmap on ICC data (should fail -- exercises error paths)
        const blob = new Blob([buf], { type: 'application/vnd.icc' });
        const blobUrl = URL.createObjectURL(blob);
        try {
            const bmp = await createImageBitmap(blob);
            S.crash++;
            log('c', 'ICC AS IMAGE: ' + file.path);
            finding(file.path, 'ICC AS IMAGE: decoded as ImageBitmap (type confusion)');
            bmp.close();
        } catch(_) {
            // Expected
        }
        URL.revokeObjectURL(blobUrl);
        log('p', file.path + ' (' + buf.byteLength + 'B)');
    } catch(e) {
        S.err++;
        log('e', 'ICC: ' + file.path + ' -- ' + e.message);
        finding(file.path, 'Fetch error: ' + e.message);
    }
}

// -- Fuzzing Loop ---------------------------------------------------
async function tick() {
    if (!running) return;
    if (idx >= filtered.length) {
        log('i', 'COMPLETE: ' + S.done + ' done, ' + S.err + ' errors, ' + findings.length + ' findings');
        stop();
        showSummary();
        return;
    }
    const batch = parseInt($('batch').value) || 8;
    const promises = [];
    for (let i = 0; i < batch && idx < filtered.length; i++) {
        const f = filtered[idx++];
        if (f.type === 'icc') promises.push(loadICC(f));
        else if (f.type === 'image') promises.push(loadImage(f));
        else { S.done++; idx; } // skip xml/cube for now
    }
    await Promise.allSettled(promises);
    updStats();
    timer = setTimeout(tick, parseInt($('delay').value) || 20);
}

function start() {
    if (running || !manifest) return;
    running = true;
    S = { done: 0, err: 0, icc: 0, crash: 0, cwe: 0, t0: Date.now() };
    perFormat = {};
    perSeverity = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, INFO: 0 };
    findings = [];
    $fl.innerHTML = '';
    $('f-cnt').textContent = '0';
    $('btn-start').disabled = true;
    $('btn-stop').disabled = false;
    initWorkers();
    elapsedTimer = setInterval(updStats, 1000);
    log('i', 'Started: ' + filtered.length + ' files, batch=' + $('batch').value + ', workers=' + $('workers').value);
    tick();
}

function stop() {
    running = false;
    if (timer) { clearTimeout(timer); timer = null; }
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    $('btn-start').disabled = false;
    $('btn-stop').disabled = true;
    updStats();
    log('w', 'Stopped at ' + idx + '/' + filtered.length);
}

// -- Summary Report -------------------------------------------------
function showSummary() {
    const el = Date.now() - S.t0;
    let html = '<table>';
    html += '<tr><th>Metric</th><th>Value</th></tr>';
    html += '<tr><td>Files processed</td><td>' + S.done + '</td></tr>';
    html += '<tr><td>Errors</td><td>' + S.err + '</td></tr>';
    html += '<tr><td>ICC profiles</td><td>' + S.icc + '</td></tr>';
    html += '<tr><td>Crashes</td><td style="color:#f85149">' + S.crash + '</td></tr>';
    html += '<tr><td>CWE findings</td><td style="color:#f0883e">' + S.cwe + '</td></tr>';
    html += '<tr><td>Total findings</td><td>' + findings.length + '</td></tr>';
    html += '<tr><td>Rate</td><td>' + (el > 0 ? (S.done / (el / 1000)).toFixed(1) : 0) + '/s</td></tr>';
    html += '<tr><td>Elapsed</td><td>' + fmtElapsed(el) + '</td></tr>';
    html += '</table>';

    html += '<h3 style="margin-top:12px;color:#f0883e">Severity Distribution</h3><table>';
    html += '<tr><th>Severity</th><th>Count</th></tr>';
    for (const [sev, cnt] of Object.entries(perSeverity)) {
        if (cnt > 0) html += '<tr><td>' + sev + '</td><td>' + cnt + '</td></tr>';
    }
    html += '</table>';

    if (Object.keys(perFormat).length > 0) {
        html += '<h3 style="margin-top:12px;color:#58a6ff">Per-Format</h3><table>';
        html += '<tr><th>Format</th><th>Done</th><th>Err</th><th>Findings</th></tr>';
        for (const [ext, data] of Object.entries(perFormat).sort((a, b) => b[1].done - a[1].done)) {
            html += '<tr><td>' + ext + '</td><td>' + data.done + '</td><td>' + data.err + '</td><td>' + data.findings + '</td></tr>';
        }
        html += '</table>';
    }

    // Top findings by CWE
    const cweCounts = {};
    for (const f of findings) {
        if (f.cwe) cweCounts[f.cwe] = (cweCounts[f.cwe] || 0) + 1;
    }
    if (Object.keys(cweCounts).length > 0) {
        html += '<h3 style="margin-top:12px;color:#f0883e">CWE Summary</h3><table>';
        html += '<tr><th>CWE</th><th>Count</th></tr>';
        for (const [cwe, cnt] of Object.entries(cweCounts).sort((a, b) => b[1] - a[1])) {
            html += '<tr><td>' + cwe + '</td><td>' + cnt + '</td></tr>';
        }
        html += '</table>';
    }

    $('summary-content').innerHTML = html;
    $('summary-modal').classList.add('active');
}

// -- Controls -------------------------------------------------------
$('btn-start').onclick = start;
$('btn-stop').onclick = stop;
$('btn-summary').onclick = showSummary;
$('btn-clear').onclick = () => { $log.innerHTML = ''; logN = 0; };

$('btn-export').onclick = () => {
    const d = JSON.stringify({
        ts: new Date().toISOString(),
        stats: S,
        severity: perSeverity,
        perFormat: perFormat,
        findings: findings,
    }, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([d], { type: 'application/json' }));
    a.download = 'ua-findings-' + Date.now() + '.json';
    a.click();
};

$('btn-csv').onclick = () => {
    let csv = 'path,detail,severity,cwe,description,timestamp\n';
    for (const f of findings) {
        csv += '"' + f.path.replace(/"/g,'""') + '","' + f.detail.replace(/"/g,'""') + '","' + (f.severity||'') + '","' + (f.cwe||'') + '","' + (f.desc||'') + '","' + new Date(f.ts).toISOString() + '"\n';
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'ua-findings-' + Date.now() + '.csv';
    a.click();
};

// Keyboard: space = toggle, s = shuffle, m = summary
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ') { e.preventDefault(); running ? stop() : start(); }
    if (e.key === 's') $('btn-shuffle').click();
    if (e.key === 'm') showSummary();
});

// Global error handlers
window.addEventListener('error', e => { S.crash++; log('c', 'GLOBAL: ' + e.message); updStats(); });
window.addEventListener('unhandledrejection', e => { S.crash++; log('c', 'REJECTION: ' + e.reason); updStats(); });
</script>
