<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ICC Profile Analyzer -- 173-check ICC security and conformance scanner with V2 Web UI reports">
<title>ICC Profile Analyzer -- MCP Web UI</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
/* -- Reset & Variables ----------------------------------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --border:   #30363d;
  --text:     #e6edf3;
  --muted:    #8b949e;
  --accent:   #58a6ff;
  --green:    #3fb950;
  --red:      #f85149;
  --yellow:   #d29922;
  --mono:     'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --sans:     -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --radius:   6px;
}
html { font-size: 15px; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* -- Layout ---------------------------------------------- */
.container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 1rem;
  margin-bottom: 1.5rem;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
header h1 { font-size: 1.4rem; font-weight: 600; }
header .badge {
  font-size: 0.75rem;
  padding: 0.15rem 0.5rem;
  border-radius: 10px;
  background: var(--accent);
  color: var(--bg);
  font-weight: 600;
}

/* -- Tool Selector --------------------------------------- */
.toolbar {
  display: flex; gap: 0.5rem; flex-wrap: wrap;
  margin-bottom: 1rem;
}
.toolbar button {
  padding: 0.4rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--muted);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.15s;
}
.toolbar button:hover { border-color: var(--accent); color: var(--text); }
.toolbar button.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}

/* -- Input Panel ----------------------------------------- */
.input-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  margin-bottom: 1rem;
}
.input-panel label {
  display: block;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 0.3rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.input-row {
  display: flex; gap: 0.5rem; align-items: flex-end;
  margin-bottom: 0.5rem;
}
.input-row:last-child { margin-bottom: 0; }
.input-row .field { flex: 1; }
.input-row .field-wide { flex: 2; }
.input-row input, .input-row select {
  width: 100%;
  padding: 0.45rem 0.7rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--mono);
  font-size: 0.85rem;
}
.input-row input:focus, .input-row select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(88,166,255,0.2);
}
.btn-run {
  padding: 0.45rem 1.2rem;
  border: none;
  border-radius: var(--radius);
  background: var(--green);
  color: var(--bg);
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.btn-run:hover { opacity: 0.85; }
.btn-run:disabled { opacity: 0.4; cursor: not-allowed; }

/* -- Profile Quick-Pick ---------------------------------- */
.profile-list {
  margin-top: 0.5rem;
  max-height: 180px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  display: none;
}
.profile-list.open { display: block; }
.profile-list .item {
  padding: 0.3rem 0.7rem;
  font-family: var(--mono);
  font-size: 0.8rem;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between;
}
.profile-list .item:last-child { border-bottom: none; }
.profile-list .item:hover { background: var(--surface); }
.profile-list .item .size { color: var(--muted); font-size: 0.75rem; }

/* -- File upload ----------------------------------------- */
.file-upload-row {
  display: flex; gap: 0.5rem; align-items: center;
  margin-top: 0.5rem; padding-top: 0.5rem;
  border-top: 1px solid var(--border);
}
.file-upload-row .btn-upload {
  padding: 0.35rem 0.8rem;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: transparent;
  color: var(--accent);
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
}
.file-upload-row .btn-upload:hover { background: var(--accent); color: var(--bg); }
.file-upload-row .upload-status {
  font-size: 0.75rem; color: var(--muted);
}
.hidden-input {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0,0,0,0);
  border: 0; padding: 0; margin: -1px;
}
.btn-save-xml {
  padding: 0.45rem 1.2rem;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--bg);
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.btn-save-xml:hover { opacity: 0.85; }
.btn-save {
  padding: 0.45rem 1rem;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: transparent;
  color: var(--accent);
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.btn-save:hover { background: var(--accent); color: var(--bg); }
.btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
.download-link {
  display: block;
  margin-top: 0.5rem;
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 600;
}
.clipboard-offscreen {
  position: fixed;
  opacity: 0;
}

/* -- Status bar ------------------------------------------ */
.status {
  font-size: 0.8rem;
  margin-bottom: 0.5rem;
  min-height: 1.2em;
}
.status.running { color: var(--yellow); }
.status.ok { color: var(--green); }
.status.err { color: var(--red); }

/* -- Output Panel ---------------------------------------- */
.output {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-height: 300px;
  max-height: 70vh;
  overflow: auto;
  position: relative;
}
.output pre {
  padding: 1rem;
  margin: 0;
  font-family: var(--mono);
  font-size: 0.8rem;
  line-height: 1.45;
  white-space: pre;
  word-break: normal;
  tab-size: 4;
  color: var(--text);
}
.output .placeholder {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: var(--muted);
  font-size: 0.9rem;
  text-align: center;
}
.output .copy-btn {
  position: absolute; top: 0.5rem; right: 0.5rem;
  padding: 0.25rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--muted);
  font-size: 0.75rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
}
.output:hover .copy-btn { opacity: 1; }
.output .copy-btn:hover { color: var(--text); border-color: var(--accent); }

/* -- Footer ---------------------------------------------- */
footer {
  border-top: 1px solid var(--border);
  margin-top: 2rem;
  padding-top: 1rem;
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
}

.toolbar .separator {
  border-left: 1px solid var(--border);
  margin: 0 0.3rem;
  align-self: stretch;
}

/* -- Responsive ------------------------------------------ */
@media (max-width: 640px) {
  .input-row { flex-direction: column; }
  .toolbar { gap: 0.3rem; }
  .toolbar button { font-size: 0.78rem; padding: 0.35rem 0.6rem; }
}

/* -- Focus-visible (keyboard nav) ------------------------ */
.toolbar button:focus-visible,
.btn-run:focus-visible,
.btn-save:focus-visible,
.btn-save-xml:focus-visible,
.btn-upload:focus-visible,
.copy-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* -- Copy button visibility ------------------------------ */
.copy-hidden { display: none; }

/* -- Loading animation ----------------------------------- */
.status.running::before {
  content: "";
  display: inline-block;
  width: 0.7em;
  height: 0.7em;
  border: 2px solid var(--yellow);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 0.4em;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.tool-hint { color: #a6adc8; font-size: 13px; margin: 8px 0 0 0; line-height: 1.4; }
.graph-frame { background: #11111b; margin-top: 10px; min-height: 200px; height: 600px; border: 1px solid #333; border-radius: 6px; position: relative; }
.graph-viewer-container { width: 100%; }
.graph-loading { color: #888; }
.graph-error { color: #f38ba8; }
.graph-search-bar { position: absolute; top: 8px; left: 8px; z-index: 10; display: flex; gap: 6px; }
.graph-search-input { padding: 4px 8px; border-radius: 4px; border: 1px solid #555; background: #1e1e2e; color: #cdd6f4; font-size: 13px; width: 200px; }
.graph-type-filter { padding: 4px; border-radius: 4px; border: 1px solid #555; background: #1e1e2e; color: #cdd6f4; font-size: 13px; }
.graph-legend { position: absolute; bottom: 8px; left: 8px; z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; }
.graph-legend-swatch { display: inline-flex; align-items: center; gap: 3px; }
.graph-legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.graph-detail { position: absolute; top: 8px; right: 8px; z-index: 10; max-width: 320px; max-height: 400px; overflow: auto; background: #1e1e2e; border: 1px solid #555; border-radius: 6px; padding: 10px; font-size: 12px; color: #cdd6f4; display: none; white-space: pre-wrap; font-family: monospace; }
.is-hidden { display: none !important; }
.output-rich {
  padding: 1rem;
  color: var(--text);
}
.overlay-shell { display: flex; flex-direction: column; gap: 1rem; }
.overlay-hero,
.overlay-layer {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(22, 27, 34, 0.92);
  padding: 1rem;
}
.overlay-eyebrow {
  display: inline-block;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.4rem;
}
.overlay-title-row,
.overlay-chip-row,
.overlay-gate-row,
.overlay-node-grid,
.overlay-card-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.overlay-title-row {
  align-items: center;
  justify-content: space-between;
}
.overlay-title-row h2,
.overlay-layer h3,
.overlay-card h4 {
  margin: 0;
}
.overlay-subtitle,
.overlay-note,
.overlay-card dd,
.overlay-summary {
  color: var(--muted);
}
.overlay-status-badge,
.overlay-chip,
.overlay-gate {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 0.35rem 0.7rem;
  font-size: 0.8rem;
  font-weight: 600;
  border: 1px solid transparent;
}
.overlay-status-badge.conformant,
.overlay-chip.ok,
.overlay-gate.ok {
  background: rgba(63, 185, 80, 0.14);
  color: #7ee787;
  border-color: rgba(63, 185, 80, 0.35);
}
.overlay-status-badge.warning,
.overlay-chip.warn,
.overlay-gate.warn {
  background: rgba(210, 153, 34, 0.14);
  color: #e3b341;
  border-color: rgba(210, 153, 34, 0.35);
}
.overlay-status-badge.non_conformant,
.overlay-chip.fail,
.overlay-gate.fail {
  background: rgba(248, 81, 73, 0.14);
  color: #ff938a;
  border-color: rgba(248, 81, 73, 0.35);
}
.overlay-grid,
.overlay-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 0.75rem;
}
.overlay-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #11161d;
  padding: 0.9rem;
}
.overlay-card dl {
  margin: 0;
}
.overlay-card dt {
  margin-top: 0.6rem;
  color: #9fb3c8;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.overlay-card dd {
  margin: 0.15rem 0 0;
  font-size: 0.88rem;
  line-height: 1.45;
  word-break: break-word;
}
.overlay-node-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}
.overlay-node {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #11161d;
  padding: 0.9rem;
  text-align: left;
  color: var(--text);
  cursor: pointer;
  font: inherit;
}
.overlay-node:hover {
  border-color: var(--accent);
}
.overlay-node strong {
  display: block;
  margin-bottom: 0.35rem;
}
.overlay-node-center {
  background: linear-gradient(180deg, rgba(88, 166, 255, 0.12), rgba(22, 27, 34, 0.92));
}
.overlay-table-wrap {
  overflow-x: auto;
  margin-top: 0.75rem;
}
.overlay-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}
.overlay-table th,
.overlay-table td {
  padding: 0.55rem 0.6rem;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}
.overlay-table th {
  color: #9fb3c8;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.overlay-list {
  margin: 0.7rem 0 0;
  padding-left: 1.1rem;
}
.overlay-list li { margin: 0.3rem 0; }
.overlay-inline-code,
.overlay-mono {
  font-family: var(--mono);
  color: #cdd9e5;
}
.overlay-sections {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}
.overlay-section {
  border-top: 1px solid var(--border);
  padding-top: 0.9rem;
}
.overlay-section:first-child {
  border-top: none;
  padding-top: 0;
}
@media (max-width: 720px) {
  .overlay-title-row {
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>
</head>
<body>
<div class="container">

  <header>
    <h1> ICC Profile Analyzer</h1>
    <span class="badge">MCP Web UI</span>
  </header>

  <!-- Tool selector -->
  <nav class="toolbar" id="toolbar" role="navigation" aria-label="Analysis tools">
    <button data-tool="list"      class="active">List Profiles</button>
    <button data-tool="inspect"  >Inspect</button>
    <button data-tool="profile_report" >Binary Report</button>
    <button data-tool="security" >Security Scan</button>
    <button data-tool="security_json" >Security (JSON)</button>
    <button data-tool="security_report" >Security (Report)</button>
    <button data-tool="pawg" >PAWG</button>
    <button data-tool="profile_overlay" >Profile Overlay</button>
    <button data-tool="roundtrip">Round-Trip</button>
    <button data-tool="full"     >Full Analysis</button>
    <button data-tool="xml"      >To XML</button>
    <button data-tool="compare"  >Compare</button>
    <span class="separator" data-separator></span>
    <button data-tool="cmake_configure">CMake Configure</button>
    <button data-tool="cmake_build"    >CMake Build</button>
    <button data-tool="create_profiles">Create Profiles</button>
    <button data-tool="run_tests"      >Run Tests</button>
    <button data-tool="option_matrix"  >Option Matrix</button>
    <button data-tool="windows_build" >Windows Build</button>
    <button data-tool="build_tools"   >Build Tools</button>
    <span class="separator" data-separator></span>
    <button data-tool="health_check"       >Health Check</button>
    <button data-tool="check_dependencies" >Check Deps</button>
    <button data-tool="find_artifacts"     >Find Artifacts</button>
    <button data-tool="batch_test"         >Batch Test</button>
    <button data-tool="validate_xml"       >Validate XML</button>
    <button data-tool="coverage_report"    >Coverage</button>
    <button data-tool="scan_logs"          >Scan Logs</button>
    <button data-tool="upload_and_analyze" >Upload &amp; Analyze</button>
    <span class="separator" data-separator></span>
    <button data-tool="attack_surface"    >Attack Surface</button>
    <button data-tool="coverage_gaps"     >Coverage Gaps</button>
    <button data-tool="dump_all"          >Dump All</button>

    <button data-tool="graph_viewer"      >Graph Viewer</button>

  <!-- Input panel -->
  <section class="input-panel" id="inputPanel">

  </section>

  <!-- Status -->
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <!-- Output -->
  <section class="output" id="output" role="region" aria-label="Analysis output">
    <button class="copy-btn copy-hidden" id="copyBtn" aria-label="Copy output to clipboard">Copy</button>
    <div class="placeholder" id="placeholder">Select a tool and click <strong>Run</strong></div>
    <pre id="outputPre" class="hidden-input"></pre>
    <div id="outputRich" class="output-rich is-hidden"></div>
  </section>

  <footer>
    Copyright &copy; 2026 David H Hoyt LLC &mdash;
    <a href="https://hoyt.net">hoyt.net</a> &mdash;
    ICC Profile MCP Server
  </footer>

</div>

<script>
/* ================================================================
   ICC Profile Analyzer -- Web UI (vanilla JS, zero dependencies)
   ================================================================ */
"use strict";

const TOOLS = {
  list:      { label: "List Profiles",  endpoint: "/api/list",      fields: ["directory"], method: "GET" },
  inspect:   { label: "Inspect",        endpoint: "/api/inspect",   fields: ["path"],      method: "GET" },
  profile_report: { label: "Binary Report", endpoint: null, fields: ["path", "engine"], method: null },
  security:  { label: "Security Scan",  endpoint: "/api/security",  fields: ["path"],      method: "GET" },
  security_json:   { label: "Security (JSON)",   endpoint: "/api/security-json",   fields: ["path"], method: "GET" },
  security_report: { label: "Security (Report)", endpoint: "/api/security-report", fields: ["path"], method: "GET" },
  pawg:            { label: "PAWG",              endpoint: "/api/pawg",            fields: ["path"], method: "GET" },
  profile_overlay: { label: "Profile Overlay",   endpoint: "/api/profile-overlay", fields: ["path"], method: "GET" },
  roundtrip: { label: "Round-Trip",     endpoint: "/api/roundtrip", fields: ["path"],      method: "GET" },
  full:      { label: "Full Analysis",  endpoint: "/api/full",      fields: ["path"],      method: "GET" },
  xml:       { label: "To XML",         endpoint: "/api/xml",       fields: ["path"],      method: "GET" },
  compare:   { label: "Compare",        endpoint: "/api/compare",   fields: ["path_a", "path_b"], method: "GET" },
  cmake_configure: { label: "CMake Configure", endpoint: "/api/cmake/configure", fields: ["build_type","enable_tools","sanitizers","compiler","generator","extra_cmake_args","build_dir"], method: "POST" },
  cmake_build:     { label: "CMake Build",     endpoint: "/api/cmake/build",     fields: ["build_dir","target","jobs"], method: "POST" },
  create_profiles: { label: "Create Profiles", endpoint: "/api/create-profiles", fields: ["build_dir"], method: "POST" },
  run_tests:       { label: "Run Tests",       endpoint: "/api/run-tests",       fields: ["build_dir"], method: "POST" },
  option_matrix:   { label: "Option Matrix",   endpoint: "/api/cmake/option-matrix", fields: ["options","build_type","compiler"], method: "POST" },
  windows_build:   { label: "Windows Build",   endpoint: "/api/cmake/windows-build", fields: ["build_type","vcpkg_deps","enable_tools","extra_cmake_args","build_dir"], method: "POST" },
  build_tools:     { label: "Build Tools",     endpoint: "/api/build-tools",     fields: ["target"], method: "POST" },
  health_check:       { label: "Health Check",    endpoint: "/api/health-check",       fields: [],             method: "GET" },
  check_dependencies: { label: "Check Deps",      endpoint: "/api/check-dependencies", fields: [],             method: "GET" },
  find_artifacts:     { label: "Find Artifacts",   endpoint: "/api/find-artifacts",    fields: ["build_dir"],  method: "GET" },
  batch_test:         { label: "Batch Test",       endpoint: "/api/batch-test",        fields: ["directory","tool","build_dir"], method: "POST" },
  validate_xml:       { label: "Validate XML",     endpoint: "/api/validate-xml",      fields: ["directory","checks"], method: "POST" },
  coverage_report:    { label: "Coverage",         endpoint: "/api/coverage-report",   fields: ["build_dir"],  method: "POST" },
  scan_logs:          { label: "Scan Logs",        endpoint: "/api/scan-logs",         fields: ["directory","categories"], method: "POST" },
  upload_and_analyze: { label: "Upload & Analyze", endpoint: "/api/upload-and-analyze", fields: ["data_base64","filename","mode"], method: "POST" },
  attack_surface:     { label: "Attack Surface",   endpoint: "/api/attack-surface",    fields: ["top_n"],           method: "GET" },
  coverage_gaps:      { label: "Coverage Gaps",     endpoint: "/api/coverage-gaps",     fields: ["severity_filter"], method: "GET" },
  dump_all:           { label: "Dump All",           endpoint: "/api/dump-all",          fields: ["path","verbosity","use_read","diag"], method: "GET" },
  diagnostic_load:    { label: "Diagnostic Load",    endpoint: "/api/diagnostic-load",   fields: ["path","mode"],     method: "GET" },
  graph_viewer:       { label: "Graph Viewer",      endpoint: null,                     fields: [],                  method: null },
};

const DIRS = ["test-profiles", "extended-test-profiles"];

const DEFAULT_PROFILE = "BlacklightPoster_411039.icc";
const DEFAULT_XML_PROFILE = "BlacklightPoster_411039.icc";
const DEFAULT_OVERLAY_PROFILE = "sRGB_v4_ICC_preference.icc";

let currentTool = "list";
let profileCache = {};   // directory -> [{name, size}]

/* -- Tool switching -------------------------------------- */
function selectTool(toolName) {
  if (!TOOLS[toolName]) return;
  currentTool = toolName;
  activePathInput = null;
  location.hash = toolName;
  $toolbar.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  const active = $toolbar.querySelector(`button[data-tool="${toolName}"]`);
  if (active) active.classList.add("active");
  renderInputs();
  if (toolName === "list") run();
}

$toolbar.addEventListener("click", e => {
  const btn = e.target.closest("button[data-tool]");
  if (!btn) return;
  selectTool(btn.dataset.tool);
});

window.addEventListener("hashchange", () => {
  const h = location.hash.replace(/^#/, "");
  if (h && TOOLS[h] && h !== currentTool) selectTool(h);
});

/* -- Profile quick-pick list ----------------------------- */
async function loadProfilePicker(visible) {
  const picker = document.getElementById("profilePicker");
  if (!picker) return;

  // Use test-profiles for all tools
  const dir = "test-profiles";
  const prefix = (dir !== "test-profiles") ? dir + "/" : "";

  if (!profileCache[dir]) {
    try {
      const resp = await fetch(`/api/list?directory=${encodeURIComponent(dir)}`);
      const data = await resp.json();
      if (data.ok) {
        const lines = data.result.split("\n").slice(1).filter(l => l.trim());
        profileCache[dir] = lines.map(l => {
          const m = l.trim().match(/^(.+\.icc)\s+\((.+)\)$/);
          return m ? { name: m[1], size: m[2] } : null;
        }).filter(Boolean);
      }
    } catch { return; }
  }

  const profiles = profileCache[dir];
  if (!profiles || !profiles.length) return;

  let html = `<div class="profile-list${visible ? ' open' : ''}">`;
  for (const p of profiles) {
    html += `<div class="item" data-name="${esc(prefix + p.name)}">
      <span>${esc(p.name)}</span><span class="size">${esc(p.size)}</span>
    </div>`;
  }
  html += '</div>';
  picker.innerHTML = html;
}

  const dirEl = document.getElementById("inp-directory");
  const dir = dirEl ? dirEl.value : "fuzz/xml/icc";

  if (!xmlFileCache[dir]) {
    try {
      const resp = await fetch(`/api/list-xml?directory=${encodeURIComponent(dir)}`);
      if (!resp.ok) {
        picker.innerHTML = `<div class="profile-list open"><div class="item"><span>Error loading XML files (HTTP ${resp.status})</span></div></div>`;
        return;
      }
      const data = await resp.json();
      if (data.ok) xmlFileCache[dir] = data.files || [];
      else {
        picker.innerHTML = `<div class="profile-list open"><div class="item"><span>Error: ${esc(data.error || "Unknown")}</span></div></div>`;
        return;
      }
    } catch (err) {
      picker.innerHTML = `<div class="profile-list open"><div class="item"><span>Failed to load XML files</span></div></div>`;
      return;
    }
  }

  const files = xmlFileCache[dir];
  if (!files || !files.length) {
    picker.innerHTML = '<div class="profile-list open"><div class="item"><span>No .xml files found in this directory</span></div></div>';
    return;
  }

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1048576).toFixed(1) + " MB";
  }

  let html = '<div class="profile-list open">';
  for (const f of files) {
    html += `<div class="item xml-item" data-xmlpath="${esc(f.path)}">
      <span>${esc(f.name)}</span><span class="size">${fmtSize(f.size)}</span>
    </div>`;
  }
  html += '</div>';
  picker.innerHTML = html;
}

/* -- Graph viewer (inline Cytoscape.js) ------------------ */
async function loadGraphViewer() {
  const frame = document.getElementById("graphViewerFrame");
  if (!frame) return;
  const btn = document.getElementById("btnLoadGraph");
  if (btn) btn.disabled = true;
  setStatus("running", "Loading knowledge graph\u2026");
  frame.innerHTML = '<p class="graph-loading">Loading graph data\u2026</p>';

  try {
    const resp = await fetch("/api/knowledge-graph.json");
    if (!resp.ok) throw new Error("Knowledge graph not available (HTTP " + resp.status + ")");
    const kg = await resp.json();

    // Load Cytoscape.js from local server (CSP-safe, no CDN)
    if (typeof cytoscape === "undefined") {
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "/static/cytoscape.min.js";
        s.onload = resolve;
        s.onerror = () => reject(new Error("Failed to load Cytoscape.js"));
        document.head.appendChild(s);
      });
    }

    // Convert knowledge-graph.json to Cytoscape elements
    const elements = [];
    const typeColors = {
      heuristic: "#4fc3f7", cve: "#ef5350", ghsa: "#ff7043", cwe: "#ffa726",
      patch: "#66bb6a", component: "#ab47bc", fuzzer: "#26c6da"
    };
    for (const n of (kg.nodes || [])) {
      elements.push({
        data: {
          id: n.id,
          label: n.id.length > 30 ? n.id.substring(0, 28) + "\u2026" : n.id,
          fullLabel: n.name || n.id,
          type: n.type,
          color: typeColors[n.type] || "#90a4ae",
          severity: n.severity || "",
          extra: JSON.stringify(n, null, 2)
        }
      });
    }
    for (const e of (kg.edges || [])) {
      elements.push({ data: { source: e.source, target: e.target, label: e.label || "" } });
    }

    frame.innerHTML = "";
    frame.className = "graph-frame";

    // Search bar
    const searchDiv = document.createElement("div");
    searchDiv.className = "graph-search-bar";
    searchDiv.innerHTML = '<input id="graphSearch" type="text" placeholder="Search nodes\u2026" class="graph-search-input">'
      + '<select id="graphTypeFilter" class="graph-type-filter">'
      + '<option value="">All types</option>'
      + '<option value="heuristic">Heuristics</option>'
      + '<option value="cve">CVEs</option>'
      + '<option value="ghsa">GHSAs</option>'
      + '<option value="cwe">CWEs</option>'
      + '<option value="patch">Patches</option>'
      + '<option value="component">Components</option>'
      + '<option value="fuzzer">Fuzzers</option>'
      + '</select>';
    frame.appendChild(searchDiv);

    // Legend
    const legendDiv = document.createElement("div");
    legendDiv.className = "graph-legend";
    for (const [t, c] of Object.entries(typeColors)) {
      legendDiv.innerHTML += '<span class="graph-legend-swatch">'
        + '<span class="graph-legend-dot" data-color="' + c + '"></span>'
        + t + '</span>';
    }
    frame.appendChild(legendDiv);
    // Apply legend dot colors programmatically
    legendDiv.querySelectorAll(".graph-legend-dot").forEach(function(dot) {
      dot.style.backgroundColor = dot.getAttribute("data-color");
    });

    // Node detail panel
    const detailDiv = document.createElement("div");
    detailDiv.id = "graphDetail";
    detailDiv.className = "graph-detail";
    frame.appendChild(detailDiv);

    const cy = cytoscape({
      container: frame,
      elements: elements,
      style: [
        { selector: "node", style: {
          "background-color": "data(color)", "label": "data(label)",
          "font-size": "8px", "color": "#cdd6f4", "text-outline-color": "#1e1e2e",
          "text-outline-width": 1, "width": 20, "height": 20, "text-valign": "bottom",
          "text-margin-y": 4
        }},
        { selector: "edge", style: {
          "width": 1, "line-color": "#555", "target-arrow-color": "#555",
          "target-arrow-shape": "triangle", "curve-style": "bezier",
          "font-size": "7px", "color": "#888", "text-rotation": "autorotate"
        }},
        { selector: ".highlighted", style: {
          "border-width": 3, "border-color": "#ffd700", "width": 30, "height": 30, "font-size": "10px"
        }},
        { selector: ".faded", style: { "opacity": 0.15 }}
      ],
      layout: { name: "cose", animate: false, nodeRepulsion: 8000, idealEdgeLength: 80, numIter: 200 }
    });

    // Click handler -- show detail
    cy.on("tap", "node", function(evt) {
      const d = evt.target.data();
      const detail = document.getElementById("graphDetail");
      if (detail) {
        detail.style.display = "block";
        detail.textContent = d.extra || d.fullLabel;
      }
    });
    cy.on("tap", function(evt) {
      if (evt.target === cy) {
        const detail = document.getElementById("graphDetail");
        if (detail) detail.style.display = "none";
      }
    });

    // Search handler
    const searchInput = document.getElementById("graphSearch");
    const typeFilter = document.getElementById("graphTypeFilter");
    function applyFilters() {
      const q = (searchInput ? searchInput.value : "").toLowerCase();
      const t = typeFilter ? typeFilter.value : "";
      cy.batch(function() {
        cy.elements().removeClass("highlighted faded");
        if (!q && !t) return;
        const matched = cy.nodes().filter(function(n) {
          const matchType = !t || n.data("type") === t;
          const matchSearch = !q || n.data("id").toLowerCase().includes(q) || (n.data("fullLabel") || "").toLowerCase().includes(q);
          return matchType && matchSearch;
        });
        if (matched.length > 0 && (q || t)) {
          cy.elements().addClass("faded");
          matched.removeClass("faded").addClass("highlighted");
          matched.connectedEdges().removeClass("faded");
          matched.neighborhood().removeClass("faded");
        }
      });
    }
    if (searchInput) searchInput.addEventListener("input", applyFilters);
    if (typeFilter) typeFilter.addEventListener("change", applyFilters);

    setStatus("ok", "Knowledge graph loaded: " + kg.nodes.length + " nodes, " + kg.edges.length + " edges");
  } catch (err) {
    frame.innerHTML = '<p class="graph-error">' + sanitize(err.message) + '</p>';
    setStatus("err", sanitize(err.message));
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* -- File upload handler ---------------------------------- */
async function handleFileUpload() {
  const fileInput = document.getElementById("fileInput");
  const statusEl = document.getElementById("uploadStatus");
  if (!fileInput || !fileInput.files.length) return;

  const file = fileInput.files[0];
  if (file.size > 20 * 1024 * 1024) {
    if (statusEl) statusEl.textContent = "File exceeds 20 MB limit";
    return;
  }

  // For upload_and_analyze: base64-encode and store for run()
  if (currentTool === "upload_and_analyze") {
    if (statusEl) statusEl.textContent = `Reading ${file.name}...`;
    try {
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const b64 = btoa(binary);
      // Store in hidden inputs for run() to pick up
      let b64El = document.getElementById("inp-data_base64");
      if (!b64El) {
        b64El = document.createElement("input");
        b64El.type = "hidden"; b64El.id = "inp-data_base64";
        $inputPanel.appendChild(b64El);
      }
      b64El.value = b64;
      let fnEl = document.getElementById("inp-filename");
      if (!fnEl) {
        fnEl = document.createElement("input");
        fnEl.type = "hidden"; fnEl.id = "inp-filename";
        $inputPanel.appendChild(fnEl);
      }
      fnEl.value = file.name;
      if (statusEl) statusEl.textContent = `[OK] ${file.name} (${(file.size / 1024).toFixed(1)} KB) ready`;
    } catch (err) {
      if (statusEl) statusEl.textContent = `[FAIL] Read failed: ${sanitize(err.message)}`;
    }
    return;
  }

  // Default: upload to server and populate path input
  if (statusEl) statusEl.textContent = `Uploading ${file.name}...`;

  const formData = new FormData();
  formData.append("file", file);

  try {
    const resp = await fetch("/api/upload", { method: "POST", body: formData });
    const data = await resp.json();
    if (data.ok) {
      const inputs = $inputPanel.querySelectorAll("input[id^='inp-path']");
      for (const inp of inputs) {
        if (inp.id && inp.id.startsWith("inp-path")) {
          inp.value = data.path;
          break;
        }
      }
      if (statusEl) statusEl.textContent = `[OK] ${data.filename} (${(data.size / 1024).toFixed(1)} KB)`;
    } else {
      if (statusEl) statusEl.textContent = `[FAIL] ${data.error}`;
    }
  } catch (err) {
    if (statusEl) statusEl.textContent = `[FAIL] Upload failed: ${sanitize(err.message)}`;
  }
}

function openProfileReport() {

/* -- Run the selected tool ------------------------------- */
async function run() {
  const tool = TOOLS[currentTool];
  const optionalGetFields = new Set(["build_dir", "severity_filter"]);

  if (currentTool === "profile_report") {
    openProfileReport();
    return;
  }

  // graph_viewer has no API endpoint -- handled by loadGraphViewer()
  if (!tool.endpoint) return;

  const isPost = tool.method === "POST";

  if (isPost) {
    // Build JSON body from inputs
    const body = {};
    for (const f of tool.fields) {
      const el = document.getElementById(`inp-${f}`);
      if (!el) continue;
      let val = el.value.trim();
      // Type coercion for special fields
      if (f === "enable_tools") val = (val === "true");
      else if (f === "jobs") val = parseInt(val, 10) || 0;
      if (val !== "" && val !== 0 && val !== false) body[f] = val;
    }

    if (abortCtrl) abortCtrl.abort();
    abortCtrl = new AbortController();
    setStatus("running", `Running ${tool.label}...`);
    showOutput("");
    const runBtn = $inputPanel.querySelector(".btn-run");
    if (runBtn) runBtn.disabled = true;

    const t0 = performance.now();
    try {
      const resp = await fetch(tool.endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: abortCtrl.signal,
      });
      const data = await resp.json();
      const ms = (performance.now() - t0).toFixed(0);
      if (data.ok) {
        setStatus("ok", `${tool.label} completed in ${ms} ms`);
        lastOutput = normalizeOutput(data.result);
        if (currentTool === "profile_overlay") {
          showRichOutput(renderProfileOverlay(data.result));
        } else {
          showOutput(lastOutput);
        }
        enableSave(true);
      } else {
        const safeErr = sanitize(data.error || "Unknown error");
        setStatus("err", safeErr);
        showOutput(`Error: ${safeErr}`);
        lastOutput = "";
        enableSave(false);
      }
    } catch (err) {
      if (err.name === "AbortError") return;
      const safeMsg = sanitize(err.message);
      setStatus("err", `Network error: ${safeMsg}`);
      showOutput(`Network error:\n${safeMsg}`);
      lastOutput = "";
      enableSave(false);
    } finally {
      if (runBtn) runBtn.disabled = false;
    }
    return;
  }

  // GET tools (original logic)
  const params = new URLSearchParams();

  // Gather inputs
  for (const f of tool.fields) {
    const el = document.getElementById(`inp-${f}`);
    if (!el) continue;
    const val = el.value.trim();
    if (!val && !optionalGetFields.has(f) && f !== "directory") {
      setStatus("err", `${f} is required`);
      el.focus();
      return;
    }
    if (val !== "") params.set(f, val);
  }

  // Abort previous request if still running
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();

  setStatus("running", `Running ${tool.label}...`);
  showOutput("");
  const runBtn = $inputPanel.querySelector(".btn-run");
  if (runBtn) runBtn.disabled = true;

  const t0 = performance.now();
  try {
    const resp = await fetch(`${tool.endpoint}?${params}`, { signal: abortCtrl.signal });
    const data = await resp.json();
    const ms = (performance.now() - t0).toFixed(0);

    if (data.ok) {
      setStatus("ok", `${tool.label} completed in ${ms} ms`);
      lastOutput = normalizeOutput(data.result);
      if (currentTool === "profile_overlay") {
        showRichOutput(renderProfileOverlay(data.result));
      } else {
        showOutput(lastOutput);
      }
      enableSave(true);
    } else {
      const safeErr = sanitize(data.error || "Unknown error");
      setStatus("err", safeErr);
      showOutput(`Error: ${safeErr}`);
      lastOutput = "";
      enableSave(false);
    }
  } catch (err) {
    if (err.name === "AbortError") return;
    const safeMsg = sanitize(err.message);
    setStatus("err", `Network error: ${safeMsg}`);
    showOutput(`Network error:\n${safeMsg}`);
    lastOutput = "";
    enableSave(false);
  } finally {
    if (runBtn) runBtn.disabled = false;
  }
}

/* -- Helpers --------------------------------------------- */
function setStatus(cls, msg) {
  $status.className = `status ${cls}`;
  $status.textContent = msg;
}

function normalizeOutput(value) {
  if (value === null || value === undefined) return "";
  if (typeof value === "string") return value;
  try {
    return JSON.stringify(value, null, 2);
  } catch (err) {
    return String(value);
  }
}

function renderOverlayPills(items, cls) {
  if (!items || !items.length) return '<span class="overlay-note">None</span>';
  return items.map(item => `<span class="overlay-chip ${cls} overlay-mono">${esc(String(item))}</span>`).join("");
}

function renderOverlayFieldCard(title, raw, decoded, specRef, riskNotes, statusOk) {
  const safeDecoded = esc(decoded || "").replace(/\n/g, "<br>");
  const safeRiskNotes = esc(riskNotes || "").replace(/\n/g, "<br>");
  return `
    <article class="overlay-card">
      <h4>${esc(title)}</h4>
      <div class="overlay-chip ${statusOk ? "ok" : "fail"}">${statusOk ? "Pass" : "Check failed"}</div>
      <dl>
        <dt>Raw bytes or signature</dt>
        <dd class="overlay-mono">${esc(raw || "")}</dd>
        <dt>Decoded meaning</dt>
        <dd>${safeDecoded}</dd>
        <dt>Spec reference</dt>
        <dd>${esc(specRef || "")}</dd>
        <dt>Parser risk notes</dt>
        <dd>${safeRiskNotes}</dd>
      </dl>
    </article>`;
}

function renderProfileOverlay(result) {
  const file = result.file || {};
  const conformance = result.conformance || {};
  const tagTableSummary = result.tagTableSummary || {};
  const requiredTagsSummary = result.requiredTagsSummary || {};
  const transformPath = result.transformPath || {};
  const metadata = result.metadata || {};
  const securitySummary = result.securitySummary || {};
  const gates = conformance.gates || {};

  const headerCards = (result.header || []).map(field => renderOverlayFieldCard(
    `${field.name} @ ${Array.isArray(field.offset) ? field.offset.join("-") : ""}`,
    field.raw,
    String(field.decoded),
    field.specRef,
    field.riskNotes,
    Boolean(field.ok),
  )).join("");

  const tagCards = (result.tagTable || []).map(entry => renderOverlayFieldCard(
    `#${entry.index} ${entry.sig}`,
    `${entry.sig} @ ${entry.offset} (${entry.size} bytes)`,
    `type=${entry.type}`,
    entry.specRef,
    entry.riskNotes,
    Boolean(entry.ok),
  )).join("");

  const requiredCards = (result.requiredTags || []).map(entry => renderOverlayFieldCard(
    entry.sig,
    entry.sig,
    entry.present ? "Present in tag table" : "Missing from tag table",
    entry.specRef,
    entry.riskNotes,
    Boolean(entry.present),
  )).join("");

  const securityCards = (result.security || []).map(entry => renderOverlayFieldCard(
    `${entry.id} ${entry.name}`,
    entry.id,
    `${entry.severity.toUpperCase()} / ${entry.status}`,
    entry.specRef,
    entry.detail,
    false,
  )).join("");

  const transformCards = [
    renderOverlayFieldCard(
      "Forward transform tags",
      (transformPath.forward || []).join(" "),
      (transformPath.forward || []).length ? "Forward device-to-PCS path is present" : "No forward transform tags detected",
      "ICC.1-2022-05 Sec.10.10-Sec.10.13",
      "Validate tag type and payload bounds before traversing LUT or matrix data.",
      (transformPath.forward || []).length > 0,
    ),
    renderOverlayFieldCard(
      "Reverse transform tags",
      (transformPath.reverse || []).join(" "),
      (transformPath.reverse || []).length ? "Reverse PCS-to-device path is present" : "No reverse transform tags detected",
      "ICC.1-2022-05 Sec.10.10-Sec.10.13",
      "Reverse paths should be independently typed and bounds-checked.",
      (transformPath.reverse || []).length > 0,
    ),
    renderOverlayFieldCard(
      "Matrix or TRC tags",
      (transformPath.matrix || []).join(" "),
      (transformPath.matrix || []).length ? "Matrix or tone-response path is present" : "No matrix or TRC path detected",
      "ICC.1-2022-05 Annex G",
      "Channel-specific tags should agree with the declared data color space before transform execution.",
      (transformPath.matrix || []).length > 0,
    ),
    renderOverlayFieldCard(
      "Embedded profile branch",
      transformPath.embedded ? "ICC5" : "none",
      transformPath.embedded ? "Embedded ICC branch present" : "No embedded ICC branch present",
      "ICC Technote Profile Embedding",
      "Never recurse into embedded content until the tag type and bounds are both trusted.",
      !transformPath.embedded,
    ),
  ].join("");

  const metadataCards = [
    renderOverlayFieldCard(
      "Carrier identity",
      `${file.extension || "none"} / ${file.carrier || "Unknown"}`,
      file.extensionMatchesCarrier ? "Extension matches detected carrier" : "Extension and carrier disagree",
      "Carrier sniffing before ICC parsing",
      "Do not trust the file extension when deciding whether the root object is ICC data.",
      Boolean(file.extensionMatchesCarrier),
    ),
    renderOverlayFieldCard(
      "File digest",
      file.sha256 || "",
      `${file.size || 0} bytes`,
      "Filesystem provenance",
      "Show digest and detected file type together so analysts can spot mislabeled samples quickly.",
      true,
    ),
    renderOverlayFieldCard(
      "Profile identity",
      `${metadata.profileClass || ""} / ${metadata.colorSpace || ""} / ${metadata.pcs || ""}`,
      `${file.name || ""}`,
      "ICC.1-2022-05 Sec.7.2",
      "Header identity fields determine whether required-tag logic and transform rules are meaningful.",
      Boolean(gates.header),
    ),
  ].join("");

  return `
    <div class="overlay-shell">
      <section class="overlay-hero">
        <div class="overlay-eyebrow">Layer 1</div>
        <div class="overlay-title-row">
          <div>
            <h2>${esc(file.name || "Profile Overlay")}</h2>
            <p class="overlay-subtitle">Three-layer view for ICC conformance, graph-shaped profile structure, and secure parsing guidance.</p>
          </div>
          <div class="overlay-status-badge ${esc(conformance.status || "warning")}">${esc(conformance.label || "Conformant with warnings")}</div>
        </div>
        <div class="overlay-chip-row">
          <span class="overlay-chip ${gates.header ? "ok" : "fail"}">Header: ${gates.header ? "pass" : "fail"}</span>
          <span class="overlay-chip ${gates.tagTable ? "ok" : "fail"}">Tag table: ${gates.tagTable ? "pass" : "fail"}</span>
          <span class="overlay-chip ${gates.requiredTags ? "ok" : "fail"}">Required tags: ${gates.requiredTags ? "pass" : "fail"}</span>
          <span class="overlay-chip ${conformance.status === "conformant" ? "ok" : conformance.status === "warning" ? "warn" : "fail"}">Score: ${esc(String(conformance.score || 0))}</span>
          <span class="overlay-chip warn">Security warnings: ${esc(String(securitySummary.warnings || 0))}</span>
        </div>
        <div class="overlay-table-wrap">
          <table class="overlay-table">
            <thead>
              <tr>
                <th>Gate</th>
                <th>Status</th>
                <th>Why it matters</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Header</td>
                <td>${gates.header ? "Pass" : "Fail"}</td>
                <td>${esc((conformance.reasons || {}).header || "All fixed-header checks passed.")}</td>
              </tr>
              <tr>
                <td>Tag table</td>
                <td>${gates.tagTable ? "Pass" : "Fail"}</td>
                <td>${esc((conformance.reasons || {}).tagTable || "Tag count, uniqueness, and layout checks passed.")}</td>
              </tr>
              <tr>
                <td>Required tags</td>
                <td>${gates.requiredTags ? "Pass" : "Fail"}</td>
                <td>${esc((conformance.reasons || {}).requiredTags || "Class-specific required tags are present.")}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="overlay-layer">
        <div class="overlay-eyebrow">Layer 2</div>
        <h3>Visual mind map</h3>
        <p class="overlay-note">Click a node to jump to the corresponding secure parsing section.</p>
        <div class="overlay-node-grid">
          <button type="button" class="overlay-node" data-target="overlay-section-header"><strong>Header</strong><span class="overlay-note">128-byte identity envelope and fixed-value checks.</span></button>
          <button type="button" class="overlay-node" data-target="overlay-section-tag-table"><strong>Tag table</strong><span class="overlay-note">Offsets, sizes, alignment, uniqueness, and overlap policy.</span></button>
          <button type="button" class="overlay-node overlay-node-center" data-target="overlay-section-metadata"><strong>Profile identity</strong><span class="overlay-note">${esc(file.carrier || "Unknown")} carrier, ${esc(metadata.profileClass || "unknown class")}, ${esc(metadata.colorSpace || "unknown space")}.</span></button>
          <button type="button" class="overlay-node" data-target="overlay-section-required-tags"><strong>Required tags</strong><span class="overlay-note">Annex G essentials for the declared profile class.</span></button>
          <button type="button" class="overlay-node" data-target="overlay-section-transform-path"><strong>Transform path</strong><span class="overlay-note">Forward, reverse, matrix, and embedded-profile traversal.</span></button>
          <button type="button" class="overlay-node" data-target="overlay-section-security"><strong>Security findings</strong><span class="overlay-note">Warnings and crash-prevention checks from live analyzer output.</span></button>
        </div>
      </section>

      <section class="overlay-layer">
        <div class="overlay-eyebrow">Layer 3</div>
        <h3>Secure parsing guidance</h3>
        <div class="overlay-sections">
          <section class="overlay-section" id="overlay-section-header">
            <h3>Header</h3>
            <p class="overlay-summary">Each header field below shows raw bytes, decoded meaning, the spec anchor, and the parser risk note.</p>
            <div class="overlay-card-grid">${headerCards || '<div class="overlay-note">No header fields available.</div>'}</div>
          </section>
          <section class="overlay-section" id="overlay-section-tag-table">
            <h3>Tag table</h3>
            <div class="overlay-chip-row">
              <span class="overlay-chip ${tagTableSummary.ok ? "ok" : "fail"}">count=${esc(String(tagTableSummary.count || 0))}</span>
              <span class="overlay-chip ${tagTableSummary.overlapPairs ? "fail" : "ok"}">overlaps=${esc(String(tagTableSummary.overlapPairs || 0))}</span>
              <span class="overlay-chip ${tagTableSummary.duplicates && tagTableSummary.duplicates.length ? "fail" : "ok"}">duplicates=${esc(String((tagTableSummary.duplicates || []).length))}</span>
              <span class="overlay-chip ${tagTableSummary.outOfBounds ? "fail" : "ok"}">oob=${esc(String(tagTableSummary.outOfBounds || 0))}</span>
            </div>
            <p class="overlay-summary">${esc(tagTableSummary.reason || "Tag table structure is internally consistent.")}</p>
            <div class="overlay-card-grid">${tagCards || '<div class="overlay-note">No tag entries available.</div>'}</div>
          </section>
          <section class="overlay-section" id="overlay-section-required-tags">
            <h3>Required tags</h3>
            <p class="overlay-summary">${esc(requiredTagsSummary.basis || "Class-specific required tag analysis.")}</p>
            <div class="overlay-card-grid">${requiredCards || '<div class="overlay-note">Required tags were not evaluated because the root object is not a valid ICC profile.</div>'}</div>
          </section>
          <section class="overlay-section" id="overlay-section-transform-path">
            <h3>Transform path</h3>
            <div class="overlay-chip-row">
              <span class="overlay-chip ok">Forward: ${(transformPath.forward || []).length}</span>
              <span class="overlay-chip ok">Reverse: ${(transformPath.reverse || []).length}</span>
              <span class="overlay-chip ok">Matrix/TRC: ${(transformPath.matrix || []).length}</span>
              <span class="overlay-chip ${transformPath.embedded ? "warn" : "ok"}">Embedded: ${transformPath.embedded ? "yes" : "no"}</span>
            </div>
            <div class="overlay-card-grid">${transformCards}</div>
          </section>
          <section class="overlay-section" id="overlay-section-metadata">
            <h3>Metadata and provenance</h3>
            <div class="overlay-card-grid">${metadataCards}</div>
          </section>
          <section class="overlay-section" id="overlay-section-security">
            <h3>Security findings</h3>
            <div class="overlay-chip-row">
              <span class="overlay-chip warn">Warnings: ${esc(String(securitySummary.warnings || 0))}</span>
              <span class="overlay-chip ${securitySummary.critical ? "fail" : "ok"}">Critical: ${esc(String(securitySummary.critical || 0))}</span>
              <span class="overlay-chip ok">Heuristics run: ${esc(String(securitySummary.heuristicsRun || 0))}</span>
            </div>
            <div class="overlay-card-grid">${securityCards || '<div class="overlay-note">No warning-level security findings were returned.</div>'}</div>
          </section>
        </div>
      </section>
    </div>`;
}

function showRichOutput(html) {
  $placeholder.classList.add("hidden-input");
  $pre.classList.add("hidden-input");
  $rich.classList.remove("is-hidden");
  $copyBtn.classList.remove("copy-hidden");
  $rich.innerHTML = html;
  $output.scrollTop = 0;
  const old = document.getElementById("downloadLink");
  if (old) old.remove();
}

function showOutput(text) {
  text = normalizeOutput(text);
  if (!text) {
    $pre.classList.add("hidden-input");
    $rich.classList.add("is-hidden");
    $rich.innerHTML = "";
    $copyBtn.classList.add("copy-hidden");
    $placeholder.classList.remove("hidden-input");
    // Remove any existing download link
    const old = document.getElementById("downloadLink");
    if (old) old.remove();
    return;
  }
  $placeholder.classList.add("hidden-input");
  $rich.classList.add("is-hidden");
  $rich.innerHTML = "";
  $pre.classList.remove("hidden-input");
  $copyBtn.classList.remove("copy-hidden");
  $pre.textContent = sanitize(text);
  $output.scrollTop = 0;

  // Show download link if XML output was truncated
  const old = document.getElementById("downloadLink");
  if (old) old.remove();
  if (currentTool === "xml" && text.includes("[TRUNCATED")) {
    const el = document.getElementById("inp-path");
    if (el && el.value.trim()) {
      const link = document.createElement("a");
      link.id = "downloadLink";
      link.href = `/api/xml/download?path=${encodeURIComponent(el.value.trim())}`;
      link.textContent = "Download Full XML";
      link.className = "download-link";
      link.download = "";
      $output.parentNode.insertBefore(link, $output.nextSibling);
    }
  }
}

function copyOutput() {
  const text = lastOutput || $pre.textContent;
  if (!text) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      $copyBtn.textContent = "Copied!";
      setTimeout(() => { $copyBtn.textContent = "Copy"; }, 1500);
    });
  } else {
    /* Fallback for non-HTTPS contexts */
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.className = "clipboard-offscreen";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    $copyBtn.textContent = "Copied!";
    setTimeout(() => { $copyBtn.textContent = "Copy"; }, 1500);
  }
}

function downloadXml() {
  const el = document.getElementById("inp-path");
  if (!el) return;
  const val = el.value.trim();
  if (!val) { setStatus("err", "Profile path is required"); el.focus(); return; }
  // Trigger browser download via the download endpoint
  const url = `/api/xml/download?path=${encodeURIComponent(val)}`;
  const a = document.createElement("a");
  a.href = url;
  a.download = "";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function enableSave(enabled) {
  const btn = document.getElementById("btnSave");
  if (btn) btn.disabled = !enabled;
}

async function saveOutput() {
  if (!lastOutput) return;

  // Build a descriptive filename
  const tool = TOOLS[currentTool];
  let profileName = "";
  const pathInput = document.getElementById("inp-path") ||
                    document.getElementById("inp-path_a") ||
                    document.getElementById("inp-directory");
  if (pathInput) profileName = pathInput.value.trim().replace(/[^a-zA-Z0-9._-]/g, "_");

  try {
    const resp = await fetch("/api/output/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tool: currentTool,
        text: lastOutput,
        filename: profileName ? `${currentTool}_${profileName}` : currentTool,
      }),
    });
    if (!resp.ok) {
      setStatus("err", "Save failed");
      return;
    }
    // Trigger browser download from response
    const blob = await resp.blob();
    const cd = resp.headers.get("Content-Disposition") || "";
    const fnMatch = cd.match(/filename="?([^"]+)"?/);
    const filename = fnMatch ? fnMatch[1] : `${currentTool}_output.txt`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus("ok", `Saved as ${filename}`);
  } catch (err) {
    setStatus("err", `Save failed: ${sanitize(err.message)}`);
  }
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* Strip C0 control chars (except LF \n and TAB \t) and DEL.
   Mirrors sanitize-sed.sh _strip_ctrl_keep_newlines -- defense-in-depth. */
function sanitize(s) {
  if (!s) return s;
  // eslint-disable-next-line no-control-regex
  return s.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "")
          .replace(/\r/g, "")
          .replace(/\n{4,}/g, "\n\n\n");
}

/* -- Boot ------------------------------------------------ */
$copyBtn.addEventListener("click", copyOutput);
$rich.addEventListener("click", e => {
  const node = e.target.closest("[data-target]");
  if (!node) return;
  const target = document.getElementById(node.getAttribute("data-target"));
  if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
});
const initHash = location.hash.replace(/^#/, "");
if (initHash && TOOLS[initHash]) {
  selectTool(initHash);
} else {
  renderInputs();
  run();
}
</script>
</body>
